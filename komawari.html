<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0">
<title>2026年夏期講習 コマ割ツール</title>
<style>
:root{
  --line:#c9d4e0; --grey:#d5d9dd; --white:#ffffff; --head:#eef2f7;
  --accent:#e8850c; --accent2:#f2a93b; --blue:#2b57c9; --purple:#6a3fd0;
  --err:#e04a4a; --warn:#e8a417; --ok:#2fa36b; --retire:#e8615a; --taiken:#f07a12; --taiken2:#e02b2b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;color:#22303f;background:#f4f6f9;font-size:13px;}
button{font-family:inherit;cursor:pointer;}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.title{font-size:18px;font-weight:800;color:#c0470f;letter-spacing:.5px;}
.toolbtn{border:1px solid var(--line);background:#f7f9fc;border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:600;color:#33465a;}
.toolbtn:hover{background:#eef3fa;}
.toolbtn.primary{background:#2b6fe0;color:#fff;border-color:#2b6fe0;}
.toolbtn.primary:hover{background:#1f5cc4;}
/* 講習 / 通常 モード切替 */
.modeswitch{display:inline-flex;border:1px solid #c9d4e0;border-radius:8px;overflow:hidden;}
.mdbtn{border:none;background:#f7f9fc;padding:6px 14px;font-size:12.5px;font-weight:800;color:#6b7a8c;}
.mdbtn+.mdbtn{border-left:1px solid #c9d4e0;}
.mdbtn.on{background:#2b6fe0;color:#fff;}
.mdbtn:hover:not(.on){background:#eef3fa;}
/* 先生情報ページ */
.tchtbl{width:100%;border-collapse:collapse;font-size:12px;}
.tchtbl th,.tchtbl td{border:1px solid #e3e8ef;padding:3px 5px;text-align:center;white-space:nowrap;}
.tchtbl thead th{position:sticky;top:0;background:#f2f5f9;z-index:5;font-size:10.5px;color:#4a5b6d;}
.tchtbl th.lv{position:sticky;left:0;background:#f7f9fc;z-index:4;text-align:left;min-width:74px;}
.tchtbl select{font-size:12px;border:1px solid #dbe3ec;border-radius:4px;padding:1px;width:44px;text-align:center;}
.sk-o{background:#e6f4ea;color:#1e7a4f;font-weight:800;}
.sk-t{background:#fff4d6;color:#8a6a10;font-weight:800;}
.sk-x{background:#fdecec;color:#b8433a;font-weight:800;}
.sk-n{background:#f4f6f9;color:#a0adbb;}
.tchhd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid #eef1f5;background:#fafbfd;}
.tchhd select,.tchhd input{font-size:12.5px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;}
.tchmeta{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;padding:10px 14px;font-size:12.5px;}
.tchmeta label{display:flex;align-items:center;gap:6px;color:#5a6b7d;}
.tchmeta label b{color:#22303f;font-weight:700;min-width:62px;}
.tchmeta input[type=text]{flex:1 1 auto;min-width:0;padding:3px 6px;border:1px solid var(--line);border-radius:5px;font-size:12px;}
.skwrap{overflow:auto;max-height:46vh;padding:0 14px 10px;}
.tchnote{font-size:11.5px;color:#657486;padding:0 14px 8px;}
.counters{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;}
.cbadge{border-radius:8px;padding:5px 11px;font-weight:700;font-size:12.5px;display:flex;gap:6px;align-items:center;border:1px solid transparent;}
.cbadge b{font-size:15px;}
.cbadge.err{background:#fdecec;color:#c22;border-color:#f4baba;}
.cbadge.warn{background:#fdf6e3;color:#a97a06;border-color:#f0d99a;}
.cbadge.retire{background:#fdeceb;color:#b83b34;border-color:#f2b7b2;}
.cbadge.ok{background:#e9f7f0;color:#1e7a4f;border-color:#b6e2cd;}
.tabs{display:flex;gap:3px;background:linear-gradient(#f4b24d,#e8850c);padding:7px 8px 0;border-radius:9px 9px 0 0;margin:10px 14px 0;}
.tab{background:#fdf1df;color:#a8631a;border:none;padding:8px 20px;border-radius:8px 8px 0 0;font-weight:800;font-size:14px;}
.tab.active{background:#fff;color:#c0470f;}
.tab .cnt{font-size:11px;font-weight:700;margin-left:6px;color:#d0533a;}
.wrap{display:flex;gap:12px;align-items:flex-start;padding:0 14px 40px;}
.boardpane{flex:1 1 auto;min-width:0;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;overflow:auto;max-height:calc(100vh - 130px);}
table.board{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;}
table.board th,table.board td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
table.board thead th{position:sticky;top:0;z-index:20;background:var(--head);font-size:12px;font-weight:700;color:#4a5b6d;padding:7px 4px;text-align:center;white-space:nowrap;}
table.board thead th .lt{display:block;font-size:10.5px;color:#8494a4;font-weight:600;}
.thteacher{position:sticky;left:0;z-index:30;background:var(--head);min-width:120px;width:120px;text-align:left!important;padding-left:10px!important;}
td.tcell{position:sticky;left:0;z-index:10;background:#fbfcfe;min-width:120px;width:120px;padding:5px 8px;vertical-align:middle;border-left:1px solid var(--line);}
td.tcell .tid{font-size:10.5px;color:#93a1b0;font-weight:700;}
td.tcell .tname{font-size:13.5px;font-weight:800;color:#2a3a4b;line-height:1.25;display:flex;align-items:center;gap:4px;}
td.tcell .tload{font-size:11px;font-weight:800;color:#fff;background:#5b7086;border-radius:5px;min-width:18px;height:18px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;}
td.tcell.retire .tload{background:#b8433a;}
td.tcell .tsuf{font-size:10.5px;color:#7d8b99;}
td.tcell.retire{background:#f6a49e;}
td.tcell.retire .tname,td.tcell.retire .tid,td.tcell.retire .tsuf{color:#5a1512;}
td.tcell .tmeta{font-size:10px;color:#8494a4;margin-top:2px;}
td.tcell .tflags{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px;}
.tflag{font-size:9px;background:#eef2f7;border:1px solid #dbe3ec;border-radius:4px;padding:0 4px;color:#61728a;}
.tflag.retire{background:#fff;border-color:#d98;color:#b8433a;}
td.seat{width:auto;min-width:0;height:44px;padding:0;background:var(--white);vertical-align:top;position:relative;}
td.seat.dim{background:#f0f2f5;}
/* 通常コマ：小学生は半幅、中高生は前半+後半にまたがる全幅 */
th.halfcol{font-size:11px;padding:5px 2px!important;}
th.halfcol .hlab{display:block;font-size:11px;}
th .solocnt.inv{visibility:hidden;}
td.seat.halfseat{border-right:1px dashed #b9c6d4;}
td.seat.fullseat{background:var(--white);}
td.seat.fullseat.dim{background:#f0f2f5;}
.halfseat .koma .r1{font-size:9px;}
.halfseat .koma .nm{font-size:11.5px;}
.halfseat .koma .r3{font-size:9px;}
td.seat.blocked{background:repeating-linear-gradient(45deg,#cfd5dc,#cfd5dc 6px,#c4ccd4 6px,#c4ccd4 12px);}
td.seat.seat2{border-bottom:2px solid #bcc8d5;}
td.seat.drop,td.groupcell.drop{outline:2px dashed #2b6fe0;outline-offset:-3px;background:#eaf1fd;}
td.seat.overcap{background:#fdeaea;}
/* 集団授業セル・コマ */
td.groupcell{width:auto;min-width:0;padding:0;vertical-align:top;background:#efe9fb;}
.gkoma{height:100%;min-height:40px;padding:4px 6px;cursor:grab;background:linear-gradient(#efe6ff,#e6dbfb);border-left:3px solid #7a4fd0;border-radius:3px;}
.traycol .gkoma{margin-bottom:4px;border:1px solid #c9b6f0;border-left:3px solid #7a4fd0;}
.gkoma:active{cursor:grabbing;}
.gkoma .gr1{font-size:9px;font-weight:800;color:#6a3fd0;letter-spacing:.5px;}
.gkoma .gr1 .gunset{color:#c0470f;background:#fdeede;border-radius:3px;padding:0 3px;}
.gkoma .gnm{font-size:12.5px;font-weight:800;color:#4a2ba0;line-height:1.15;}
.gkoma .gr3{display:flex;gap:5px;align-items:center;margin-top:1px;}
.gkoma .gcnt{font-size:10px;font-weight:700;color:#6a3fd0;}
.gkoma .gtarget{font-size:9.5px;font-weight:800;color:#fff;background:var(--taiken);border-radius:8px;padding:0 6px;}
/* 集団未割当バッジ */
.cbadge.grp{background:#efe9fb;color:#5a37b0;border-color:#c9b6f0;}
.cbadge.diff{background:#e6f0ff;color:#2350a8;border-color:#b9d0f5;cursor:pointer;}
/* 他ツール連携：相性サイン */
.koma.cp-bad{box-shadow:inset 0 0 0 2px #d9488a;border-radius:4px;}
.koma.cp-good{box-shadow:inset 0 0 0 2px #2fa36b;border-radius:4px;}
.cpbadge{position:absolute;bottom:1px;right:1px;font-size:8.5px;font-weight:800;color:#fff;border-radius:7px;padding:0 4px;z-index:2;line-height:1.5;}
.cpbadge.bad{background:#d9488a;}
.cpbadge.good{background:#2fa36b;}
.cptag{margin-left:auto;font-size:10px;font-weight:800;border-radius:8px;padding:1px 7px;}
.cptag.bad{background:#fdecf3;color:#b82f6a;border:1px solid #f3b9d3;}
.cptag.good{background:#e9f7f0;color:#1e7a4f;border:1px solid #b6e2cd;}
.edot.ok{background:var(--ok);}
/* 女性の先生希望 */
.fpmark{margin-left:3px;font-size:10px;font-weight:800;color:#c2185b;}
.fpsearch{padding:8px 16px;border-bottom:1px solid #eef1f5;}
.fpsearch input{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;}
.fphd{padding:7px 12px 3px;font-size:11px;font-weight:800;color:#5a6b7d;background:#f7f9fc;}
.fpdel,.fpadd{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 9px;border:1px solid;}
.fpdel{background:#fff;border-color:#f2b7b2;color:#b83b34;}
.fpdel:hover{background:#fdeceb;}
.fpadd{background:#fff;border-color:#b9d0f5;color:#2350a8;}
.fpadd:hover{background:#e6f0ff;}
.cmpsrc{padding:5px 12px;font-size:10.5px;color:#6a7889;background:#f7f9fc;border-bottom:1px solid #eef1f5;display:flex;align-items:center;gap:8px;}
.ctbtn{margin-left:auto;font-size:10px;font-weight:700;border:1px solid var(--line);background:#fff;color:#4a5b6d;border-radius:5px;padding:2px 7px;}
.ctbtn:hover{background:#eef3fa;}
.ctbox{padding:8px 12px;background:#fbfcfe;border-bottom:1px solid var(--line);}
.ctrow{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:11px;color:#3a4a5c;}
.ctlab{flex:0 0 120px;color:#5a6b7d;}
.ctrow input[type=range]{flex:1 1 auto;min-width:0;height:16px;}
.ctrow b{flex:0 0 auto;min-width:34px;text-align:right;color:#20456e;font-size:11.5px;}
.ctu{flex:0 0 auto;color:#8a97a5;font-size:10px;}
.ctchk{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;}
.ctfoot{border-top:1px dashed var(--line);padding-top:6px;margin-bottom:0;}
.cbadge.diff:hover{background:#d9e7fb;}
/* 取込時から変更されたコマ＝左上に青い三角 */
.koma.moved::before{content:'';position:absolute;top:0;left:0;width:0;height:0;
  border-style:solid;border-width:9px 9px 0 0;border-color:#2b6fe0 transparent transparent transparent;z-index:2;}
.drow{cursor:pointer;}
.drow:hover{background:#f6f9fd;}
.dpsep td{background:#f2f5f9;color:#3a4a5c;font-size:12px;padding:5px 10px!important;}
.dch{white-space:nowrap;}
.modalfoot .toolbtn{margin-left:6px;}
.dmode{display:inline-flex;gap:4px;margin-right:6px;vertical-align:middle;}
.dprog{margin-left:auto;margin-right:10px;font-size:12.5px;font-weight:700;color:#2350a8;background:#e6f0ff;border:1px solid #b9d0f5;border-radius:8px;padding:2px 10px;}
.dck{width:30px;text-align:center;}
.dck input{width:16px;height:16px;cursor:pointer;}
.dlsep td{background:#fafbfd;color:#7d8b99;font-size:10.5px;font-weight:700;padding:3px 10px!important;}
tr.drow.ddone{opacity:.45;}
tr.drow.ddone td:not(.dck){text-decoration:line-through;}
.dsign{width:22px;text-align:center;font-weight:900;font-size:14px;}
.dsign.sadd{color:#1e7a4f;} .dsign.sdel{color:#b8433a;}
/* 印刷：開いているモーダル（変更点一覧）だけを紙に出す */
@media print{
  @page{margin:12mm;}
  body{background:#fff;}
  .topbar,.tabs,.wrap{display:none!important;}
  .modal{position:static!important;display:block!important;background:none!important;inset:auto!important;}
  .modalbox{width:100%!important;max-width:none!important;max-height:none!important;box-shadow:none!important;border-radius:0!important;}
  .modalhd{background:#fff!important;border-bottom:2px solid #333;}
  .mclose,.modalfoot,.dmode{display:none!important;}
  .modaltbl{overflow:visible!important;max-height:none!important;}
  .modaltbl table{font-size:11px;}
  .drow,.dpsep{page-break-inside:avoid;}
  .dpsep td{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
/* 名簿モーダル */
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(20,28,40,.5);align-items:center;justify-content:center;}
.modalbox{background:#fff;border-radius:12px;width:min(560px,92vw);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3);}
.modalhd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f2ecfb;border-bottom:1px solid #dcd0f0;font-size:15px;color:#4a2ba0;}
.mclose{border:none;background:transparent;font-size:22px;line-height:1;color:#6a5a8a;cursor:pointer;}
.modalmeta{padding:9px 16px;font-size:12px;color:#3a4a5c;border-bottom:1px solid #eef1f5;}
.modaltbl{overflow:auto;padding:0 4px 8px;}
.modaltbl table{border-collapse:collapse;width:100%;font-size:12.5px;}
.modaltbl th,.modaltbl td{border-bottom:1px solid #eef1f5;padding:6px 10px;text-align:left;}
.modaltbl th{position:sticky;top:0;background:#f7f9fc;color:#4a5b6d;font-size:11px;}
.modaltbl tr.tgtrow{background:#fff6ee;}
.tgtbadge{background:var(--taiken);color:#fff;border-radius:8px;padding:1px 8px;font-size:10.5px;font-weight:700;}
.modalfoot{padding:10px 16px;border-top:1px solid #eef1f5;text-align:right;background:#fafbfd;}
.tkcut{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;min-width:190px;}
.koma .nm[data-tk]{cursor:pointer;}
.koma .nm[data-tk]:hover{text-decoration:underline dotted;}
.koma{height:100%;padding:3px 5px 2px;font-size:11px;line-height:1.15;cursor:grab;position:relative;overflow:hidden;}
.koma:active{cursor:grabbing;}
.koma .r1{display:flex;justify-content:space-between;gap:3px;font-size:9.5px;color:#8a97a5;font-weight:600;}
.koma .r1 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.koma .r1 span:last-child{flex:0 0 auto;}
.koma .nm{font-size:12.5px;font-weight:800;color:var(--blue);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.koma .r3 .subj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.koma .r3 .sno{flex:0 0 auto;}
.uchip .ur1{overflow:hidden;}
.uchip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 右パネルを畳んで盤面を広く使う */
body.nopanel .sidepane{display:none;}
.koma.pk .nm{color:var(--purple);}
.koma.taiken .nm{color:var(--taiken);}
.koma.taiken2 .nm{color:var(--taiken2);}
.koma .r3{display:flex;justify-content:space-between;font-size:9.5px;margin-top:1px;}
.koma .subj{color:#2c8a5a;font-weight:700;}
/* 本家の科目色（スクショから抽出）: 英語系=青 / 数学・算数系=緑 / その他=黒 */
.subj.sj-eng{color:#2020c0!important;}
.subj.sj-math{color:#4aab3a!important;}
.subj.sj-other{color:#333!important;}
/* 1対1コマ＝太枠で囲む */
td.seat.solo{box-shadow:inset 2px 0 0 #1b3a63, inset -2px 0 0 #1b3a63;}
td.seat.solo.solotop{box-shadow:inset 2px 0 0 #1b3a63, inset -2px 0 0 #1b3a63, inset 0 2px 0 #1b3a63;}
td.seat.solo.solobtm{box-shadow:inset 2px 0 0 #1b3a63, inset -2px 0 0 #1b3a63, inset 0 -2px 0 #1b3a63;}
/* 時限ヘッダーの1対1カウント */
th .solocnt{display:block;font-size:9.5px;font-weight:700;color:#1b3a63;background:#dbe6f3;border-radius:3px;margin-top:2px;padding:0 3px;}
/* 先生フラグ追加 */
.tflag.newbie{background:#fff4d6;border-color:#e8c86a;color:#9a6b06;font-weight:800;}
/* 新人のランク・メンター入力 */
.nbctrl{display:flex;align-items:center;gap:3px;margin-top:3px;}
.nbrank{width:20px;height:20px;border-radius:5px;border:1px solid #c8b06a;background:#fffaf0;font-size:11px;font-weight:800;color:#8a6a10;padding:0;line-height:1;}
.nbrank.rA{background:#e6f4ea;border-color:#8bc7a0;color:#1e7a4f;}
.nbrank.rB{background:#fff4d6;border-color:#e0bf62;color:#8a6a10;}
.nbrank.rC{background:#fdecec;border-color:#e59a9a;color:#b8433a;}
.nbmentor{flex:1 1 auto;min-width:0;font-size:9.5px;padding:1px 2px;border:1px solid #dbe3ec;border-radius:4px;background:#fff;color:#33465a;}
.nbwarn{color:#fff;background:var(--err);border-radius:50%;width:13px;height:13px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 13px;}
/* 期ごとのメンター設定状況 */
.nbstrip{display:flex;align-items:center;gap:2px;margin-top:2px;}
.pstat{width:13px;height:13px;border-radius:3px;font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1px solid transparent;}
.pstat.ps-same{background:#d8f0e0;border-color:#8bc7a0;color:#1e7a4f;}
.pstat.ps-diff{background:#fde8cf;border-color:#e8a95e;color:#a35a06;}
.pstat.ps-none{background:#eef2f7;border-color:#dbe3ec;color:#a0adbb;}
.nball{margin-left:auto;font-size:8.5px;font-weight:800;padding:1px 4px;border:1px solid #b9d0f5;background:#eaf1fd;color:#2350a8;border-radius:4px;line-height:1.3;white-space:nowrap;}
.nball:hover{background:#d9e7fb;}
.tflag.staff{background:#e6f0ff;border-color:#b9d0f5;color:#2350a8;font-weight:800;}
.tflag.note{background:#f2ecfb;border-color:#c9b6f0;color:#5a37b0;font-weight:800;cursor:help;}
.tflag.note.alert{background:#fdeceb;border-color:#f2b7b2;color:#b83b34;}
/* 担任数バッジ */
.cbadge.tantou{background:#eef4ea;color:#3d6b34;border-color:#c3ddb8;}
.koma .sno{color:#9aa7b4;}
.koma.eerr{box-shadow:inset 0 0 0 2px var(--err);border-radius:4px;}
.koma.ewarn{box-shadow:inset 0 0 0 2px var(--warn);border-radius:4px;}
.koma .ebadge{position:absolute;top:1px;right:1px;width:14px;height:14px;border-radius:50%;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.koma .ebadge.err{background:var(--err);}
.koma .ebadge.warn{background:var(--warn);}
.seat .addhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c3ccd6;font-size:16px;opacity:0;}
.seat.grey .addhint{display:none;}
.seat:hover .addhint{opacity:.6;}
/* right panel */
.sidepane{flex:0 0 340px;width:340px;position:sticky;top:118px;max-height:calc(100vh - 130px);display:flex;flex-direction:column;gap:10px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.card h3{margin:0;padding:8px 12px;font-size:13px;background:#f2f5f9;border-bottom:1px solid var(--line);color:#3a4a5c;display:flex;justify-content:space-between;align-items:center;}
/* パネルタブ（イレギュラー / チェックシート） */
.paneltabs{display:flex;background:#e9eef5;border-bottom:1px solid var(--line);}

<script>
"use strict";
/* localStorageはiframe内やプライベートモードで例外(SecurityError)を投げることがある。
   素で呼ぶと以降のスクリプトが止まり画面が真っ白になるため、必ずこのラッパーを経由する。 */
const LS={
  ok:true,
  get(k){try{return localStorage.getItem(k);}catch(e){LS.ok=false;return null;}},
  set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){LS.ok=false;return false;}},
  del(k){try{localStorage.removeItem(k);}catch(e){LS.ok=false;}}
};
/* ============ CSV parse ============ */
function parseCSV(text){
  text=text.replace(/^﻿/,'').replace(/\r/g,'');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c=='"')q=true;else if(c==','){row.push(cur);cur='';}
      else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur='';}else cur+=c;}}
  if(cur!==''||row.length>1){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.length>1);
}
const digits=s=>(s||'').replace(/\D/g,'');

/* ============ Teachers（取込で作り直せるように） ============ */
const noSpace=s=>(s||'').replace(/[\s　"]/g,'');
let teachers=[], teacherById={}, RETIRE=new Set(), STAFF=new Set(), NEWBIE=new Set(),
    teacherByNoSpace={}, tByRef={};
function buildTeachersFromCSV(csvText){
  const tRows=parseCSV(csvText); tRows.shift();
  teachers=tRows.map(r=>({
    id:(r[0]||'').trim(),
    name:(r[1]||'').replace(/"/g,'').trim(),
    gender:(r[13]||'').trim(),
    retire:(r[14]||'').trim(),
    staff:(r[11]||'').trim()==='1',           // MG/ST（社員スタッフ）
    terms:parseInt((r[9]||'').trim(),10),     // 在籍学期数：マイナス=新人
  })).filter(t=>t.id);
  // 手動で追加/編集/削除した分を反映
  try{
    Object.keys(tmeta||{}).forEach(tid=>{
      const m=tmeta[tid];if(!m)return;
      const idx=teachers.findIndex(t=>t.id===tid);
      if(m.deleted){ if(idx>=0)teachers.splice(idx,1); return; }
      if(idx>=0){ Object.keys(m).forEach(k=>{ if(m[k]!==undefined&&m[k]!=='')teachers[idx][k]=m[k]; }); }
      else teachers.push({id:tid,name:m.name||('先生'+tid),gender:m.gender||'',retire:m.retire||'',
        staff:!!m.staff,terms:(m.newbie?-1:(m.terms!==undefined?m.terms:1)),added:true});
    });
  }catch(e){}
  teachers.sort((a,b)=>a.id<b.id?-1:1);
  teacherById={};teachers.forEach(t=>teacherById[t.id]=t);
  RETIRE=new Set(teachers.filter(t=>t.retire).map(t=>t.id));
  STAFF=new Set(teachers.filter(t=>t.staff).map(t=>t.id));
  NEWBIE=new Set(teachers.filter(t=>!isNaN(t.terms)&&t.terms<0).map(t=>t.id));
  teacherByNoSpace={};teachers.forEach(t=>teacherByNoSpace[noSpace(t.name)]=t.id);
  tByRef={};
  teachers.forEach(t=>{
    const full=t.name, noSp=full.replace(/[\s　]/g,''), sur=full.split(/[\s　]/)[0];
    [full,noSp,sur].forEach(k=>{if(k&&!(k in tByRef))tByRef[k]=t.id;});
  });
}
// 本家の科目色（スクショから抽出）: 英語系=青 / 数学・算数系=緑 / その他=黒
function subjClass(sub){ if(/英/.test(sub))return 'sj-eng'; if(/数|算/.test(sub))return 'sj-math'; return 'sj-other'; }
/* ---- 学年区分とフォレスタ（教材）の種類判定 ---- */
function gradeCat(g){ if(/^小/.test(g))return '小'; if(/^中/.test(g))return '中'; if(/^高/.test(g))return '高'; return '?'; }
// フォレスタは 学年×科目 で別物。例外: 小学英語は学年が変わっても同一テキスト。
// 高校生フォレスタは復習用が無く全て予習用（＝予習/復習の区別が不要）。
function forestaKey(subject,grade){
  const s=normSub(subject);
  if(/小英語|小学英語/.test(s))return '小英語(共通)';
  return grade+' '+s;
}
// 新人先生に任せたい科目（小学算数・小学英語・中学数学・中学英語）
function isNewbieFriendly(subject,grade){
  const s=normSub(subject), c=gradeCat(grade);
  if(/小英語|小学英語/.test(s))return true;
  if(c==='小'&&/算数/.test(s))return true;
  if(c==='中'&&/^数学/.test(s))return true;
  if(c==='中'&&/^英語/.test(s))return true;
  return false;
}

/* ============ 先生スキル（社内ツール「先生情報」と同じ構成） ============ */
const SK_LEVELS=['小学','中学1','中学2・3','高校1','高校2・3'];
const SK_SUBJECTS=['英語','数学・算数','国語','理科','社会','英コミ','論表Ⅰ','論表Ⅱ','数Ⅰ・A','数Ⅱ・B',
  '数Ⅲ・C','化学','物理','生物','地学','古典','言語文化','現代文','歴史総合','世界史','日本史','政経','地理','倫理','公共','小論文','その他'];
const LSSK='komawari_skills_v1', LSTM='komawari_teachermeta_v1';
let skills={};      // {tid:{ "レベル|科目":"○"|"△"|"×"|"ー" }}
let tmeta={};       // {tid:{name,gender,nick,staff,newbie,retire,note,deleted:true}} 手動追加/編集分
try{skills=JSON.parse(LS.get(LSSK)||'{}');}catch(e){}
try{tmeta=JSON.parse(LS.get(LSTM)||'{}');}catch(e){}
/* 社内ツール「先生情報」スキル表より転記（2026-07-25時点・32名） */

  if(grade==='高１')return '高校1';

// コマの科目が備考の対象科目に当たるか（数Ａと数Ⅰ、数Ｂと数Ⅱを取り違えないよう厳密に）
function noteSubHit(komaSub,target){
  const s=normSub(komaSub).replace(/\s/g,'');
  const t=target.replace(/\s/g,'');
  const norm=x=>x.replace(/Ａ/g,'A').replace(/Ｂ/g,'B').replace(/Ｃ/g,'C');
  return norm(s)===norm(t);
}
function checkTeacherNotes(placed,add){
  placed.forEach(k=>{
    const n=TNOTE[k.teacherId]; if(!n)return;
    const s=students[k.sid]; const tn=tShort(k.teacherId);
    (n.ng||[]).forEach(c=>{
      if(!noteSubHit(k.subject,c.sub))return;
      if(c.grade&&s.grade!==c.grade)return;
      add('err','備考',k,`${tn}先生は「${c.sub}」を担当できません（シフト備考: ${n.note}）`);
    });
    (n.warn||[]).forEach(c=>{
      if(!noteSubHit(k.subject,c.sub))return;
      if(c.grade&&s.grade!==c.grade)return;
      add('warn','備考',k,`${tn}先生 ${c.grade||''}「${c.sub}」は要注意（シフト備考: ${n.note}）`);
    });
    // 曜日制約（通常コマのみ。その曜日は他校舎ヘルプ等で不在）
    if(n.day&&MODE==='tsu'&&k.period===n.day)
      add('warn','備考',k,`${tn}先生は${n.day}曜は不在の可能性（シフト備考: ${n.note}）`);
  });
}

// 生徒CSV（student_20260719.csvと同じ67列フォーマット）からデータを構築。取込のたびに呼び直せる。
function buildDataFromCSV(csvText){
  Object.keys(students).forEach(k=>delete students[k]);
  Object.keys(normalTeacher).forEach(k=>delete normalTeacher[k]);
  Object.keys(normalSubs).forEach(k=>delete normalSubs[k]);
  komasK.length=0;komasN.length=0;groupClasses.length=0;skipped=0;
  const sRows=parseCSV(csvText);sRows.shift();
  // --- 事前スキャン: 期と時限をCSVから自動検出（夏期A〜D/冬期など何でも対応） ---
  const perSet={}, timeSet={}, dayTimeSet={};
  sRows.forEach(r=>{ if(!r[0])return;
    for(let i=0;i<10;i++){
      const tim=(r[33+3*i]||'').trim();if(!tim)continue;
      const m=tim.match(/^(.+?期|合宿)\s*(\d{1,2}[:：]\d{2})$/);if(!m)continue;
      const per=m[1], tm=m[2].replace('：',':');
      if(EXCLUDE_PERIOD.test(per))continue;
      perSet[per]=(perSet[per]||0)+1; timeSet[tm]=(timeSet[tm]||0)+1;
    }
    // 通常授業：曜日ごとの時刻を集める
    for(let j=0;j<6;j++){
      const tim=(r[15+3*j]||'').trim();if(!tim)continue;
      const m=tim.match(/^([月火水木金土日])\s*(\d{1,2}[:：]\d{2})$/);if(!m)continue;
      (dayTimeSet[m[1]]=dayTimeSet[m[1]]||{})[m[2].replace('：',':')]=1;
    }});
  periodsK=Object.keys(perSet).sort();                      // Ａ期,Ｂ期,… / 冬期の期名でも自動
  const times=Object.keys(timeSet).sort();                  // "09:30" 等は文字列ソートで時刻順になる
  limitsK=times.map((t,i)=>[t,(i+1)+'限']);
  t2lK={};limitsK.forEach((l,i)=>t2lK[l[0]]=i+1);
  // 通常：曜日順。社内ツールの列構成に合わせ、小学生の限は前半/後半に分割する。
  periodsN=DOW.filter(d=>dayTimeSet[d]);
  limitsNByDay={};
  const t2lN={};
  periodsN.forEach(d=>{
    const kind=(d==='土')?'土':'平日';
    const def=NORMAL_SLOTS[kind], full=NORMAL_FULL[kind]||{};
    const used=Object.keys(dayTimeSet[d]);
    // その限が使われていれば前半・後半の両列を出す（社内ツールと同じ列構成）
    const limUsed={};
    def.forEach(s=>{ if(used.indexOf(s.time)>=0) limUsed[s.limit]=1; });
    Object.entries(full).forEach(([lim,t])=>{ if(used.indexOf(t)>=0) limUsed[lim]=1; });
    const slots=def.filter(s=>limUsed[s.limit]).map(s=>Object.assign({},s));
    // 定義外の時刻は取りこぼさないよう単独列として末尾に足す
    const known={};slots.forEach(s=>known[s.time]=1);
    Object.values(full).forEach(t=>known[t]=1);
    used.filter(t=>!known[t]).sort().forEach(t=>slots.push({limit:0,half:0,time:t,extra:true}));
    limitsNByDay[d]=slots;
    t2lN[d]={};slots.forEach(s=>{t2lN[d][s.time]={limit:s.limit,half:s.half};});
    // 中高生の「限」開始時刻（前半後半にまたがる）
    Object.entries(full).forEach(([lim,t])=>{ if(used.indexOf(t)>=0) t2lN[d][t+'|full']={limit:+lim,half:0}; });
  });
  const groupRaw=[];
  let rowCount=0;
  sRows.forEach(r=>{
    if(!r[0])return;
    rowCount++;
    const s={id:r[0].trim(),name:(r[1]||'').trim()+' '+(r[2]||'').trim(),
      gender:(r[5]||'').trim(),school:(r[6]||'').trim(),grade:(r[7]||'').trim(),
      week:(r[8]||'').trim(),tel1:digits(r[9]),guardian:((r[12]||'')+(r[13]||'')).replace(/\s/g,''),
      hira:((r[3]||'')+(r[4]||'')).trim(),               // ｾｲ+ﾒｲ（他ツールとの氏名照合用）
      tantouId:teacherByNoSpace[noSpace(r[64])]||null};   // 担任スタッフ
    students[s.id]=s;
    normalSubs[s.id]=new Set();
    if(isWithdrawnNow(s.id))return;   // 退塾日を過ぎた生徒はコマを作らない（学籍データだけは残す＝日付を戻せば復活）
    // 通常授業（14..31, 6科目×3）
    for(let j=0;j<6;j++){
      const sub=(r[14+3*j]||'').trim();if(!sub)continue;
      normalSubs[s.id].add(normSub(sub));
      const tea=(r[16+3*j]||'').trim();
      if(tea&&!isTimeF(tea)){const key=s.id+'|'+normSub(sub);if(!(key in normalTeacher))normalTeacher[key]=tea;}
      // 通常コマ盤面用（曜日×時刻）
      const tim=(r[15+3*j]||'').trim();
      const mm=tim.match(/^([月火水木金土日])\s*(\d{1,2}[:：]\d{2})$/);
      if(mm&&!GROUP_RE.test(sub)){
        const day=mm[1], tmS=mm[2].replace('：',':');
        const map=t2lN[day]||{};
        // 中高生は「限」全体（前半+後半にまたがる）、小学生は前半/後半の半幅
        const isElem=(gradeCat(s.grade)==='小');
        const slot=(!isElem&&map[tmS+'|full'])?map[tmS+'|full']:map[tmS];
        if(slot){
          const kid='N'+s.id+'#'+j;
          const tid=(tea&&!isTimeF(tea))?tByRef[tea]:null;
          komasN.push({kid,sid:s.id,subject:sub,period:day,
            limitNo:slot.limit, half:(isElem?slot.half:0), time:tmS, teacherId:tid||null});
        }
      }
    }
    // 講習授業（32..61, 10コマ×3）
    for(let i=0;i<10;i++){
      const sub=(r[32+3*i]||'').trim();if(!sub)continue;
      const tim=(r[33+3*i]||'').trim();const tea=(r[34+3*i]||'').trim();
      const m=tim.match(/^(.+?期|合宿)\s*(\d{1,2}[:：]\d{2})$/);if(!m)continue;
      const period=m[1];const timeStr=m[2].replace('：',':');
      if(periodsK.indexOf(period)<0)continue;                // 合宿など対象外の期はスキップ
      const lim=t2lK[timeStr];if(!lim)continue;
      if(GROUP_RE.test(sub)){groupRaw.push({sid:s.id,subject:normSub(sub),period,limitNo:lim});continue;}
      const kid=s.id+'#'+i;
      if(isTimeF(tea)||!tea){                                // 先生未定 → 待機スペースへ
        komasK.push({kid,sid:s.id,subject:sub,period,limitNo:lim,teacherId:null});
      }else{
        const tid=tByRef[tea];
        if(!tid){skipped++;continue;}
        komasK.push({kid,sid:s.id,subject:sub,period,limitNo:lim,teacherId:tid});
      }
    }
  });
  // 集団授業ブロックを (期,限) だけで集約 ＝ 同じ時間帯は科目が違っても同じ教室・同じ先生1名
  const _gmap={};
  groupRaw.forEach(g=>{const key=g.period+'|'+g.limitNo;
    if(!_gmap[key]){_gmap[key]={gid:'G|'+key,period:g.period,limitNo:g.limitNo,subjects:[],roster:[],teacherId:null};groupClasses.push(_gmap[key]);}
    const gc=_gmap[key];
    if(gc.subjects.indexOf(g.subject)<0)gc.subjects.push(g.subject);
    gc.roster.push({sid:g.sid,subject:g.subject});});
  mergeManualGroups();
  applyMode();
  lastImportInfo={students:rowCount,komas:komasK.length,komasN:komasN.length,groups:groupClasses.length,skipped};
}

// 氏名の正規化（NFKC → カタカナをひらがなへ → 空白/中黒除去 → 主要異体字）
const KANJI_VAR={'髙':'高','﨑':'崎','邊':'辺','邉':'辺','德':'徳','眞':'真','曻':'昇','濵':'浜','塚':'塚'};
function normJoinName(s){
  if(!s)return '';
  let t=String(s).normalize('NFKC');
  t=t.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); // カナ→ひら
  t=t.replace(/[\s　・.,]/g,'');
  t=t.replace(/[髙﨑邊邉德眞曻濵]/g,c=>KANJI_VAR[c]||c);
  return t;
}

/* ---- アンケート：生徒×講師の満足度 ---- */
const LSCT='komawari_compat_th_v1';
const CT_DEF={surveyBad:2.5, surveyGood:4.5, q5Bad:2, gradeBad:-12, gradeGood:10, useYS:true};
let CT=Object.assign({},CT_DEF);
try{CT=Object.assign({},CT_DEF,JSON.parse(LS.get(LSCT)||'{}'));}catch(e){}

const SC14={'満足':5,'まあ満足':4,'ふつう':3,'やや不満':2,'不満':1};
const SC5 ={'大満足':5,'満足':4,'ふつう':3,'やや不満':2,'かえて欲しい':1};
function surveyAvg(r){
  const v=[SC14[r.q1],SC14[r.q2],SC14[r.q3],SC14[r.q4],SC5[r.q5]].filter(x=>typeof x==='number');
  if(!v.length)return null;
  return v.reduce((a,b)=>a+b,0)/v.length;
}
/* ---- 相性シグナルの算出 ----
   key: sid|tid（先生は下3桁で突合）→ {level:'bad'|'good', reasons:[...]} */
let compat={}, compatList=[];
function computeCompat(){
  compat={};compatList=[];
  if(!LINK.loaded)return;
  const push=(sid,tid,level,type,msg,sub)=>{
    if(!sid||!tid)return;
    const k=sid+'|'+tid;
    (compat[k]=compat[k]||{bad:0,good:0,reasons:[]});
    compat[k][level==='bad'?'bad':'good']++;
    compat[k].reasons.push({level,type,msg,sub});
    compatList.push({sid,tid,level,type,msg,sub});
  };
  const last3=t=>String(t||'').replace(/\D/g,'').slice(-3);
  // ① アンケート満足度
  if(LINK.survey){
    const byCode={};teachers.forEach(t=>byCode[last3(t.id)]=t.id);
    LINK.survey.records.forEach(r=>{
      const sid=sidFromName(LINK.survey.aliases[r.studentName]||r.studentName);
      const tid=byCode[String(r.teacherCode||'').replace(/\D/g,'').slice(-3)];
      if(!sid||!tid)return;
      const a=surveyAvg(r); if(a===null)return;
      const q5=SC5[r.q5];
      if(a<=CT.surveyBad||q5<=CT.q5Bad)
        push(sid,tid,'bad','アンケート',`満足度 ${a.toFixed(1)}／⑤「${r.q5||'-'}」`,r.subject);
      else if(a>=CT.surveyGood)
        push(sid,tid,'good','アンケート',`満足度 ${a.toFixed(1)}（高評価）`,r.subject);
    });
  }
  // ② 成績の前回比（担当講師に紐づけ）
  if(LINK.grade){
    const tByName={};teachers.forEach(t=>{
      const full=t.name,noSp=full.replace(/[\s　]/g,''),sur=full.split(/[\s　]/)[0];
      [full,noSp,sur].forEach(k=>{if(k&&!(k in tByName))tByName[k]=t.id;});});
    const S2K={'国語':'kokugo','数学':'sugaku','英語':'eigo','理科':'rika','社会':'shakai'};
    Object.entries(LINK.grade.students).forEach(([no,st])=>{
      if(!students[no])return;                       // コマ組に居ない生徒は対象外
      const sc=st.scores||{};
      const keys=Object.keys(sc).sort((a,b)=>{const A=sc[a],B=sc[b];return (B.year-A.year)||(B.kai-A.kai);});
      if(keys.length<2)return;
      const cur=sc[keys[0]], prev=sc[keys[1]];
      const tt=(LINK.grade.tantou||{})[no]||{};
      Object.entries(S2K).forEach(([jp,k])=>{
        const a=cur[k],b=prev[k];
        if(typeof a!=='number'||typeof b!=='number')return;
        const d=a-b;
        const tname=tt[jp]; if(!tname)return;
        const tid=tByName[String(tname).replace(/[\s　]/g,'')]||tByName[tname];
        if(!tid)return;
        if(d<=CT.gradeBad) push(no,tid,'bad','成績',`${jp} ${b}→${a}（${d}点）`,jp);
        else if(d>=CT.gradeGood) push(no,tid,'good','成績',`${jp} ${b}→${a}（+${d}点）`,jp);
      });
    });
  }
  // ③ YS（友人紹介）＝満足しているサイン。その生徒の全担当に good を付ける
  if(LINK.ys&&CT.useYS){
    const done={};
    LINK.ys.records.forEach(r=>{
      const sid=sidFromName(r.studentName); if(!sid)return;
      if(done[sid])return; done[sid]=1;
      const tids=[...new Set(komas.filter(k=>k.sid===sid&&k.teacherId).map(k=>k.teacherId))];
      tids.forEach(tid=>push(sid,tid,'good','YS','友人紹介あり（塾に満足のサイン）',''));
    });
  }
  compatList.sort((a,b)=>(a.level===b.level?0:a.level==='bad'?-1:1));
}
function compatOf(sid,tid){
  const c=compat[sid+'|'+tid]; if(!c)return null;
  if(c.bad>c.good)return 'bad';
  if(c.good>0&&c.bad===0)return 'good';
  return c.bad?'bad':null;
}

let orig={}, origGroup={};
function snapshotOrig(){orig={};
  komasK.concat(komasN).forEach(k=>orig[k.kid]={teacherId:k.teacherId,limitNo:k.limitNo,period:k.period});
  origGroup={};groupClasses.forEach(g=>origGroup[g.gid]=g.teacherId);}
// 取込時点からの変更点（社内ツールへの転記用）
function computeDiff(){
  const out=[];
  komas.forEach(k=>{const o=orig[k.kid];if(!o)return;
    if((o.teacherId||null)!==(k.teacherId||null))
      out.push({period:k.period,limitNo:k.limitNo,kind:'koma',kid:k.kid,sid:k.sid,subject:k.subject,
        from:o.teacherId,to:k.teacherId});});
  groupClasses.forEach(g=>{const o=origGroup[g.gid];
    if((o||null)!==(g.teacherId||null))
      out.push({period:g.period,limitNo:g.limitNo,kind:'group',gid:g.gid,subject:g.subjects.join('・'),
        from:o||null,to:g.teacherId});});
  // 社内ツールの作業順（期タブ→時限→盤面の先生の並び）に合わせる
  const trow=t=>{const i=teachers.findIndex(x=>x.id===t);return i<0?999:i;};
  out.sort((a,b)=>(PERIODS.indexOf(a.period)-PERIODS.indexOf(b.period))
    ||(a.limitNo-b.limitNo)
    ||(trow(a.to||a.from)-trow(b.to||b.from)));
  out.forEach(d=>d.did=(d.kid||d.gid)+'@'+d.period+'-'+d.limitNo);   // 消し込み用の識別子
  return out;
}

function diffSig(d){return d.did+'|'+(d.from||'')+'>'+(d.to||'');}
function isDone(d){return diffDone[d.did]===diffSig(d);}   // 署名が一致するときだけ「済」
function toggleDone(d){ if(isDone(d))delete diffDone[d.did]; else diffDone[d.did]=diffSig(d);
  try{LS.set(LSDN,JSON.stringify(diffDone));}catch(e){} }

let diffMode='period';   // 'period'=期別 / 'teacher'=先生別
function diffBodyByPeriod(list){
  let rows='',curP='',curL='';
  list.forEach(d=>{
    if(d.period!==curP){curP=d.period;curL='';
      const rest=list.filter(x=>x.period===curP&&!isDone(x)).length;
      rows+=`<tr class="dpsep"><td colspan="5"><b>${curP}</b> <span class="muted">残り${rest}件</span></td></tr>`;}
    if(d.limitNo!==curL){curL=d.limitNo;rows+=`<tr class="dlsep"><td colspan="5">${curL}限</td></tr>`;}
    const s=d.kind==='koma'?students[d.sid]:null;
    const who=s?`<b>${s.name}</b> <span class="muted">${s.school}${s.grade}</span>`:`<b>【集団】</b>`;
    const done=isDone(d);
    rows+=`<tr class="drow ${done?'ddone':''}" data-did="${d.did}" data-p="${d.period}" ${d.kid?`data-kid="${d.kid}"`:''} ${d.gid?`data-gid="${d.gid}"`:''}>
      <td class="dck"><input type="checkbox" ${done?'checked':''} data-ck="${d.did}"></td>
      <td>${d.limitNo}限</td><td>${who}</td><td><span class="subj ${subjClass(d.subject)}">${d.subject}</span></td>
      <td class="dch">${d.from?tShort(d.from)+'先生':'<span class="muted">待機</span>'} <b>→</b> ${d.to?`<b>${tShort(d.to)}先生</b>`:'<span class="muted">待機</span>'}</td></tr>`;});
  return `<table><thead><tr><th></th><th>時限</th><th>生徒</th><th>科目</th><th>変更</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function diffBodyByTeacher(list){
  const map={};   // tid（または'_wait'）-> {add:[],del:[]}
  const touch=(t,k,d)=>{const key=t||'_wait';(map[key]=map[key]||{add:[],del:[]})[k].push(d);};
  list.forEach(d=>{touch(d.to,'add',d);touch(d.from,'del',d);});
  const order=Object.keys(map).sort((a,b)=>a==='_wait'?1:b==='_wait'?-1:(a<b?-1:1));
  let rows='';
  order.forEach(key=>{
    const g=map[key];
    const label=key==='_wait'?'🅿️ 待機スペース':`${tShort(key)} 先生`;
    rows+=`<tr class="dpsep"><td colspan="3"><b>${label}</b> <span class="muted">（+${g.add.length} / −${g.del.length}）</span></td></tr>`;
    const line=(d,sign)=>{
      const s=d.kind==='koma'?students[d.sid]:null;
      const who=s?`<b>${s.name}</b> <span class="muted">${s.school}${s.grade}</span>`:'<b>【集団】</b>';
      const other=sign==='+'?(d.from?tShort(d.from)+'先生から':'待機から'):(d.to?tShort(d.to)+'先生へ':'待機へ');
      const done=isDone(d);
      return `<tr class="drow ${done?'ddone':''}" data-did="${d.did}" data-p="${d.period}" ${d.kid?`data-kid="${d.kid}"`:''} ${d.gid?`data-gid="${d.gid}"`:''}>
        <td class="dck"><input type="checkbox" ${done?'checked':''} data-ck="${d.did}"></td>
        <td class="dsign ${sign==='+'?'sadd':'sdel'}">${sign}</td>
        <td>${d.period} ${d.limitNo}限　${who} <span class="subj ${subjClass(d.subject)}">${d.subject}</span></td>
        <td class="dch muted">${other}</td></tr>`;};
    g.add.forEach(d=>rows+=line(d,'+'));
    g.del.forEach(d=>rows+=line(d,'−'));
  });
  return `<table><thead><tr><th></th><th></th><th>変更内容</th><th>相手</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function decodeCsvBuffer(buf){
  const bytes=new Uint8Array(buf);
  const isUtf8Bom=bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF;
  return new TextDecoder(isUtf8Bom?'utf-8':'shift_jis').decode(buf);
}

  snapshotOrig();

  applyMode();
  if(PERIODS.indexOf(activePeriod)<0)activePeriod=PERIODS[0]||'';
  renderAll();
}

// 待機スペースの高さ: s=小 m=中 l=大 x=折りたたみ（盤面を覆わないように）
const LSTH='komawari_trayh_v1';
let trayH=(function(){try{return LS.get(LSTH)||'m';}catch(e){return 'm';}})();

/* ============ error engine ============ */
function bucketKey(p,t,l,ph){return p+'|'+t+'|'+l+(ph?'|'+ph:'');}
// そのコマが同時に居る「半分」（小学生の前半/後半は別時間なので同席にならない）
function phasesOf(k){return (k.half===1)?[1]:(k.half===2)?[2]:[1,2];}
function buildBuckets(list){const b={};list.forEach(k=>{phasesOf(k).forEach(ph=>{const key=bucketKey(k.period,k.teacherId,k.limitNo,ph);(b[key]=b[key]||[]).push(k);});});return b;}
function tShort(tid){return tid?teacherById[tid].name.split(/[\s　]/)[0]:'—';}
// この科目の全コマ(placements)を1人で担当して1/2・2/2を揃えられる先生を探す（暫定シフト＝現在稼働している限のみ）
function unifyCandidates(placements,sid,subject){
  const res=[];
  teachers.forEach(t=>{
    let ok=true,weak=false;
    for(const p of placements){
      // その限に稼働しているか（＝現在その先生がその限にコマを持っている）だけを条件に。
      // 定員・同校同学年/兄弟の衝突は「入替」で解消できるのでここでは見ない。
      const here=komas.filter(k=>k.period===p.period&&k.teacherId===t.id&&k.limitNo===p.limitNo);
      if(here.length===0){ok=false;break;}                          // 稼働していない限（グレー）
      if(WEAK[t.id]&&WEAK[t.id].forbid&&WEAK[t.id].forbid.some(x=>subject.includes(x))){ok=false;break;} // 担当不可
      if(WEAK[t.id]&&WEAK[t.id].weak&&WEAK[t.id].weak.some(x=>subject.includes(x)))weak=true;            // 苦手
    }
    if(ok){const male=FEMALE_PREF.has(sid)&&t.gender==='男';
      res.push({name:tShort(t.id),weak,retire:RETIRE.has(t.id),male,
        current:placements.some(p=>p.teacherId===t.id)});}
  });
  res.sort((a,b)=>(b.current-a.current)||(a.retire-b.retire)||(a.weak-b.weak)||(a.male-b.male));
  return res;
}
function computeErrors(){
  errors=[];errByKid={};
  const placed=komas.filter(k=>k.teacherId);              // 先生確定コマのみ判定
  const buckets={};
  Object.assign(buckets,buildBuckets(placed));
  // adjacency + capacity
  // 中高生(全幅)のコマは前半・後半の両バケットに入るため、同じ組を二度数えないようにする
  const seenPair={}, seenCap={};
  Object.values(buckets).forEach(arr=>{
    if(arr.length>2){arr.forEach((k,idx)=>{if(idx>=2&&!seenCap[k.kid]){seenCap[k.kid]=1;addErr('err','定員',k,'定員オーバー（1対2まで）');}});}
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
      const pk=[arr[i].kid,arr[j].kid].sort().join('~');
      if(seenPair[pk])continue; seenPair[pk]=1;
      const A=students[arr[i].sid],B=students[arr[j].sid];
      if(A.school&&A.school===B.school&&A.grade===B.grade){
        addErr('err','隣接',arr[i],'同校同学年が隣接: '+A.school+A.grade+'（'+A.name+' / '+B.name+'）');
        addErr('err','隣接',arr[j],'同校同学年が隣接: '+A.school+A.grade+'（'+A.name+' / '+B.name+'）');}
      const sib=(A.tel1&&A.tel1===B.tel1)||(A.guardian&&A.guardian===B.guardian);
      if(sib&&A.id!==B.id){
        addErr('err','隣接',arr[i],'兄弟が隣接: '+A.name+' / '+B.name);
        addErr('err','隣接',arr[j],'兄弟が隣接: '+A.name+' / '+B.name);}
    }
  });
  // 同じ先生が同じ生徒に複数の異なる科目を担当している（科目ごとに専任の先生を付けるのが基本）
  const byST={};
  placed.forEach(k=>{const key=k.sid+'|'+k.teacherId;(byST[key]=byST[key]||[]).push(k);});
  Object.values(byST).forEach(arr=>{
    const subs=[...new Set(arr.map(k=>normSub(k.subject)))];
    if(subs.length>1){
      const tn=teacherById[arr[0].teacherId].name;const sname=students[arr[0].sid].name;
      arr.forEach(k=>{const own=normSub(k.subject);const others=subs.filter(x=>x!==own);
        addErr('err','先生重複',k,tn+'先生は'+sname+'の「'+others.join('・')+'」も担当（同じ先生が複数科目を兼任）');});
    }
  });
  // teacher weak/forbid：先生情報のスキル表を最優先、未設定ならPDF由来のWEAKで補う
  placed.forEach(k=>{
    const tn=teacherById[k.teacherId].name, s=students[k.sid];
    const lv=skLevelOf(s.grade), col=skSubjectOf(k.subject);
    const v=(lv&&col)?skGet(k.teacherId,lv,col):'';
    if(v==='×'){addErr('err','苦手',k,tn+'は「'+lv+' '+col+'」を担当できません（×）');return;}
    if(v==='△'){addErr('warn','苦手',k,tn+'は「'+lv+' '+col+'」が苦手です（△）');return;}
    if(v==='○')return;                       // 明示的に対応可能
    const w=WEAK[k.teacherId];if(!w)return;  // スキル未入力の先生はPDF由来の情報で判定
    if(w.forbid&&w.forbid.some(x=>k.subject.includes(x)))addErr('err','苦手',k,tn+'は「'+k.subject+'」を担当できません');
    else if(w.weak&&w.weak.some(x=>k.subject.includes(x)))addErr('warn','苦手',k,tn+'は「'+k.subject+'」が苦手です');});
  // gender preference
  placed.forEach(k=>{if(FEMALE_PREF.has(k.sid)&&teacherById[k.teacherId].gender==='男')
    addErr('warn','性別',k,students[k.sid].name+'は女性の先生を希望（現在:'+teacherById[k.teacherId].name+'先生）');});
  // シフト表の備考による制約（スキル表では表現できない粒度）
  checkTeacherNotes(placed,addErr);
  // subject continuity per student（グループ単位）
  const bySS={};
  placed.forEach(k=>{const key=k.sid+'|'+normSub(k.subject);(bySS[key]=bySS[key]||[]).push(k);});
  Object.entries(bySS).forEach(([key,arr])=>{
    const tset=[...new Set(arr.map(k=>k.teacherId))];
    if(tset.length>1){
      arr.forEach(k=>markKid(k.kid,'warn'));
      const subN=key.split('|')[1];
      const placements=arr.slice().sort((a,b)=>PERIODS.indexOf(a.period)-PERIODS.indexOf(b.period))
        .map(k=>({period:k.period,limitNo:k.limitNo,teacherId:k.teacherId,kid:k.kid}));
      errors.push({type:'継続',level:'warn',group:true,sid:arr[0].sid,subject:subN,
        placements,normal:normalTeacher[key]||null,candidates:unifyCandidates(placements,arr[0].sid,subN),
        period:placements[0].period,limitNo:placements[0].limitNo,kid:placements[0].kid,teacherId:placements[0].teacherId});
    }
  });
  errors.sort((a,b)=>{const o=PERIODS.indexOf(a.period)-PERIODS.indexOf(b.period);if(o)return o;return a.limitNo-b.limitNo;});
}
function markKid(kid,level){const cur=errByKid[kid];if(!cur||(cur!=='err'&&level==='err'))errByKid[kid]=level;}

/* ============ コマチェックシート（イレギュラーとは別区分） ============ */
let checks=[];
// sheet: 'kou'=講習コマチェックシート専用 / 'nor'=新学期コマチェックシート専用 / 'both'=共通
function addChk(level,type,msg,jump,sheet){checks.push(Object.assign({level,type,msg,sheet:sheet||'both'},jump||{}));}
// 現在のモードで表示すべきチェックか
function chkInSheet(c){const want=(MODE==='kou')?'kou':'nor';return c.sheet==='both'||c.sheet===want;}
function computeChecks(){
  checks=[];
  // ① 1日(=1期)のコマ数は最大6コマ / フルコマ時は休憩を2・3限に置かない
  PERIODS.forEach(p=>{
    teachers.forEach(t=>{
      const slots=new Set();
      komas.filter(k=>k.period===p&&k.teacherId===t.id).forEach(k=>slots.add(k.limitNo));
      groupClasses.filter(g=>g.period===p&&g.teacherId===t.id).forEach(g=>slots.add(g.limitNo));
      if(slots.size===0)return;
      if(slots.size>6)
        addChk('err','コマ数',`${tShort(t.id)}先生 ${p}：${slots.size}コマ（1日最大6コマを超過）`,{period:p},'kou');
      else if(slots.size===6){
        const free=[1,2,3,4,5,6,7].filter(l=>!slots.has(l));
        if(free.length===1&&(free[0]===2||free[0]===3))
          addChk('warn','コマ数',`${tShort(t.id)}先生 ${p}：フルコマで休憩が${free[0]}限（2・3限の休憩は厳しい）`,{period:p},'kou');
      }
    });
  });
  if(MODE==='kou'){
  // ② 集団授業は生徒12名につき先生1名
  groupClasses.forEach(g=>{
    if(g.roster.length>12)
      addChk('err','集団定員',`${g.period}${g.limitNo}限 集団：${g.roster.length}名（12名超→先生をもう1名）`,{period:g.period,gid:g.gid},'kou');
  });
  // ③ スタッフ(MG/ST)の集団授業は最大2コマまで
  STAFF.forEach(tid=>{
    const n=groupClasses.filter(g=>g.teacherId===tid).length;
    if(n>2) addChk('err','スタッフ集団',`${tShort(tid)}先生：集団授業${n}コマ（スタッフは最大2コマ）`,{},'kou');
  });
  }
  // ④ スタッフは自担任の生徒を優先的に持つ
  komas.filter(k=>k.teacherId&&STAFF.has(k.teacherId)).forEach(k=>{
    const s=students[k.sid];
    if(s.tantouId&&s.tantouId!==k.teacherId)
      addChk('warn','担任',`${tShort(k.teacherId)}先生が担当：${s.name}（担任は${tShort(s.tantouId)}先生）`,{period:k.period,kid:k.kid});
  });
  // ⑥ 1対2の学年差（小学生の隣に高校生・中3は避ける）
  const chkBuckets={};
  Object.assign(chkBuckets,buildBuckets(komas.filter(k=>k.teacherId)));
  const seenGp={};
  Object.values(chkBuckets).forEach(arr=>{
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
      const pk=[arr[i].kid,arr[j].kid].sort().join('~');
      if(seenGp[pk])continue; seenGp[pk]=1;
      const A=students[arr[i].sid],B=students[arr[j].sid];
      const ca=gradeCat(A.grade), cb=gradeCat(B.grade);
      const far=(x,y,gx,gy)=>x==='小'&&(y==='高'||gy==='中３');
      if(far(ca,cb,A.grade,B.grade)||far(cb,ca,B.grade,A.grade))
        addChk('warn','学年差',`${arr[i].period} ${arr[i].limitNo}限 ${tShort(arr[i].teacherId)}先生：${A.grade}${A.name} と ${B.grade}${B.name} が同じ枠（小学生と高校生/中3の組合せは避けたい）`,
          {period:arr[i].period,kid:arr[i].kid});
    }});
  // ⑦ 新人先生：担当科目と教材(フォレスタ)の種類
  NEWBIE.forEach(tid=>{
    PERIODS.forEach(p=>{
      const mine=komas.filter(k=>k.teacherId===tid&&k.period===p);
      if(!mine.length)return;
      // 推奨外の科目
      mine.forEach(k=>{const s=students[k.sid];
        if(!isNewbieFriendly(k.subject,s.grade))
          addChk('warn','新人科目',`${tShort(tid)}先生 ${p} ${k.limitNo}限：${s.grade}${normSub(k.subject)}（新人には小学算数/小学英語/中学数学/中学英語を優先したい）`,
            {period:p,kid:k.kid});});
      // フォレスタの種類数（1期3種類以内）
      const keys=[...new Set(mine.map(k=>forestaKey(k.subject,students[k.sid].grade)))];
      if(keys.length>3)
        addChk('warn','教材',`${tShort(tid)}先生 ${p}：フォレスタ${keys.length}種類（${keys.join(' / ')}）＝3種類以内にしたい`,{period:p},'kou');
    });
  });
  // ⑧【新学期シート】新人は「1つだけの学年科目」を作らない（小学は除く）＝同じ学年科目を2コマ以上で揃える
  NEWBIE.forEach(tid=>{
    PERIODS.forEach(p=>{
      const mine=komas.filter(k=>k.teacherId===tid&&k.period===p);
      if(!mine.length)return;
      const cnt={};
      mine.forEach(k=>{const s=students[k.sid];
        if(gradeCat(s.grade)==='小')return;                    // 小学生は除外
        const key=s.grade+' '+normSub(k.subject);
        (cnt[key]=cnt[key]||[]).push(k);});
      Object.entries(cnt).forEach(([key,arr])=>{
        if(arr.length===1)
          addChk('warn','学年科目',`${tShort(tid)}先生 ${p}：「${key}」が1コマだけ（新人は同じ学年科目を2コマ以上で揃えたい）`,
            {period:p,kid:arr[0].kid},'nor');});
    });
  });
  // ⑤ 新人先生のランク(A/B/C)とメンター
  NEWBIE.forEach(tid=>{
    const info=newbieInfo[tid]||{}, mm=info.mentor||{};
    const activePs=PERIODS.filter(p=>workingInPeriod(tid,p));
    if(!activePs.length)return;                                   // どの期にも入っていない新人は対象外
    if(!info.rank) addChk('warn','新人',`${tShort(tid)}先生：ランク(A/B/C)が未設定`,{});
    activePs.forEach(p=>{
      const m=mm[p];
      if(!m) addChk('warn','新人',`${tShort(tid)}先生 ${p}：メンター未設定`,{period:p});
      else if(!workingInPeriod(m,p)) addChk('err','新人',`${tShort(tid)}先生 ${p}：メンター(${tShort(m)}先生)がこの期に稼働していません`,{period:p});
    });
    const used=[...new Set(activePs.map(p=>mm[p]).filter(Boolean))];
    if(used.length>1) addChk('warn','新人',`${tShort(tid)}先生：メンターが期でバラバラ（${used.map(x=>tShort(x)).join(' / ')}）`,{});
  });
  checks.sort((a,b)=>(PERIODS.indexOf(a.period)-PERIODS.indexOf(b.period))||(a.level===b.level?0:a.level==='err'?-1:1));
}
function addErr(level,type,k,msg){
  errors.push({level,type,period:k.period,limitNo:k.limitNo,sid:k.sid,kid:k.kid,teacherId:k.teacherId,msg});
  markKid(k.kid,level);
}

/* ============ rendering ============ */
// 同一生徒・同一科目の中で「何コマ目 / 総コマ数」（期→時限順）
function computeSeq(){
  const by={};
  komas.forEach(k=>{const key=k.sid+'|'+normSub(k.subject);(by[key]=by[key]||[]).push(k);});
  Object.values(by).forEach(arr=>{
    arr.sort((a,b)=>{const o=PERIODS.indexOf(a.period)-PERIODS.indexOf(b.period);if(o)return o;return (a.limitNo||0)-(b.limitNo||0);});
    arr.forEach((k,i)=>{k.seq=i+1;k.seqTotal=arr.length;});
  });
}
// 盤面の列を「限」単位にまとめる。通常モードの5限などは前半/後半の2列を1グループにする。
function limitGroups(){
  if(MODE!=='tsu') return LIMITS.map((l,i)=>({limit:i+1,cols:[{time:l[0],label:l[1],half:0}]}));
  const out=[],idx={};
  (LIMITS||[]).forEach(s=>{
    const key=s.limit||('x'+s.time);
    if(!(key in idx)){idx[key]=out.length;out.push({limit:s.limit,cols:[]});}
    out[idx[key]].cols.push(s);
  });
  out.forEach(g=>g.cols.sort((a,b)=>a.half-b.half));
  return out;
}
function seatMapFor(period){
  const m={};
  komas.filter(k=>k.period===period&&k.teacherId).forEach(k=>{const key=k.teacherId+'|'+k.limitNo;(m[key]=m[key]||[]).push(k);});
  Object.values(m).forEach(a=>a.forEach((k,i)=>k.pos=i+1));
  return m;
}
function greyKey(p,t,l,s){return p+'|'+t+'|'+l+'|'+s;}
// 暫定シフト表示: その先生がその時限に現在コマを持っていれば「稼働中(白)」、無ければ薄グレー。
// ※グレーでも配置は可能（見た目の目印のみ）。手動「不可指定」だけが配置ブロック。
function slotWorking(p,tid,l){return komas.some(k=>k.period===p&&k.teacherId===tid&&k.limitNo===l)||groupClasses.some(g=>g.teacherId===tid&&g.period===p&&g.limitNo===l);}
// 通常モードはシフト表（○＝授業に入れる）を正とする。half=0は中高の全幅枠。
function shiftHas(tid,day,limit,half){
  const d=(NORMAL_SHIFT[tid]||{})[day]; if(!d)return false;
  return d.indexOf(limit+'_'+half)>=0;
}
function shiftKnown(tid){return !!NORMAL_SHIFT[tid];}
function cellDim(p,tid,l,half){
  if(MODE==='tsu'&&shiftKnown(tid))return !shiftHas(tid,p,l,half||0);  // シフトに○が無い＝薄グレー
  return !slotWorking(p,tid,l);                                        // 講習モードは従来どおり暫定
}
function manualBlocked(p,tid,l,s){return grey.has(greyKey(p,tid,l,s));}  // 手動「不可指定」＝配置ブロック
// 集団授業は講習モードのみ（通常コマ盤面には出さない）
function groupInMode(g){return g.manual? g.mode===MODE : MODE==='kou';}  // CSV由来の集団は講習のみ／手動はモードごと
function groupAssignedMap(){const m={};
  groupClasses.forEach(g=>{if(g.teacherId&&groupInMode(g))m[g.period+'|'+g.teacherId+'|'+g.limitNo]=g;});return m;}
function unassignedGroups(){return groupClasses.filter(g=>!g.teacherId&&groupInMode(g));}
function renderTabs(){
  const cnt={};PERIODS.forEach(p=>cnt[p]=0);
  errors.forEach(e=>{if(e.level==='err')cnt[e.period]++;});
  document.getElementById('tabs').innerHTML=PERIODS.map(p=>
    `<button class="tab ${p===activePeriod?'active':''}" data-p="${p}">${p}${cnt[p]?`<span class="cnt">${cnt[p]}</span>`:''}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activePeriod=b.dataset.p;renderAll();});
}
let movedSet=new Set();

  LIMITS=limitsFor(activePeriod);          // 通常モードは曜日ごとに時刻が違う

    teachers.forEach(t=>{

    solo[g0.limit]=n;});
  let h='<table class="board"><thead><tr><th class="thteacher">先生</th>';

    }});
  h+='</tr></thead><tbody>';
  const gmap=groupAssignedMap();
  const rowTeachers=visibleTeachers();
  updateFltBtn(activeCount());
  rowTeachers.forEach(t=>{
    const blocks=new Set(komas.filter(k=>k.teacherId===t.id).map(k=>k.period+'|'+k.limitNo));
    groupClasses.filter(g=>g.teacherId===t.id).forEach(g=>blocks.add(g.period+'|'+g.limitNo));
    const load=blocks.size;
    for(let seat=0;seat<2;seat++){
      h+='<tr>';
      if(seat===0){
        h+=`<td class="tcell ${RETIRE.has(t.id)?'retire':''}" rowspan="2">
          <div class="tid">#${t.id}</div>

function canDropHere(cell){
  if(!dragId)return false;
  const limit=+cell.dataset.l, kind=cell.dataset.kind;
  const cellHalf=+(cell.dataset.h||0);
  if(limit!==dragLimit)return false;                       // 限またぎ禁止（申込時限は固定）
  if(dragType!=='group'){
    // 小学生(前半/後半)は自分の半分にのみ。中高生(全幅)は半幅セルには置けない。
    if(dragHalf){ if(kind==='tray'){ if(cellHalf!==dragHalf)return false; }
                  else if(cellHalf!==dragHalf&&cellHalf!==0)return false; }
    else if(cellHalf!==0)return false;
  }
  if(kind==='tray')return true;                            // 待機（同じ限・同じ半分）はOK
  const tid=cell.dataset.t;
  if(dragType==='group')return true;                       // 集団はseat/seatgどちらでもOK（個別は待避）
  if(kind==='seatg')return false;                          // 集団セルには個別を置けない
  if(manualBlocked(activePeriod,tid,limit+'_'+cellHalf,+cell.dataset.s))return false;
  return true;
}

      if(dragType==='group')assignGroup(dragId,cell.dataset.t,+cell.dataset.l);
      else dropKoma(dragId,cell.dataset.t,+cell.dataset.l,+cell.dataset.s);});

function dropKoma(kid,t2,l2,seat){
  const S=komas.find(k=>k.kid===kid);if(!S)return;
  const sm=seatMapFor(activePeriod);
  // 同じ「半分」に居るコマ同士で席を入れ替える（小学生の前半/後半は別枠）
  const all=sm[t2+'|'+l2]||[];
  const same=all.filter(k=>(k.half||0)===(S.half||0));
  const existing=same[seat]&&same[seat].kid!==kid?same[seat]:null;
  if(existing){existing.teacherId=S.teacherId;existing.limitNo=S.limitNo;} // 入替（Sが未定なら相手を待機へ）
  S.teacherId=t2;S.limitNo=l2;
  save();renderAll();
}
function parkKoma(kid){const S=komas.find(k=>k.kid===kid);if(!S)return;
  S.teacherId=null;save();renderAll();}
// 集団を先生・限に割当。既存の個別コマは待機へ退避、既存の集団は待機へ戻す。
function assignGroup(gid,t2,l2){
  const g=groupClasses.find(x=>x.gid===gid);if(!g)return;
  komas.filter(k=>k.period===activePeriod&&k.teacherId===t2&&k.limitNo===l2).forEach(k=>k.teacherId=null); // 個別を退避
  groupClasses.filter(x=>x.teacherId===t2&&x.period===activePeriod&&x.limitNo===l2&&x.gid!==gid).forEach(x=>x.teacherId=null);
  g.teacherId=t2;save();renderAll();}

/* ============ バックアップ（ファイルに保存／復元） ============ */
/* ブラウザ保存(localStorage)はブラウザ側の都合で消えることがある（特に file:// で開いた場合）。
   作業内容をファイルに書き出せるようにして、消えても確実に戻せるようにする。
   キーの一覧は関数にして呼び出し時に評価する（constの宣言順に依存しないため）。 */
function backupKeys(){return [LSK,LSK+'_tsu',LSG,LSGRP,LSNB,LSSCSV,LSTCSV,LSTK,LSDN,LSTH,LSCT,LSFP,LSMG,LSFLT,LSMODE,LSPN,LSWD];}
/* ============ スプレッドシート同期 ============
   個人情報（生徒名・電話番号）はこのHTMLには一切埋め込まない。
   実データはApps Script経由でしか取得できず、合言葉の照合はGoogle側で行われるため、
   このファイルのソースを見てもデータは読めない。 */
const LSSYNC='komawari_syncCfg_v1';
function syncCfg(){try{return JSON.parse(LS.get(LSSYNC)||'{}');}catch(e){return {};}}
function saveSyncCfg(c){LS.set(LSSYNC,JSON.stringify(c));}
function syncMsgSet(text,color){
  const el=document.getElementById('syncMsgBox');
  if(el){el.textContent=text;el.style.color=color||'#6a7889';}
}
// コマ組の全データ（取込CSVと手動設定すべて）をまとめる
function syncPayload(){
  const d={_v:1,csv:{student:curStudentCsv,teacher:curTeacherCsv},keys:{}};
  backupKeys().forEach(k=>{const v=LS.get(k);if(v!==null&&v!==undefined)d.keys[k]=v;});
  return d;
}
function applySyncPayload(d){
  if(d.csv){
    if(d.csv.student){curStudentCsv=d.csv.student;LS.set(LSSCSV,d.csv.student);}
    if(d.csv.teacher){curTeacherCsv=d.csv.teacher;LS.set(LSTCSV,d.csv.teacher);}
  }
  if(d.keys)Object.keys(d.keys).forEach(k=>{if(backupKeys().indexOf(k)>=0)LS.set(k,d.keys[k]);});
}
async function syncSave(){
  const c=syncCfg();
  if(!c.url||!c.key){syncMsgSet('接続先URLと合言葉を入力してください','#b8433a');return;}
  if(!curStudentCsv){syncMsgSet('保存するデータがありません。先に生徒CSVを取り込んでください。','#b8433a');return;}
  syncMsgSet('スプシに保存中…','#6a7889');
  try{
    const res=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key:c.key,tool:'komawari',data:JSON.stringify(syncPayload())})});
    const d=await res.json();
    if(d.ok)syncMsgSet('✅ 保存しました（'+new Date().toLocaleTimeString()+'）','#1e7a4f');
    else syncMsgSet('エラー: '+(d.error||'不明'),'#b8433a');
  }catch(e){syncMsgSet('通信エラー: ネット接続を確認してください','#b8433a');}
}
async function syncLoad(silent){
  const c=syncCfg();
  if(!c.url||!c.key){syncMsgSet('接続先URLと合言葉を入力してください','#b8433a');return false;}
  if(!silent&&curStudentCsv&&!confirm('スプシの内容で、この端末のデータを上書きします。よろしいですか？'))return false;
  syncMsgSet('スプシから読込中…','#6a7889');
  try{
    const res=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key:c.key,tool:'komawari',action:'load'})});
    const d=await res.json();
    if(!d.ok){syncMsgSet('エラー: '+(d.error||'不明'),'#b8433a');return false;}
    if(!d.data){syncMsgSet('スプシにまだデータがありません（先に「スプシに保存」してください）','#b8433a');return false;}
    applySyncPayload(JSON.parse(d.data));
    syncMsgSet('✅ 読み込みました。再読込します…','#1e7a4f');
    setTimeout(()=>location.reload(),700);
    return true;
  }catch(e){syncMsgSet('通信エラー: ネット接続を確認してください','#b8433a');return false;}
}

function backupSave(){
  const d={_v:1,_at:new Date().toISOString()};
  let cnt=0;
  backupKeys().forEach(k=>{const v=LS.get(k);if(v!==null&&v!==undefined){d[k]=v;cnt++;}});
  if(!cnt){alert('保存されている内容がありません。');return;}
  const p=n=>String(n).padStart(2,'0'), t=new Date();
  const nm='コマ割バックアップ_'+t.getFullYear()+p(t.getMonth()+1)+p(t.getDate())+'_'+p(t.getHours())+p(t.getMinutes())+'.json';
  const url=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=nm;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  const el=document.getElementById('autosave');if(el)el.textContent='✓ '+nm+' に保存';
}
function backupLoad(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let d=null;
    try{d=JSON.parse(rd.result);}catch(e){alert('バックアップファイルとして読めませんでした。');return;}
    if(!d||typeof d!=='object'||!d._v){alert('このツールのバックアップファイルではないようです。');return;}
    const when=String(d._at||'').slice(0,16).replace('T',' ');
    if(!confirm('バックアップ（'+when+'）を復元します。今の内容は上書きされます。よろしいですか？'))return;
    backupKeys().forEach(k=>{ if(Object.prototype.hasOwnProperty.call(d,k))LS.set(k,d[k]); else LS.del(k); });
    location.reload();
  };
  rd.readAsText(file);
}
