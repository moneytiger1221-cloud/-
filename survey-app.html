   設定画面は縦に長く、上部のバーに出しても見えないため、固定表示にする。 */

  background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;

<body>
<div id="app"></div>
<div id="toastbox"></div>
<div id="modal"></div>

<script>
// ════════════════════════════════════════════════════════════
// ①〜④用スコア（満足5/まあ満足4/ふつう3/やや不満2/不満1）
const SCORE_Q14 = { "満足":5,"まあ満足":4,"ふつう":3,"やや不満":2,"不満":1 };
// ⑤総合用スコア（大満足5/満足4/ふつう3/やや不満2/かえてほしい1）
const SCORE_Q5  = { "大満足":5,"満足":4,"ふつう":3,"やや不満":2,"かえて欲しい":1,"かえてほしい":1 };
// 後方互換（色判定などで使う汎用表）
const SCORE_MAP = Object.assign({}, SCORE_Q14, SCORE_Q5);
const Q5_COLOR  = { "大満足":"#22c55e","満足":"#86efac","まあ満足":"#fde68a","ふつう":"#94a3b8","やや不満":"#fb923c","かえて欲しい":"#ef4444","不満":"#ef4444" };
const Q5_ORDER  = ["大満足","満足","まあ満足","ふつう","やや不満","かえて欲しい"];
const CHANGE_Q5 = new Set(["かえて欲しい","やや不満","不満"]);

// 高校細目 → 中学5教科 への変換マッピング
const SUBJECT_MAP = [
  ["国語", ["国語","現代文","現代の国語","古典","古文","漢文","言語文化","論理国語","文学国語","国語表現","作文"]],
  ["数学", ["数学","数Ⅰ","数I","数Ⅱ","数II","数Ⅲ","数III","数A","数Ａ","数B","数Ｂ","数C","数Ｃ","算数"]],
  ["英語", ["英語","英コミ","英語コミュニケーション","コミュ英","論表","論理表現","英表","英語表現","リーディング","ライティング"]],
  ["理科", ["理科","物理","物理基礎","化学","化学基礎","生物","生物基礎","地学","地学基礎"]],
  ["社会", ["社会","地理","地理総合","歴史","歴史総合","日本史","世界史","地理歴史","公共","倫理","政治経済","政経","現代社会","公民"]],
];
// 5教科に当てはまらないが、照合する独立科目（担当も回答もこの科目名なら一致）
const SUBJECT_STANDALONE = ["総合型","総合型選抜","小論文"];
// 完全に照合対象外（担当ペアからも除外する科目）
const SUBJECT_IGNORE = ["探究","探求","推薦","面接","志望理由",
  "英単語DOJO","英単語dojo","DOJO","キュレオ","入自理","入自社",
  "算数","小国語","小学英語","入門"];

function toCoreSubject(s){
  s=String(s||"").trim();
  if(!s) return "";
  if(SUBJECT_IGNORE.some(x=>s.includes(x))) return "__ignore__";
  // 総合型・小論文は5教科に混ぜず、その科目名のまま照合
  for(const x of SUBJECT_STANDALONE){ if(s.includes(x)) return x==="総合型選抜"?"総合型":x; }
  for(const [core,list] of SUBJECT_MAP){
    if(core===s) return core;
    if(list.some(x=>s.includes(x)||x.includes(s))) return core;
  }
  return "__unknown__"; // 分類不明
}
// カナ（半角/全角）→ひらがな
function toHira(s){
  s=String(s||"").normalize("NFKC");
  return s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
// 異体字の正規化テーブル（旧字・異体字 → 常用字）。名前でよく使われるもの。
const KANJI_VARIANTS = {
  "髙":"高","﨑":"崎","嵜":"崎","邊":"辺","邉":"辺","德":"徳","眞":"真",
  "廣":"広","澤":"沢","齋":"斎","齊":"斉","濱":"浜","國":"国","榮":"栄",
  "龍":"竜","瀨":"瀬","渕":"淵","條":"条","桒":"桑","靑":"青","𠮷":"吉",
  "槇":"槙","萬":"万","與":"与","盃":"杯",
};
function normName(s){
  let str=toHira(s);
  str=str.replace(/./g,c=>KANJI_VARIANTS[c]||c); // 異体字を1文字ずつ置換
  return str.replace(/[\s　・･,，、]/g,"").trim();
}
// 学年が小学生かどうか
function isElementary(grade){ return /小|小学|^[1-6]年$/.test(String(grade||"")); }
// 先生名字→先生コード（名簿roster利用、姓の一致）
function teacherNameToCode(name, roster){
  name=String(name||"").trim();
  if(!name) return "";
  const entries=Object.entries(roster);
  const seiOf=t=>(t.name||"").split(/[ 　]/)[0];
  // ① フルネーム完全一致
  for(const [code,t] of entries){ if(name===t.name) return code; }
  // ② 姓の完全一致（「宮本」=「宮本」を優先、「宮」には誤マッチさせない）
  for(const [code,t] of entries){ if(seiOf(t)===name) return code; }
  // ③ 名簿名が入力名で始まる（入力が姓のみで名簿がフルネーム等）。最長一致を採用
  let best="", bestLen=-1;
  for(const [code,t] of entries){
    const sei=seiOf(t); if(!sei) continue;
    // 入力「姓＋名」←→名簿の「姓」のように、入力が姓で始まるケースも拾う
    if(name.startsWith(sei) || sei.startsWith(name)){
      const matchLen=Math.min(name.length, sei.length);
      if(matchLen>bestLen){ bestLen=matchLen; best=code; }
    }
  }
  return best;
}

const SAMPLE_RESPONSES = [
  {id:1,campus:"戸塚西口",studentName:"いしわたすかい",grade:"中２",teacherCode:"291",subject:"英語",q1:"ふつう",q2:"ふつう",q3:"ふつう",q4:"ふつう",q5:"ふつう",comment:"変えない"},
  {id:2,campus:"戸塚西口",studentName:"いしわたすかい",grade:"中２",teacherCode:"291",subject:"英語",q1:"ふつう",q2:"ふつう",q3:"ふつう",q4:"ふつう",q5:"ふつう",comment:"変えない"},
  {id:3,campus:"戸塚西口",studentName:"おおがねちえり",grade:"中３",teacherCode:"279",subject:"英語",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:4,campus:"戸塚西口",studentName:"おおがねちえり",grade:"中３",teacherCode:"299",subject:"数学",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:5,campus:"戸塚西口",studentName:"たかはし ゆうと",grade:"中３",teacherCode:"289",subject:"社会",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:6,campus:"戸塚西口",studentName:"たかはし ゆうと",grade:"中３",teacherCode:"310",subject:"国語",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:7,campus:"戸塚西口",studentName:"たかはし ゆうと",grade:"中３",teacherCode:"322",subject:"英語",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:8,campus:"戸塚西口",studentName:"たかはし ゆうと",grade:"中３",teacherCode:"301",subject:"理科",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:9,campus:"戸塚西口",studentName:"たかはし ゆうと",grade:"中３",teacherCode:"328",subject:"数学",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:10,campus:"戸塚西口",studentName:"いずみしゅうご",grade:"中１",teacherCode:"289",subject:"数学",q1:"まあ満足",q2:"まあ満足",q3:"まあ満足",q4:"まあ満足",q5:"大満足",comment:""},
  {id:11,campus:"戸塚西口",studentName:"いずみしゅうご",grade:"中１",teacherCode:"301",subject:"英語",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
];

const SAMPLE_ROSTER = {};  // 公開版のため空。先生名簿は先生CSV取込またはスプシ同期で入る

// ════════════════════════════════════════════════════════════
const LS = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch{ return def; } },
  set(k,v){
    try{
      const str=JSON.stringify(v);
      localStorage.setItem(k,str);
      // 書き込めたか確認（容量オーバーの場合サイレントに失敗することがある）
      if(localStorage.getItem(k)===null){
        console.warn("LS write silently failed:", k);
        return false;
      }
      return true;
    }catch(e){
      // 容量オーバーなど
      console.warn("LS write error:", k, e.message);
      return false;
    }
  },
  del(k){ try{ localStorage.removeItem(k); }catch{} },
  // バイト数を推定
  sizeOf(v){ try{ return new Blob([JSON.stringify(v)]).size; }catch{ return 0; } },
};

let state = {
  allRecords: LS.get("survey_allRecords", SAMPLE_RESPONSES),
  roster: Object.assign({}, SAMPLE_ROSTER, LS.get("survey_roster", {})),
  campus: LS.get("survey_campus", "戸塚西口"),
  tab: "list",
  threshold: LS.get("survey_threshold", 1),
  archives: LS.get("survey_archives", {}),   // {archiveName: {records, work, savedAt}}
  assignments: LS.get("survey_assignments", []), // 担当ペア [{seiHira,name,grade,subject,core,yobi,teacher}]
  viewingArchive: null,                       // 閲覧中アーカイブ名（nullなら現役）
  filter: { teacher:"",subject:"",q5:"",flagOnly:false,query:"" },
  err: "",
  saveStatus: "",
  modal: null,
  expandedDays: null, // null=初期状態（今日だけ自動展開）、Set=ユーザーが操作した状態
  expandedTeachers: {}, // 先生別タブの生徒一覧の展開状態
  rankMetric: "q1", // 集計ランキングの選択項目
  nameAliases: LS.get("survey_nameAliases", {}), // 手動名寄せ {回答名(正規化): 名簿フルネーム(正規化)}
};

// 判断キー: 生徒×先生（id単位で一意）
function workKey(){ return `survey_work__${state.campus}`; }
function loadWork(){
  const w=LS.get(workKey(),{flags:{},decisions:{},notes:{}});
  state.flags=w.flags||{}; state.decisions=w.decisions||{}; state.notes=w.notes||{};
}
function saveWork(){
  const ok=LS.set(workKey(),{flags:state.flags,decisions:state.decisions,notes:state.notes});
  if(ok===false){
    flashSave("⚠ 保存失敗（容量不足？）");
  } else {
    flashSave("✅ 保存済み");
  }
}
loadWork();

let saveTimer=null, statusTimer=null;
function flashSave(msg){
  state.saveStatus=msg;
  const el=document.getElementById("saveStatus"); if(el) el.textContent=msg;
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>{ state.saveStatus=""; const e=document.getElementById("saveStatus"); if(e)e.textContent=""; },1500);
}

// ════════════════════════════════════════════════════════════
// 項目別スコア: q5は⑤用、q1〜q4は①〜④用
function scKey(v,key){ return (key==="q5"?SCORE_Q5:SCORE_Q14)[v] ?? 3; }
const sc = v => SCORE_MAP[v] ?? 3; // 汎用（⑤の相対比較で使用）
const avgSc = (arr,key) => arr.length ? +(arr.reduce((s,r)=>s+scKey(r[key],key),0)/arr.length).toFixed(2) : 0;
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function tName(code){ return state.roster[code]?.name || ""; }
function tLabel(code){ const n=tName(code); return n?`${code} ${n}`:code; }
const scoreColor = function(v){ const s=sc(v); return s>=4?"#16a34a":s>=3?"#ca8a04":"#dc2626"; };
// 先生コードの正規化：小数点除去・数字だけ抽出・下3桁を3桁ゼロ埋め
function normCode(v){
  let s=String(v==null?"":v).trim();
  if(s.includes(".")) s=s.split(".")[0];     // "291.0" → "291"
  s=s.replace(/[^0-9]/g,"");                  // 数字以外を除去
  if(s.length>3) s=s.slice(-3);               // 7桁等なら下3桁
  return s.padStart(3,"0");
}

// 現役 or アーカイブ閲覧中かでデータ源を切替
function activeRecords(){
  if(state.viewingArchive){ return state.archives[state.viewingArchive]?.records || []; }
  return state.allRecords;
}
function responses(){ return activeRecords().filter(r=>!state.campus||r.campus===state.campus); }
function campuses(){ return [...new Set(state.allRecords.map(r=>r.campus).filter(Boolean))].sort(); }
function teachers(){ return [...new Set(responses().map(r=>r.teacherCode))].sort(); }
function subjects(){ return [...new Set(responses().map(r=>r.subject))].sort(); }

function filtered(){
  const f=state.filter;
  return responses().filter(r=>{
    if(f.teacher && r.teacherCode!==f.teacher) return false;
    if(f.subject && r.subject!==f.subject) return false;
    if(f.q5 && r.q5!==f.q5) return false;
    if(f.flagOnly && !state.flags[r.id]) return false;
    if(f.query){
      const hay=`${r.studentName}${r.teacherCode}${tName(r.teacherCode)}${r.subject}${r.comment}`;
      if(!hay.includes(f.query)) return false;
    }
    return true;
  });
}
function dups(){
  const seen={},res=[];
  responses().forEach(r=>{ const k=`${r.studentName}__${r.teacherCode}`; if(seen[k])res.push({cur:r,prev:seen[k]}); else seen[k]=r; });
  return res;
}
// 重複を一括削除：同じ生徒×先生のうち id 最大（最新取り込み）だけ残す
function dedupeKeepLatest(){
  const groups={};
  responses().forEach(r=>{ const k=`${r.studentName}__${r.teacherCode}`; (groups[k]=groups[k]||[]).push(r); });
  const toDelete=[];
  Object.values(groups).forEach(list=>{
    if(list.length<2) return;
    const keepId=Math.max(...list.map(r=>r.id));
    list.forEach(r=>{ if(r.id!==keepId) toDelete.push(r.id); });
  });
  if(!toDelete.length){ toast("重複はありません"); return; }
  askConfirm(`重複した回答 ${toDelete.length}件 を削除します（各組で最新の回答だけ残します）。続けますか？`, ()=>{
    const delSet=new Set(toDelete);
    state.allRecords=state.allRecords.filter(r=>!delSet.has(r.id));
    LS.set("survey_allRecords",state.allRecords);
    toDelete.forEach(id=>{ delete state.flags[id]; delete state.decisions[id]; delete state.notes[id]; });
    saveWork();
    toast(`✅ 重複 ${toDelete.length}件 を削除しました`); render();
  });
}
function teacherStats(){
  return teachers().map(t=>{
    const tr=responses().filter(r=>r.teacherCode===t);
    return { code:t,count:tr.length,subjects:[...new Set(tr.map(r=>r.subject))].join("・"),
      avgQ1:avgSc(tr,"q1"),avgQ2:avgSc(tr,"q2"),avgQ3:avgSc(tr,"q3"),avgQ4:avgSc(tr,"q4"),avgQ5:avgSc(tr,"q5") };
  });
}
// 1回答の①〜⑤平均（5項目を1〜5で平均）
function rowAvg(r){
  return (scKey(r.q1,"q1")+scKey(r.q2,"q2")+scKey(r.q3,"q3")+scKey(r.q4,"q4")+scKey(r.q5,"q5"))/5;
}
// この回答に不満系が含まれるか（①〜④の「不満/やや不満」＋⑤の「かえてほしい/やや不満」）
const CHANGE_Q14=new Set(["不満","やや不満"]);
function hasDirectComplaint(r){
  if(CHANGE_Q5.has(r.q5)) return true;
  return [r.q1,r.q2,r.q3,r.q4].some(v=>CHANGE_Q14.has(v));
}
function reviewCandidates(){
  const rs=responses(), names=[...new Set(rs.map(r=>r.studentName))], result={};
  teachers().forEach(t=>{ result[t]={code:t,reasons:[]}; });
  // 直接不満：①〜④の不満系 または ⑤のかえてほしい
  rs.forEach(r=>{ if(hasDirectComplaint(r)) result[r.teacherCode].reasons.push({type:"direct",r}); });
  // 相対低評価：同じ生徒の中で、この先生への①〜⑤平均 vs 他先生への①〜⑤平均
  names.forEach(name=>{
    const sr=rs.filter(r=>r.studentName===name); if(sr.length<2) return;
    sr.forEach(r=>{
      const others=sr.filter(o=>o.teacherCode!==r.teacherCode); if(!others.length) return;
      const oAvg=others.reduce((s,o)=>s+rowAvg(o),0)/others.length, my=rowAvg(r);
      if(oAvg-my>=state.threshold && !hasDirectComplaint(r)){
        if(!result[r.teacherCode].reasons.some(x=>x.r.id===r.id))
          result[r.teacherCode].reasons.push({type:"relative",r,myScore:+my.toFixed(1),othersAvg:+oAvg.toFixed(1)});
      }
    });
  });
  return Object.values(result).filter(t=>t.reasons.length>0);
}

// アンケート回答の生徒姓(ひらがな)を取得（姓名つながりなので前方一致用）
function respSei(r){ return toHira(r.studentName); }
// 回答の生徒名を比較用に正規化（漢字/カタカナ/ひらがな/空白ゆらぎ吸収）
function respNameNorm(r){ return normName(r.studentName); }
// 回答(r)が担当ペア(a)と同一生徒かを判定（ひらがな・漢字・異体字・手動名寄せで照合）
function sameStudent(r, a){
  const rn=respNameNorm(r);           // 回答名を正規化
  if(a.fullHira && rn===a.fullHira) return true;          // ひらがなフルネーム一致
  if(a.fullKanji && rn===a.fullKanji) return true;        // 漢字フルネーム一致
  // 手動名寄せ：回答名→名簿フルネームの対応が登録されていれば一致
  const alias=state.nameAliases[rn];
  if(alias && (alias===a.fullHira || alias===a.fullKanji)) return true;
  // フルネームが取れない場合は姓の前方一致でフォールバック
  if(!a.fullHira && a.seiHira && rn.startsWith(a.seiHira)) return true;
  return false;
}
// 担当ペア名簿のどの生徒とも一致しない回答の生徒名一覧（手動名寄せ候補）
function unmatchedStudents(){
  if(!state.assignments.length) return [];
  const rs=responses();
  const seen={};
  rs.forEach(r=>{
    if(r.elem) return; // 小学生は担当ペア名簿対象外なので照合しない
    const rn=respNameNorm(r);
    if(seen[rn]!==undefined) return;
    const matched=state.assignments.some(a=>sameStudent(r,a));
    seen[rn]={ norm:rn, name:r.studentName, grade:r.grade, matched };
  });
  return Object.values(seen).filter(s=>!s.matched);
}

}

// 回答が担当ペアと一致するか照合し、誤入力を理由別に分類
function matchResults(){
  const aMap=assignBySei();
  const rs=responses();
  const errors={ teacher:[], subject:[], pair:[] }; // 先生番号ミス / 科目ちがい / 担当ペアなし
  rs.forEach(r=>{
    if(r.elem) return; // 小学生は照合対象外
    // この回答の生徒の担当ペアを探す（ひらがな・漢字どちらの入力でも照合）
    let myAssigns=null;
    for(const list of Object.values(aMap)){
      if(list.some(a=>sameStudent(r,a))){ myAssigns=list; break; }
    }
    if(!myAssigns){ return; } // 名簿にいない生徒はスルー（小学生や未取り込み）
    const respTeacherName=tName(r.teacherCode);
    const respSeiName=(respTeacherName||"").split(/[ 　]/)[0];
    const respCore=toCoreSubject(r.subject);
    // この生徒の担当ペアの中で、先生姓が一致するものを探す
    const teacherMatch=myAssigns.filter(a=>{
      const aCode=teacherNameToCode(a.teacher,state.roster);
      return aCode && aCode===r.teacherCode;
    });
    if(!teacherMatch.length){
      errors.teacher.push({r, assigns:myAssigns}); return;
    }
    // 先生は合っている → 科目照合（5教科変換後）
    const subjOk=teacherMatch.some(a=>{
      const ac=a.core;
      if(ac==="__ignore__"||respCore==="__ignore__") return true; // 総合型等はスルー
      return ac===respCore;
    });
    if(!subjOk){
      errors.subject.push({r, expect:teacherMatch.map(a=>a.core==="__unknown__"?a.subject:a.core)}); 
    }
  });
  return errors;
}

// 担当ペア1件ごとに「回答済みか」を判定して返す（曜日別・未回答リスト用。週複数回もそのまま）
function assignmentAnswerStatus(){

// 「生徒×先生×科目」でユニーク化した担当ペア（回答率の分母用。週2回は1件に集約）
function uniqueAssignments(){
  const seen={}, out=[];
  assignmentAnswerStatus().forEach(s=>{
    const key=`${s.fullHira||s.seiHira}__${s.code}__${toCoreSubject(s.subject)}`;
    if(seen[key]){ if(s.answered) seen[key].answered=true; return; } // 同キーは1件に、回答済みを優先
    seen[key]={...s}; out.push(seen[key]);
  });
  return out;
}
// 全体＆曜日別の回答率（分母は 生徒×先生×科目 のユニーク）
function responseRates(){
  const uniq=uniqueAssignments();
  const week={ "月":{a:0,t:0},"火":{a:0,t:0},"水":{a:0,t:0},"木":{a:0,t:0},"金":{a:0,t:0},"土":{a:0,t:0} };
  let totA=0, totT=0;
  // 曜日別は「その曜日に授業がある担当ペア」を数える（曜日情報が要るので元データで集計）
  assignmentAnswerStatus().forEach(s=>{
    if(s.yobi&&week[s.yobi]){ week[s.yobi].t++; if(s.answered)week[s.yobi].a++; }
  });
  // 全体はユニークで数える
  uniq.forEach(s=>{ totT++; if(s.answered)totA++; });
  return { week, total:{a:totA,t:totT} };
}
// 先生別の回答率（分母=生徒×先生×科目のユニーク担当ペア、分子=実際の回答レコード数）
function teacherResponseRates(){
  const m={};
  // 分母：担当ペアのユニーク数
  uniqueAssignments().forEach(s=>{ if(!s.code)return; (m[s.code]=m[s.code]||{a:0,t:0}); m[s.code].t++; });
  // 分子：実際の回答レコード数（小学生は担当ペア対象外なので除外）
  responses().forEach(r=>{ if(r.elem)return; if(!m[r.teacherCode]) m[r.teacherCode]={a:0,t:0}; m[r.teacherCode].a++; });

//  文字コード判別
// ════════════════════════════════════════════════════════════
function decodeBytes(buf){
  const bytes=new Uint8Array(buf);
  const utf8=new TextDecoder("utf-8",{fatal:false}).decode(bytes);
  const bad=(utf8.match(/\uFFFD/g)||[]).length;
  if(bad>0){
    try{
      const sjis=new TextDecoder("shift_jis",{fatal:false}).decode(bytes);
      if(((sjis.match(/\uFFFD/g)||[]).length)<=bad) return sjis;
    }catch{}
  }
  return utf8;
}
function stripHTML(text){
  if(!/<[a-z!][\s\S]*>/i.test(text)) return text;
  const tmp=document.createElement("div"); tmp.innerHTML=text;
  return tmp.textContent||tmp.innerText||text;
}

// ── 自前XLSXパーサー（外部ライブラリ不要・オフライン対応） ──
// XLSXはZIP。ブラウザ標準のDecompressionStreamでdeflate展開して読む。
async function inflateRaw(bytes){
  const ds=new DecompressionStream("deflate-raw");
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
// ZIP内の各ファイルを {name: Uint8Array} で返す
async function unzip(buf){
  const dv=new DataView(buf), bytes=new Uint8Array(buf), files={};
  // End of Central Directory を末尾から探す
  let eocd=-1;
  for(let i=bytes.length-22; i>=0; i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error("ZIP構造が不正です");
  let cdOff=dv.getUint32(eocd+16,true), cnt=dv.getUint16(eocd+10,true), p=cdOff;
  for(let i=0;i<cnt;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true);
    const compSize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true);
    const extraLen=dv.getUint16(p+30,true);
    const commLen=dv.getUint16(p+32,true);
    const lhOff=dv.getUint32(p+42,true);
    const name=new TextDecoder("utf-8").decode(bytes.subarray(p+46,p+46+nameLen));
    // ローカルヘッダから実データ位置を計算
    const lhNameLen=dv.getUint16(lhOff+26,true);
    const lhExtraLen=dv.getUint16(lhOff+28,true);
    const dataStart=lhOff+30+lhNameLen+lhExtraLen;
    const comp=bytes.subarray(dataStart,dataStart+compSize);
    files[name]= method===0 ? comp.slice() : await inflateRaw(comp);
    p+=46+nameLen+extraLen+commLen;
  }
  return files;
}
function xmlText(u8){ return new TextDecoder("utf-8").decode(u8); }
// セル参照 "C5" → 列インデックス(0始まり)
function colIndex(ref){
  const m=ref.match(/^([A-Z]+)/); if(!m) return 0;
  let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64);
  return n-1;
}
async function parseXLSX(buf, sheetNameWanted){
  const files=await unzip(buf);
  // sharedStrings
  const shared=[];
  if(files["xl/sharedStrings.xml"]){
    const xml=xmlText(files["xl/sharedStrings.xml"]);
    const siRe=/<si\b[^>]*>([\s\S]*?)<\/si>/g; let m;
    while((m=siRe.exec(xml))){
      const tRe=/<t\b[^>]*>([\s\S]*?)<\/t>/g; let t,s="";
      while((t=tRe.exec(m[1]))) s+=decodeXMLEntities(t[1]);
      shared.push(s);
    }
  }
  // シート特定：名前指定があれば workbook.xml + rels から該当シートXMLを探す
  let sheetFile=null;
  if(sheetNameWanted && files["xl/workbook.xml"] && files["xl/_rels/workbook.xml.rels"]){
    const wb=xmlText(files["xl/workbook.xml"]);
    const rels=xmlText(files["xl/_rels/workbook.xml.rels"]);
    // シート名→r:id
    let sm, rid=null;
    const sRe=/<sheet\b[^>]*name="([^"]*)"[^>]*r:id="([^"]*)"[^>]*\/?>/g;
    while((sm=sRe.exec(wb))){ if(decodeXMLEntities(sm[1])===sheetNameWanted){ rid=sm[2]; break; } }
    if(rid){
      // r:id→ファイルパス
      const rRe=new RegExp('<Relationship\\b[^>]*Id="'+rid+'"[^>]*Target="([^"]*)"','i');
      const rmn=rels.match(rRe);
      if(rmn){ let tgt=rmn[1].replace(/^\/?xl\//,"").replace(/^\//,""); sheetFile="xl/"+tgt.replace(/^xl\//,""); }
    }
  }
  // 見つからなければ従来通り sheet1
  let sheetName=sheetFile && files[sheetFile] ? sheetFile
    : (Object.keys(files).find(n=>/^xl\/worksheets\/sheet1\.xml$/.test(n))
       || Object.keys(files).find(n=>/^xl\/worksheets\/.*\.xml$/.test(n)));
  const sx=xmlText(files[sheetName]);
  const rows=[];
  const rowRe=/<row\b[^>]*>([\s\S]*?)<\/row>/g; let rm;
  while((rm=rowRe.exec(sx))){
    const cells=[];
    const cRe=/<c\b([^>]*)>([\s\S]*?)<\/c>|<c\b([^>]*)\/>/g; let cm;
    while((cm=cRe.exec(rm[1]))){
      const attr=(cm[1]||cm[3]||""); const inner=cm[2]||"";
      const refM=attr.match(/r="([A-Z]+\d+)"/); const idx=refM?colIndex(refM[1]):cells.length;
      const isStr=/t="s"/.test(attr);
      const vM=inner.match(/<v\b[^>]*>([\s\S]*?)<\/v>/);
      const isInline=/t="inlineStr"/.test(attr);
      let val="";
      if(isInline){ const tM=inner.match(/<t\b[^>]*>([\s\S]*?)<\/t>/); val=tM?decodeXMLEntities(tM[1]):""; }
      else if(vM){ val = isStr ? (shared[parseInt(vM[1],10)]||"") : decodeXMLEntities(vM[1]); }
      cells[idx]=val;
    }
    for(let i=0;i<cells.length;i++) if(cells[i]==null) cells[i]="";
    rows.push(cells);
  }
  return rows;
}
// xlsxに含まれる全シート名を取得
async function xlsxSheetNames(buf){
  const files=await unzip(buf);
  if(!files["xl/workbook.xml"]) return [];
  const wb=xmlText(files["xl/workbook.xml"]);
  const names=[]; let sm;
  const sRe=/<sheet\b[^>]*name="([^"]*)"/g;
  while((sm=sRe.exec(wb))) names.push(decodeXMLEntities(sm[1]));
  return names;
}
function decodeXMLEntities(s){
  return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/&amp;/g,"&");
}

async function onSurveyFile(input){

        for(const ch of line){ if(ch==='"')inQ=!inQ; else if(ch===','&&!inQ){cells.push(cur);cur="";} else cur+=ch; }

      });

    let lastReasonCol=-1;

          teacherCode:normCode(tc),subject:row[base+1]||"",
          q1:row[base+2]||"",q2:row[base+3]||"",q3:row[base+4]||"",q4:row[base+5]||"",q5:row[base+6]||"",
          comment:String(row[base+7]||"").trim(),
          studentMsg });
      });
    });

    }

    toast(`✅ ${toSave.length} 件を取り込みました（${sizeKB}KB）${first?" · "+first:""}`); render();
  }catch(err){ state.err="読み込みエラー: "+err.message; render(); }
  input.value="";
}
function onTeacherFile(input){

      const roster={...state.roster}; const dupWarn=[]; let added=0;
      lines.forEach(line=>{
        const cells=[]; let cur="",inQ=false;

    let uid=Math.max(0,...state.allRecords.map(r=>r.id||0));
    const recs=[];
    raw.slice(hRow+1).forEach(row=>{
      const name=row[cName]; const tc=row[cTcode];
      if(!name||!tc) return; // 生徒名か先生番号が空はスキップ
      uid++;
      recs.push({ id:uid, campus:state.campus, studentName:String(name).trim(), grade:String(row[cGrade]||"").trim(),
        teacherCode:normCode(tc), subject:String(row[cSubj]||"").trim(),
        q1:row[cQ[0]]||"",q2:row[cQ[1]]||"",q3:row[cQ[2]]||"",q4:row[cQ[3]]||"",q5:row[cQ[4]]||"",
        comment:cReason>=0?String(row[cReason]||"").trim():"",
        studentMsg:cMsg>=0?String(row[cMsg]||"").trim():"",
        elem:true });
    });
    if(!recs.length) throw new Error("回答データが見つかりませんでした");
    // 既存データに合流（追加）
    state.allRecords=state.allRecords.concat(recs);
    const toSave=state.campus ? state.allRecords.filter(r=>r.campus===state.campus) : state.allRecords;
    const sizeKB=Math.round(LS.sizeOf(toSave)/1024);
    const ok=LS.set("survey_allRecords", toSave);
    if(!ok) state.err=`⚠ 保存に失敗しました（推定${sizeKB}KB）。容量不足の可能性があります。`;
    toast(`✅ 小学生 ${recs.length}件を合流しました（${target}）`);
    render();
  }catch(err){ state.err="小学生アンケート読み込みエラー: "+err.message; render(); }
  input.value="";
}

async function onAssignFile(input){
  const file=input.files[0]; if(!file) return;
  state.err="読み込み中…"; render();
  try{
    const buf=await file.arrayBuffer();
    let rows;
    const isCSV=/\.csv$/i.test(file.name);
    if(isCSV){
      const text=stripHTML(decodeBytes(buf));
      rows=text.replace(/\r/g,"").trim().split("\n").map(line=>{
        const cells=[]; let cur="",inQ=false;
        for(const ch of line){ if(ch==='"')inQ=!inQ; else if(ch===','&&!inQ){cells.push(cur);cur="";} else cur+=ch; }
        cells.push(cur); return cells;
      });
    } else {
      rows=await parseXLSX(buf); // 自前パーサーのみ
    }
    const H=rows[0].map(x=>String(x||""));
    const idx=(kw)=>H.findIndex(h=>h.includes(kw));
    const seiCol=idx("ｾｲ")>=0?idx("ｾｲ"):idx("セイ");
    const meiCol=idx("ﾒｲ")>=0?idx("ﾒｲ"):idx("メイ");
    // 漢字の姓名列（「姓」「名」。ｾｲ/ﾒｲと混同しないよう完全一致で探す）
    const seiKanjiCol=H.findIndex(h=>h==="姓");
    const meiKanjiCol=H.findIndex(h=>h==="名");
    const gradeCol=idx("学年");
    // 通常授業の「科目(通常授業)①」位置から、6枠×3列を取得
    let normStart=H.findIndex(h=>h.includes("科目(通常授業)")||h.includes("科目（通常授業）"));
    if(normStart<0) normStart=H.findIndex(h=>h.includes("科目")); // フォールバック
    const assigns=[]; let students=0, skipped=0;
    rows.slice(1).forEach(r=>{
      const grade=r[gradeCol]; const sei=r[seiCol]; const mei=meiCol>=0?r[meiCol]:"";
      if(!sei) return;
      if(isElementary(grade)){ skipped++; return; } // 小学生除外
      students++;
      const seiHira=toHira(sei);
      const fullHira=toHira(sei)+toHira(mei); // 姓+名のフルネーム（同姓区別用）
      // 漢字フルネーム（生徒が漢字で入力した場合の照合用）
      const kanjiSei=seiKanjiCol>=0?String(r[seiKanjiCol]||""):"";
      const kanjiMei=meiKanjiCol>=0?String(r[meiKanjiCol]||""):"";
      const fullKanji=normName(kanjiSei+kanjiMei);
      for(let k=0;k<6;k++){
        const base=normStart+k*3;
        const subj=r[base], yobiRaw=r[base+1], tch=r[base+2];
        if(!subj||!tch) continue;
        const subjStr=String(subj).trim();
        const tchStr=String(tch).trim();
        // 先生が時刻・数値の場合は除外（Excelの列ズレ）
        if(/^\d+[\.:]\d+/.test(tchStr)||tchStr==="[object Object]") continue;
        // 集計対象外科目・小学生科目を除外
        if(toCoreSubject(subjStr)==="__ignore__") continue;
        if(SUBJECT_IGNORE.some(x=>subjStr.includes(x))) continue;
        const ym=String(yobiRaw||"").match(/[月火水木金土日]/);
        assigns.push({ seiHira, fullHira, fullKanji, grade:String(grade||""), subject:String(subj),
          core:toCoreSubject(subj), yobi:ym?ym[0]:"", teacher:String(tch).trim() });
      }
    });
    state.assignments=assigns; LS.set("survey_assignments",assigns);
    toast(`✅ 担当ペア ${assigns.length}件（生徒${students}名）を取り込みました${skipped?`／小学生${skipped}名を除外`:""}`);
    render();
  }catch(err){ state.err="担当ペア読み込みエラー: "+err.message; render(); }
  input.value="";
}

// 復元した中身を localStorage に書き、書けなかったものを返す。
// 戻り値 {failed:[キー名...], kb:推定サイズ}
function applyBackupData(d){
  const failed=[]; let bytes=0;
  const put=(key,val,label)=>{
    bytes+=LS.sizeOf(val);
    if(LS.set(key,val)===false) failed.push(label);
  };
  if(d.campus){ state.campus=d.campus; put("survey_campus",d.campus,"校舎"); }
  if(d.allRecords){ state.allRecords=d.allRecords; put("survey_allRecords",d.allRecords,"回答"); }
  if(d.roster){ state.roster=d.roster; put("survey_roster",d.roster,"先生名簿"); }
  if(d.archives){ state.archives=d.archives; put("survey_archives",d.archives,"アーカイブ"); }
  if(d.assignments){ state.assignments=d.assignments; put("survey_assignments",d.assignments,"担当"); }
  if(d.nameAliases){ state.nameAliases=d.nameAliases; put("survey_nameAliases",d.nameAliases,"名寄せ"); }
  if(d.work){
    state.flags=d.work.flags||{}; state.decisions=d.work.decisions||{}; state.notes=d.work.notes||{};
    bytes+=LS.sizeOf(d.work);
    if(LS.set(workKey(),{flags:state.flags,decisions:state.decisions,notes:state.notes})===false) failed.push("判断・メモ");
  }
  // 本当に読み戻せるかを確かめる。書けたつもりで消えているケースを拾う。
  if(d.allRecords && !failed.length){
    const back=LS.get("survey_allRecords",null);
    if(!back || back.length!==d.allRecords.length) failed.push("回答（書き戻し確認に失敗）");
  }
  return { failed, kb: Math.round(bytes/1024) };
}
function checkStorage(){
  const el=document.getElementById("storageMsg"); if(!el) return;
  const lines=[]; let total=0;
  const mine=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i), v=localStorage.getItem(k)||"";
    const kb=(k.length+v.length)/1024; total+=kb;
    if(k.indexOf("survey_")===0) mine.push([k,kb]);
  }
  mine.sort((a,b)=>b[1]-a[1]);
  lines.push("このツールのデータ:");
  if(!mine.length) lines.push("　（まだ何も入っていません）");
  mine.forEach(([k,kb])=>lines.push("　"+k.replace("survey_","")+"　"+Math.round(kb)+"KB"));
  lines.push("この端末の合計: "+Math.round(total)+"KB（他の塾ツールと共用）");
  // あとどれだけ書けるか実際に試す
  const KEY="__survey_probe__"; let free=0;
  try{
    const block="x".repeat(64*1024); let buf="";
    while(buf.length < 8*1024*1024){
      try{ localStorage.setItem(KEY, buf+block); buf+=block; }catch(e){ break; }
    }
    free=buf.length/1024;
  }catch(e){}
  try{ localStorage.removeItem(KEY); }catch(e){}
  lines.push("あと書ける目安: "+Math.round(free)+"KB");
  if(free < 300) lines.push("⚠ 空きが少ないです。アーカイブを減らすか、パソコンで作業してください。");
  el.textContent=lines.join(String.fromCharCode(10));
}

async function syncLoad(){
  const url=(LS.get('survey_syncUrl','')||'').trim(), key=(LS.get('survey_syncKey','')||'').trim();
  if(!url||!key){ syncMsgSet("接続先URLと合言葉を入力してください","#f87171"); return; }
  if(!confirm('スプシの内容で、この端末のデータを上書きします。よろしいですか？'))return;
  syncMsgSet("スプシから読込中…","#94a3b8");
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key,tool:'survey',action:'load'})});
    const d=await res.json();
    if(d.ok){
      if(!d.data){ syncMsgSet("スプシにまだデータがありません（先に保存してください）","#f87171"); return; }
      const r=applyBackupData(JSON.parse(d.data));
      if(r.failed.length){
        syncMsgSet("⚠ 読み込みましたが端末に保存できませんでした（"+r.failed.join("・")+
          "／約"+r.kb+"KB）。閉じると元に戻ります。不要なアーカイブを削除するか、パソコンでお試しください。","#f87171");
        return;
      }
      syncMsgSet("✅ 読み込んで端末に保存しました（約"+r.kb+"KB）。画面を作り直します…","#16a34a");
      // 保存した内容から画面を作り直す。こうすると「表示は出ているのに保存されていない」状態が残らない。
      setTimeout(()=>location.reload(),700);
      return;
    } else { syncMsgSet("エラー: "+(d.error||"不明"),"#f87171"); }
  }catch(e){ syncMsgSet("通信エラー: ネット接続を確認してください","#f87171"); }
}

function showComment(id){ const r=activeRecords().find(x=>x.id===id); if(r) state.modal={type:"comment",r}; render(); }
function showDetail(id){
  const r=activeRecords().find(x=>x.id===id); if(!r) return;
  // この生徒の全先生回答
  const allForStudent=responses().filter(x=>x.studentName===r.studentName);
  state.modal={type:"detail", r, allForStudent};
  render();
}
function closeModal(){ state.modal=null; render(); }
function setModalVal(v){ if(state.modal) state.modal.value=v; }

// 自前の確認ダイアログ（ネイティブconfirmが効かない環境向け）
let pendingConfirm=null;
function askConfirm(message, onYes){
  pendingConfirm=onYes;
  state.modal={type:"confirm",message};
  render();
}
function confirmYes(){ const fn=pendingConfirm; pendingConfirm=null; state.modal=null; render(); if(fn) fn(); }
function confirmNo(){ pendingConfirm=null; state.modal=null; render(); }
let __toastT=null;
function showToast(msg,kind){
  const el=document.getElementById("toastbox"); if(!el) return;
  el.textContent=msg;
  el.className="on"+(kind?" "+kind:"");
  clearTimeout(__toastT);
  if(kind!=="ng") __toastT=setTimeout(()=>{ el.className=""; },3200);   // エラーは残す
}
function toastKind(msg){
  const m=String(msg||"");
  if(m.indexOf("✅")>=0) return "ok";
  if(m.indexOf("⚠")>=0||m.indexOf("エラー")>=0||m.indexOf("失敗")>=0) return "ng";
  return "";
}
function toast(msg){ state.err=msg; render(); showToast(msg,toastKind(msg));
  setTimeout(()=>{ if(state.err===msg){ state.err=""; render(); } },2800); }

function renderTab(){
  switch(state.tab){
    case "list": return renderList();
    case "anomaly": return renderAnomaly();
    case "review": return renderReview();
    case "comments": return renderComments();
    case "match": return renderMatch();
    case "absent": return renderAbsent();
    case "chart": return renderChart();
    case "teacher": return renderTeacher();
    case "settings": return renderSettings();
  }
  return "";
}

function renderComments(){
  const rs=responses();
  // 生徒ごとに集約：一言(studentMsg)と担当先生全員
  const byStudent={};
  rs.forEach(r=>{
    const k=r.studentName;
    if(!byStudent[k]) byStudent[k]={ name:r.studentName, grade:r.grade, msg:"", teachers:[] };
    if(r.studentMsg && !byStudent[k].msg) byStudent[k].msg=r.studentMsg;
    if(!byStudent[k].teachers.some(t=>t.code===r.teacherCode))
      byStudent[k].teachers.push({ code:r.teacherCode, subject:r.subject, q5:r.q5 });
  });
  // 一言が書かれている生徒だけ表示
  const withMsg=Object.values(byStudent).filter(s=>s.msg);
  if(!withMsg.length){
    return `<div class="card" style="padding:28px;text-align:center;color:#94a3b8">生徒の一言コメントはありません。<br><span style="font-size:11px">（アンケート末尾の自由記述欄）</span></div>`;
  }
  return `
    <div style="font-size:12px;color:#64748b;margin-bottom:12px">生徒からの一言（${withMsg.length}名）。担当の先生たちに伝えてあげましょう。</div>
    ${withMsg.map(s=>`<div class="card" style="padding:14px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <b style="font-size:14px">${esc(s.name)}</b>
        <span style="font-size:11px;color:#94a3b8">${esc(s.grade)}</span>
      </div>
      <div style="background:#f0fdf4;border-left:3px solid #22c55e;border-radius:0 8px 8px 0;padding:11px 13px;font-size:13px;line-height:1.7;color:#334155;white-space:pre-wrap">${esc(s.msg)}</div>
      <div style="margin-top:10px">
        <div style="font-size:10px;color:#94a3b8;margin-bottom:5px">担当の先生</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">
          ${s.teachers.sort((a,b)=>a.code.localeCompare(b.code)).map(t=>`<span style="background:#eff6ff;border:1px solid #dbeafe;border-radius:6px;padding:3px 8px;font-size:11px">
            <span style="color:#1d4ed8;font-weight:600">${esc(t.code)}</span> ${esc(tName(t.code))}<span style="color:#94a3b8"> · ${esc(t.subject)}</span>
          </span>`).join("")}

      </div>
    </div>`).join("")}`;
}

// 分布グラフ生成
function distBars(rs, key, order, colorMap){
  const dist=order.map(v=>({label:v,count:rs.filter(r=>r[key]===v).length,fill:colorMap[v]||"#94a3b8"}));
  const maxC=Math.max(1,...dist.map(d=>d.count));
  return `<div class="barwrap">${dist.map(d=>`<div class="bar-col"><div style="font-size:11px;color:#64748b">${d.count}</div><div class="bar" style="height:${d.count/maxC*120}px;background:${d.fill}"></div><div style="font-size:9px;color:#94a3b8;text-align:center">${d.label}</div></div>`).join("")}</div>`;
}

function pastArchivesForCampus(){
  return Object.entries(state.archives)
    .filter(([_,a])=>!a.campus || a.campus===state.campus)
    .sort((x,y)=>new Date(y[1].savedAt)-new Date(x[1].savedAt));
}
// 指定先生コードの①〜⑤平均を、与えられたレコード配列から算出
function radarFromRecords(records, code){
  const tr=records.filter(r=>normCode(r.teacherCode)===code);
  if(!tr.length) return null;
  return [avgSc(tr,"q5"),avgSc(tr,"q1"),avgSc(tr,"q2"),avgSc(tr,"q3"),avgSc(tr,"q4")];
}

// data: 現在の[[label,val],...]。series: 過去学期の重ね描画 [{name,data:[val,...],style}]
function radarSVG(data, series){
  const cx=100,cy=100,R=58,n=data.length;
  const MIN=2.5, MAX=5, SPAN=MAX-MIN;
  // 値→半径（2.5未満は中心に張り付く）
  const rOf=v=>{ const cl=Math.max(MIN,Math.min(MAX,v)); return R*(cl-MIN)/SPAN; };
  // グリッド（2.5,3,3.5,4,4.5,5 の6本）
  const levels=[2.5,3,3.5,4,4.5,5];
  const grid=levels.map(lv=>{
    const pts=data.map((_,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n,r=rOf(lv); return `${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`; }).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="#e2e8f0" stroke-width="${lv===5?1.2:0.8}"/>`;
  }).join("");
  // 目盛り数値（縦軸方向に2.5刻みラベル）
  const scaleLabels=levels.map(lv=>{ const r=rOf(lv); return `<text x="${cx+3}" y="${cy-r}" font-size="6" fill="#cbd5e1">${lv}</text>`; }).join("");
  // 軸線
  const axes=data.map((_,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return `<line x1="${cx}" y1="${cy}" x2="${cx+R*Math.cos(a)}" y2="${cy+R*Math.sin(a)}" stroke="#f1f5f9" stroke-width="0.8"/>`; }).join("");
  // 過去学期（点線で重ねる）
  const pastPolys=(series||[]).map(s=>{
    const pts=s.data.map((v,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n,r=rOf(v); return `${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`; }).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="${s.color}" stroke-width="1.5" stroke-dasharray="${s.dash}"/>`;
  }).join("");
  // 今学期（実線・塗りつぶし）
  const poly=data.map((d,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n,r=rOf(d[1]); return `${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`; }).join(" ");
  const labels=data.map((d,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n,r=R+15; return `<text x="${cx+r*Math.cos(a)}" y="${cy+r*Math.sin(a)}" font-size="8" fill="#64748b" text-anchor="middle" dominant-baseline="middle">${d[0]}</text>`; }).join("");
  const vals=data.map((d,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n,r=rOf(d[1]); return `<text x="${cx+r*Math.cos(a)}" y="${cy+r*Math.sin(a)-3}" font-size="8" font-weight="700" fill="#4f46e5" text-anchor="middle">${d[1]}</text>`; }).join("");
  // 凡例
  let legend="";
  if(series&&series.length){
    const items=[`<tspan fill="#6366f1">━ 今学期</tspan>`].concat(series.map(s=>`<tspan fill="${s.color}">┄ ${esc(s.name)}</tspan>`));
    legend=`<text x="4" y="232" font-size="7">${items.map((it,i)=>`<tspan x="4" dy="${i===0?0:9}">${it}</tspan>`).join("")}</text>`;
  }
  const h = series&&series.length ? 232+series.length*9+4 : 200;
  return `<svg width="200" height="${h}" viewBox="0 0 200 ${h}">${axes}${grid}${scaleLabels}${pastPolys}<polygon points="${poly}" fill="#6366f1" fill-opacity="0.25" stroke="#6366f1" stroke-width="1.5"/>${vals}${labels}${legend}</svg>`;
}

// 既存データの先生コードを正規化（"291.0"→"291"の修復）
(function migrateCodes(){
  let changed=false;
  state.allRecords.forEach(r=>{ const c=normCode(r.teacherCode); if(c!==r.teacherCode){ r.teacherCode=c; changed=true; } });
  Object.values(state.archives).forEach(a=>{ (a.records||[]).forEach(r=>{ const c=normCode(r.teacherCode); if(c!==r.teacherCode){ r.teacherCode=c; changed=true; } }); });
  if(changed){ LS.set("survey_allRecords",state.allRecords); LS.set("survey_archives",state.archives); }
})();

// localStorageが使えるか起動時に検査（Documentsアプリの一時モード対策）
(function checkStorage(){
  try{
    const k="__survey_storage_test__";
    localStorage.setItem(k,"1");
    if(localStorage.getItem(k)!=="1") throw new Error("read-fail");
    localStorage.removeItem(k);
  }catch(e){
    setTimeout(()=>{
      state.err="⚠ この環境では自動保存できません。作業後に上部の💾保存でバックアップを取り、次回は設定→復元で読み込んでください。";
      render();
    }, 400);
  }
})();
