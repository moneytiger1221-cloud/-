<style>

<script>
// ════════════════════════════════════════════════════════════
// ①〜④用スコア（満足5/まあ満足4/ふつう3/やや不満2/不満1）
const SCORE_Q14 = { "満足":5,"まあ満足":4,"ふつう":3,"やや不満":2,"不満":1 };
// ⑤総合用スコア（大満足5/満足4/ふつう3/やや不満2/かえてほしい1）
const SCORE_Q5  = { "大満足":5,"満足":4,"ふつう":3,"やや不満":2,"かえて欲しい":1,"かえてほしい":1 };
// 後方互換（色判定などで使う汎用表）
const SCORE_MAP = Object.assign({}, SCORE_Q14, SCORE_Q5);
const Q5_COLOR  = { "大満足":"#22c55e","満足":"#86efac","まあ満足":"#fde68a","ふつう":"#94a3b8","やや不満":"#fb923c","かえて欲しい":"#ef4444","不満":"#ef4444" };
const Q5_ORDER  = ["大満足","満足","まあ満足","ふつう","やや不満","かえて欲しい"];
const CHANGE_Q5 = new Set(["かえて欲しい","やや不満","不満"]);

// 高校細目 → 中学5教科 への変換マッピング
const SUBJECT_MAP = [
  ["国語", ["国語","現代文","現代の国語","古典","古文","漢文","言語文化","論理国語","文学国語","国語表現","作文"]],
  ["数学", ["数学","数Ⅰ","数I","数Ⅱ","数II","数Ⅲ","数III","数A","数Ａ","数B","数Ｂ","数C","数Ｃ","算数"]],
  ["英語", ["英語","英コミ","英語コミュニケーション","コミュ英","論表","論理表現","英表","英語表現","リーディング","ライティング"]],
  ["理科", ["理科","物理","物理基礎","化学","化学基礎","生物","生物基礎","地学","地学基礎"]],
  ["社会", ["社会","地理","地理総合","歴史","歴史総合","日本史","世界史","地理歴史","公共","倫理","政治経済","政経","現代社会","公民"]],
];
// 5教科に当てはまらないが、照合する独立科目（担当も回答もこの科目名なら一致）
const SUBJECT_STANDALONE = ["総合型","総合型選抜","小論文"];
// 完全に照合対象外（担当ペアからも除外する科目）
const SUBJECT_IGNORE = ["探究","探求","推薦","面接","志望理由",
  "英単語DOJO","英単語dojo","DOJO","キュレオ","入自理","入自社",
  "算数","小国語","小学英語","入門"];

function toCoreSubject(s){
  s=String(s||"").trim();
  if(!s) return "";
  if(SUBJECT_IGNORE.some(x=>s.includes(x))) return "__ignore__";
  // 総合型・小論文は5教科に混ぜず、その科目名のまま照合
  for(const x of SUBJECT_STANDALONE){ if(s.includes(x)) return x==="総合型選抜"?"総合型":x; }
  for(const [core,list] of SUBJECT_MAP){
    if(core===s) return core;
    if(list.some(x=>s.includes(x)||x.includes(s))) return core;
  }
  return "__unknown__"; // 分類不明
}
// カナ（半角/全角）→ひらがな
function toHira(s){
  s=String(s||"").normalize("NFKC");
  return s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
// 異体字の正規化テーブル（旧字・異体字 → 常用字）。名前でよく使われるもの。
const KANJI_VARIANTS = {
  "髙":"高","﨑":"崎","嵜":"崎","邊":"辺","邉":"辺","德":"徳","眞":"真",
  "廣":"広","澤":"沢","齋":"斎","齊":"斉","濱":"浜","國":"国","榮":"栄",
  "龍":"竜","瀨":"瀬","渕":"淵","條":"条","桒":"桑","靑":"青","𠮷":"吉",
  "槇":"槙","萬":"万","與":"与","盃":"杯",
};
function normName(s){
  let str=toHira(s);
  str=str.replace(/./g,c=>KANJI_VARIANTS[c]||c); // 異体字を1文字ずつ置換
  return str.replace(/[\s　・･,，、]/g,"").trim();
}
// 学年が小学生かどうか
function isElementary(grade){ return /小|小学|^[1-6]年$/.test(String(grade||"")); }
// 先生名字→先生コード（名簿roster利用、姓の一致）
function teacherNameToCode(name, roster){
  name=String(name||"").trim();
  if(!name) return "";
  const entries=Object.entries(roster);
  const seiOf=t=>(t.name||"").split(/[ 　]/)[0];
  // ① フルネーム完全一致
  for(const [code,t] of entries){ if(name===t.name) return code; }
  // ② 姓の完全一致（「宮本」=「宮本」を優先、「宮」には誤マッチさせない）
  for(const [code,t] of entries){ if(seiOf(t)===name) return code; }
  // ③ 名簿名が入力名で始まる（入力が姓のみで名簿がフルネーム等）。最長一致を採用
  let best="", bestLen=-1;
  for(const [code,t] of entries){
    const sei=seiOf(t); if(!sei) continue;
    // 入力「姓＋名」←→名簿の「姓」のように、入力が姓で始まるケースも拾う
    if(name.startsWith(sei) || sei.startsWith(name)){
      const matchLen=Math.min(name.length, sei.length);
      if(matchLen>bestLen){ bestLen=matchLen; best=code; }
    }
  }
  return best;
}

const SAMPLE_RESPONSES = [

  {id:3,campus:"戸塚西口",studentName:"おおがねちえり",grade:"中３",teacherCode:"279",subject:"英語",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:4,campus:"戸塚西口",studentName:"おおがねちえり",grade:"中３",teacherCode:"299",subject:"数学",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:5,campus:"戸塚西口",studentName:"たかはし ゆうと",grade:"中３",teacherCode:"289",subject:"社会",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:6,campus:"戸塚西口",studentName:"たかはし ゆうと",grade:"中３",teacherCode:"310",subject:"国語",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:7,campus:"戸塚西口",studentName:"たかはし ゆうと",grade:"中３",teacherCode:"322",subject:"英語",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:8,campus:"戸塚西口",studentName:"たかはし ゆうと",grade:"中３",teacherCode:"301",subject:"理科",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:9,campus:"戸塚西口",studentName:"たかはし ゆうと",grade:"中３",teacherCode:"328",subject:"数学",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
  {id:10,campus:"戸塚西口",studentName:"いずみしゅうご",grade:"中１",teacherCode:"289",subject:"数学",q1:"まあ満足",q2:"まあ満足",q3:"まあ満足",q4:"まあ満足",q5:"大満足",comment:""},
  {id:11,campus:"戸塚西口",studentName:"いずみしゅうご",grade:"中１",teacherCode:"301",subject:"英語",q1:"満足",q2:"満足",q3:"満足",q4:"満足",q5:"大満足",comment:""},
];

const SAMPLE_ROSTER = {};  // 公開版のため空。先生名簿は先生CSV取込またはスプシ同期で入る

// ════════════════════════════════════════════════════════════
const LS = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch{ return def; } },
  set(k,v){
    try{
      const str=JSON.stringify(v);
      localStorage.setItem(k,str);
      // 書き込めたか確認（容量オーバーの場合サイレントに失敗することがある）
      if(localStorage.getItem(k)===null){
        console.warn("LS write silently failed:", k);
        return false;
      }
      return true;
    }catch(e){
      // 容量オーバーなど
      console.warn("LS write error:", k, e.message);
      return false;
    }
  },
  del(k){ try{ localStorage.removeItem(k); }catch{} },
  // バイト数を推定
  sizeOf(v){ try{ return new Blob([JSON.stringify(v)]).size; }catch{ return 0; } },
};

let state = {
  allRecords: LS.get("survey_allRecords", SAMPLE_RESPONSES),
  roster: Object.assign({}, SAMPLE_ROSTER, LS.get("survey_roster", {})),
  campus: LS.get("survey_campus", "戸塚西口"),
  tab: "list",
  threshold: LS.get("survey_threshold", 1),
  archives: LS.get("survey_archives", {}),   // {archiveName: {records, work, savedAt}}
  assignAll: {},   // 学期ごとの担当ペア {学期:[…]}。loadAssignAll() で読む
  assignments: [], // 今見ている学期の担当ペア [{seiHira,name,grade,subject,core,yobi,teacher,school}]
  viewingArchive: null,                       // 閲覧中アーカイブ名（nullなら現役）
  filter: { teacher:"",subject:"",q5:"",flagOnly:false,query:"" },
  err: "",
  saveStatus: "",
  modal: null,
  expandedDays: null, // null=初期状態（今日だけ自動展開）、Set=ユーザーが操作した状態
  expandedTeachers: {}, // 先生別タブの生徒一覧の展開状態
  rankMetric: "q1", // 集計ランキングの選択項目
  nameAliases: LS.get("survey_nameAliases", {}), // 手動名寄せ {回答名(正規化): 名簿フルネーム(正規化)}
};

// 判断キー: 生徒×先生（id単位で一意）
function workKey(){ return `survey_work__${state.campus}`; }
function loadWork(){
  const w=LS.get(workKey(),{flags:{},decisions:{},notes:{}});
  state.flags=w.flags||{}; state.decisions=w.decisions||{}; state.notes=w.notes||{};
}
function saveWork(){ JUKU_SYNC.touch('survey'); JUKU_SYNC.queueSave('survey', syncSave);
  const ok=LS.set(workKey(),{flags:state.flags,decisions:state.decisions,notes:state.notes});
  if(ok===false){
    flashSave("⚠ 保存失敗（容量不足？）");
  } else {
    flashSave("✅ 保存済み");
  }
}

// 項目別スコア: q5は⑤用、q1〜q4は①〜④用
function scKey(v,key){ return (key==="q5"?SCORE_Q5:SCORE_Q14)[v] ?? 3; }
const sc = v => SCORE_MAP[v] ?? 3; // 汎用（⑤の相対比較で使用）
const avgSc = (arr,key) => arr.length ? +(arr.reduce((s,r)=>s+scKey(r[key],key),0)/arr.length).toFixed(2) : 0;
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* ===== 複数えらべる絞り込み（スプレッドシートのフィルタと同じ形）=====
   進路ツールと同じ部品。ボタンを押すとチェックの一覧が下に開き、
   検索・すべて選択・すべて解除ができる。チェックした瞬間に結果へ反映する。

   使い方:
     FLT.define({key:'school', btn:'fSchool', label:'学校',
                 values:function(){ return ['A中','B中']; },
                 counts:function(){ return {'A中':12}; },   // 省略可
                 onChange:function(){ ... }});
     FLT.pass('school', st.school)   // 何も選んでいなければ true
     FLT.draw()                      // ボタンを作り直したあとに呼ぶ
     FLT.list('school')              // 選ばれている値の配列

   ・選ばれている値は FLT の中に持つので、画面を作り直しても消えない。
   ・パネルは body の直下に置く。アンケートツールのように画面ごと
     作り直すツールでも、チェックの途中でパネルが消えないようにするため。 */
var FLT = (function(){
  var defs={}, sel={}, openKey=null;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function define(def){ defs[def.key]=def; if(!sel[def.key]) sel[def.key]={}; }
  function on(key){ var o=sel[key]||{}; for(var k in o) if(o[k]) return true; return false; }
  function list(key){ var o=sel[key]||{}, out=[]; for(var k in o) if(o[k]) out.push(k); return out; }
  function pass(key,v){ return !on(key) || !!(sel[key]||{})[v]; }
  function clear(key){ sel[key]={}; }
  function panel(){ return document.querySelector('.fpanel'); }

  function closeAll(){
    var p=panel(); if(p) p.parentNode.removeChild(p);
    openKey=null;
  }
  /* ボタンの真下に置く。画面の右や下からはみ出さないように寄せる。 */
  function place(p, btn){
    var r=btn.getBoundingClientRect(), W=document.documentElement.clientWidth, H=document.documentElement.clientHeight;
    var w=p.offsetWidth || 270;
    var left=Math.max(8, Math.min(r.left, W-w-8));
    var top=r.bottom+4;
    if(top + p.offsetHeight > H-8) top=Math.max(8, r.top - p.offsetHeight - 4);
    p.style.left=left+'px'; p.style.top=top+'px';
  }

  function draw(only){
    Object.keys(defs).forEach(function(key){
      if(only && only!==key) return;
      var f=defs[key], btn=document.getElementById(f.btn);
      if(!btn) return;
      var vals=f.values()||[];
      /* 元データから消えた選択肢は捨てる（テスト回や校舎を変えたとき） */
      var o=sel[key]||{}; for(var k in o) if(vals.indexOf(k)<0) delete o[k];
      /* 選べるものが無い絞り込みは、ボタンごと出さない */
      btn.style.display = vals.length? '' : 'none';
      var chosen=list(key);
      btn.className='fbtn'+(chosen.length?' on':'');
      btn.innerHTML=esc(f.label)+'<span class="cara">▼</span>'+
        (chosen.length? ' '+esc(chosen.length===1? (f.text? f.text(chosen[0]) : chosen[0]) : (chosen.length+'件')) : '');
      btn.title=chosen.length? chosen.map(function(v){ return f.text? f.text(v) : v; }).join('、') : 'すべて';
      btn.onclick=function(e){
        e.preventDefault(); e.stopPropagation();
        var was=openKey;
        closeAll();
        if(was!==key) open(f);
      };
    });
    /* 開きっぱなしのパネルは、押しボタンが作り直されていても位置を合わせ直す */
    var p=panel();
    if(p && openKey){
      var b=document.getElementById(defs[openKey].btn);
      if(b) place(p,b); else closeAll();
    }
  }

  function open(f){
    var btn=document.getElementById(f.btn); if(!btn) return;
    var p=document.createElement('div');
    p.className='fpanel';
    document.body.appendChild(p);
    openKey=f.key;
    var word='';
    function body(){
      var vals=f.values()||[], cnt=(f.counts? f.counts() : null);
      var shown=vals.filter(function(v){
        if(!word) return true;
        return String(f.text? f.text(v) : v).indexOf(word)>=0;
      });
      var h='<input type="text" placeholder="'+esc(f.label)+'でしぼる" value="'+esc(word)+'">'+
        '<div class="fact"><button type="button" data-act="all">すべて選択</button>'+
        '<button type="button" data-act="none">すべて解除</button></div><div class="flist">';
      if(!shown.length) h+='<div class="fnone">見つかりません</div>';
      shown.forEach(function(v){
        h+='<label><input type="checkbox" data-v="'+esc(v)+'"'+(sel[f.key][v]?' checked':'')+'>'+
           '<span>'+esc(f.text? f.text(v) : v)+'</span>'+
           (cnt? '<span class="n">'+(cnt[v]||0)+'</span>' : '')+'</label>';
      });
      h+='</div>';
      p.innerHTML=h;
      var tb=p.querySelector('input[type="text"]');
      tb.oninput=function(){ var pos=tb.selectionStart; word=tb.value.trim(); body();
        var nb=p.querySelector('input[type="text"]'); nb.focus();
        try{ nb.setSelectionRange(pos,pos); }catch(e){} };
      var cbs=p.querySelectorAll('input[type="checkbox"]');
      for(var i=0;i<cbs.length;i++)(function(c){
        c.onchange=function(){
          if(c.checked) sel[f.key][c.getAttribute('data-v')]=true;
          else delete sel[f.key][c.getAttribute('data-v')];
          draw();                          /* 先にボタンを更新してから結果を描き直す */
          if(f.onChange) f.onChange();     /* 画面が作り直されてもパネルは残る */
        };
      })(cbs[i]);
      var bs=p.querySelectorAll('.fact button');
      for(var j=0;j<bs.length;j++)(function(b){
        b.onclick=function(){
          if(b.getAttribute('data-act')==='none') sel[f.key]={};
          else shown.forEach(function(v){ sel[f.key][v]=true; });   /* 検索で絞ったぶんだけ */
          body(); draw(); if(f.onChange) f.onChange();
        };
      })(bs[j]);
      p.onclick=function(e){ e.stopPropagation(); };
      var b2=document.getElementById(f.btn); if(b2) place(p,b2);
    }
    body();
  }

  function reposition(){
    var p=panel(); if(!p||!openKey) return;
    var b=document.getElementById(defs[openKey].btn);
    if(b) place(p,b); else closeAll();
  }
  if(typeof document!=='undefined' && document.addEventListener){
    document.addEventListener('click', closeAll);
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeAll(); });
    document.addEventListener('scroll', reposition, true);
    if(typeof window!=='undefined' && window.addEventListener) window.addEventListener('resize', reposition);
  }
  return {define:define, draw:draw, on:on, list:list, pass:pass, clear:clear, close:closeAll, sel:sel};
})();

/* ===== 学期の共通部品（塾ツール共通・6ツールに同じものを入れる）=====
   「今このツールはいつの名簿で動いているか」を持って、画面に出す。

   1年の流れ（聞き取り）:
     コマ組は先を組む。7月に2学期、12月に3学期、3月には次年度1学期のコマを組む。
     アンケートは6〜10月に1学期の結果を見て、11〜1月は2学期、2〜3月は3学期。
     成績はテスト①②＝1学期、③④＝2学期、⑤＝3学期の担当とセット。
   なので「今の学期」は1つに決まらない。ツールごとに別々に持つ。         */
var JUKU_TERM = (function(){
  var MARK='juku_roster_mark_v1';        /* {koma:'2026年度2学期', grade:…, survey:…} */

  function get(){ try{ return JSON.parse(localStorage.getItem(MARK)||'{}')||{}; }catch(e){ return {}; } }
  function put(o){ try{ localStorage.setItem(MARK, JSON.stringify(o)); }catch(e){} }

  /* 年度は4月始まり */
  function nendo(d){ return (d.getMonth()+1) >= 4 ? d.getFullYear() : d.getFullYear()-1; }

  /* そのツールが「その月に使うべき学期」。上の表のとおり。 */
  function want(tool, d){
    d = d || new Date();
    var m = d.getMonth()+1, y = nendo(d);
    if(tool==='koma'){                                    /* コマ組は先を組む */
      if(m>=4 && m<=6)  return y+'年度1学期';
      if(m>=7 && m<=11) return y+'年度2学期';
      if(m===12||m===1||m===2) return y+'年度3学期';
      return (y+1)+'年度1学期';                            /* 3月は次年度1学期 */
    }
    if(tool==='survey'){                                  /* 集計は6月・11月・2月 */
      if(m>=4 && m<=10) return y+'年度1学期';
      if(m>=11 || m===1) return y+'年度2学期';
      return y+'年度3学期';                                /* 2〜3月 */
    }
    /* 成績ほか。テスト回が分かるときは termOfKai() が優先 */
    if(m>=4 && m<=7)  return y+'年度1学期';
    if(m>=8 && m<=12) return y+'年度2学期';
    return y+'年度3学期';
  }

  /* テスト回 → 学期。①②＝1学期、③④＝2学期、⑤＝3学期 */
  function termOfKai(year, kai){
    var n = +kai || 0;
    var g = n<=2 ? 1 : (n<=4 ? 2 : 3);
    return year+'年度'+g+'学期';
  }

  /* 講習は通常とは別軸。社内ツール上で開いている期間で決まる。
     4月2週〜8月＝夏期 / 9月〜1月1週＝冬期 / 1月2週〜4月1週＝春期 */
  function kousyu(d){
    d = d || new Date();
    var m = d.getMonth()+1, day = d.getDate();
    if((m===1 && day>=8) || m===2 || m===3 || (m===4 && day<=7)){
      /* 春期は1〜4月にまたがるが、どれも同じ年度の終わりぶん */
      return (d.getFullYear()-1)+'年度春期';
    }
    if((m===4 && day>=8) || (m>=5 && m<=8)) return nendo(d)+'年度夏期';
    return nendo(d)+'年度冬期';                            /* 9月〜1月1週 */
  }

  /* 選べる学期の一覧（前年度3学期 〜 次年度1学期） */
  function list(d){
    var y = nendo(d||new Date());
    return [(y-1)+'年度3学期', y+'年度1学期', y+'年度2学期', y+'年度3学期', (y+1)+'年度1学期'];
  }

  function mark(tool){ return get()[tool] || ''; }
  function setMark(tool, term){ var o=get(); if(term) o[tool]=term; else delete o[tool]; put(o); }

  /* ヘッダに出す小さな表示。id の要素の中身を作る。
     何も記録が無ければ「未設定」、今の月とずれていれば ⚠ を付ける。 */
  function paint(elId, tool, cb){
    var el = document.getElementById(elId); if(!el) return;
    var cur = mark(tool), w = want(tool);
    var opts = list();
    if(cur && opts.indexOf(cur)<0) opts = [cur].concat(opts);
    var h = '<span class="jt-l">名簿</span>' +
      '<select class="jt-s" title="このツールが今どの学期の名簿で動いているか">' +
      '<option value="">未設定</option>' +
      opts.map(function(t){
        return '<option value="'+t+'"'+(t===cur?' selected':'')+'>'+t+'</option>';
      }).join('') + '</select>';
    if(!cur) h += '<span class="jt-w" title="今の月ならこの学期です">今は '+w+'</span>';
    else if(cur!==w) h += '<span class="jt-w jt-ng" title="今の月に合っていません">⚠ 今は '+w+'</span>';
    el.innerHTML = h;
    var sel = el.querySelector('.jt-s');
    sel.onchange = function(){ setMark(tool, sel.value); paint(elId, tool, cb); if(cb) cb(sel.value); };
  }

  return { want:want, kousyu:kousyu, termOfKai:termOfKai, list:list,
           mark:mark, setMark:setMark, paint:paint, nendo:nendo };
})();

/* ===== 名簿の棚（塾ツール共通・6ツールに同じものを入れる）=====
   生徒CSVと先生CSVを「学期ごと」にしまっておく場所。取込センターが書き、各ツールが読む。
   同じオリジンの localStorage なので、iframe をまたいでも共有される。

   しまうのは**デコード済みのテキストそのもの**。各ツールのパーサはそれぞれ癖があるので、
   ここでは解釈せず、生のまま渡す。（PDFやxlsxは大きすぎるので棚には置かない） */
var JUKU_ROSTER = (function(){
  var SHELF='juku_roster_v1';        /* {学期:{student:{file,at,text}, teacher:{…}, kousyu:'2026年度夏期'}} */
  var SEEN ='juku_roster_seen_v1';   /* {tool:{term, at}} どこまで取り込み済みか */

  function rd(k){ try{ return JSON.parse(localStorage.getItem(k)||'{}')||{}; }catch(e){ return {}; } }
  function wr(k,o){ try{ localStorage.setItem(k, JSON.stringify(o)); return true; }catch(e){ return false; } }

  function all(){ return rd(SHELF); }
  function terms(){ return Object.keys(all()).sort(); }
  function entry(term, kind){ var t=all()[term]; return (t && t[kind]) ? t[kind] : null; }

  function put(term, kind, file, text, kousyu){
    var o=rd(SHELF);
    if(!o[term]) o[term]={};
    o[term][kind]={ file:file||'', at:Date.now(), text:String(text||'') };
    if(kousyu) o[term].kousyu=kousyu;
    return wr(SHELF,o);
  }
  function drop(term){ var o=rd(SHELF); delete o[term]; wr(SHELF,o); }
  function clearAll(){
    try{ localStorage.removeItem(SHELF); localStorage.removeItem(SEEN); }catch(e){}
  }
  function sizeKB(){
    try{ return Math.round((localStorage.getItem(SHELF)||'').length/1024); }catch(e){ return 0; }
  }

  /* どこまで取り込んだかの印。生徒と先生で別々に持つ（片方だけ更新されることがある） */
  function sk(tool, kind){ return tool+':'+kind; }
  function seen(tool, kind){ return rd(SEEN)[sk(tool,kind)] || null; }
  function markSeen(tool, kind, term, at){
    var o=rd(SEEN); o[sk(tool,kind)]={term:term, at:at}; wr(SEEN,o);
  }

  /* 棚に「まだ取り込んでいない新しいもの」があるか */
  function pending(tool, kind, term){
    term = term || (typeof JUKU_TERM!=='undefined' ? JUKU_TERM.mark(tool) : '');
    if(!term) return null;
    var e = entry(term, kind);
    if(!e || !e.text) return null;
    var s = seen(tool, kind);
    if(s && s.term===term && s.at===e.at) return null;    /* もう取り込んである */
    return e;
  }

  /* 棚から読んで、まだ取り込んでいなければ apply(text, info) を呼ぶ。
     term を省くと、そのツールが今見ている学期（JUKU_TERM.mark）を使う。
     戻り値: 取り込んだら info、何もしなければ null */
  function pull(tool, kind, apply, term){
    term = term || (typeof JUKU_TERM!=='undefined' ? JUKU_TERM.mark(tool) : '');
    var e = pending(tool, kind, term);
    if(!e) return null;
    try{ apply(e.text, e); }catch(err){ return null; }
    markSeen(tool, kind, term, e.at);
    return e;
  }
  /* 学期を変えたときなど、取り込み済みの印を消してもう一度読ませる */
  function forget(tool){
    var o=rd(SEEN);
    Object.keys(o).forEach(function(k){ if(k.indexOf(tool+':')===0) delete o[k]; });
    wr(SEEN,o);
  }

  return { all:all, terms:terms, entry:entry, put:put, drop:drop, clearAll:clearAll,
           sizeKB:sizeKB, pull:pull, pending:pending, forget:forget, seen:seen, markSeen:markSeen };
})();


/* ===== 同期の「いつ・どの端末で保存したか」（塾ツール共通）=====
   今の同期は「まるごと置き換え」なので、どっちが新しいかを人が知っている必要がある。
   ・端末に名前を付ける（このPC／スマホ など）
   ・保存するデータに「いつ・どの端末で」を1行だけ入れる
   ・スプシ側の最終保存時刻（Code.gs が返す updatedAt）と見比べて出す
   Code.gs には手を入れないので、Apps Script を入れ直す必要はない。 */
var JUKU_SYNC = (function(){
  var DEV='juku_device_v1';          /* 端末の名前（全ツール共通） */
  var LAST='juku_sync_last_v1';      /* {tool: {at, by}} この端末が最後に保存した時刻 */

  function rd(k,d){ try{ return JSON.parse(localStorage.getItem(k)||'null') || d; }catch(e){ return d; } }
  function wr(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  function deviceName(){
    var n = rd(DEV,'');
    if(n) return n;
    /* 初回はそれらしい名前を当てておく（設定で直せる） */
    var ua = navigator.userAgent||'';
    var guess = /iPhone|Android|iPad/i.test(ua) ? 'スマホ' : 'パソコン';
    wr(DEV, guess);
    return guess;
  }
  function setDeviceName(n){ wr(DEV, String(n||'').trim() || 'この端末'); }

  /* 保存するデータに1行だけ足す。中身は触らない。 */
  function stamp(payload){
    payload = payload || {};
    payload._meta = { savedAt: new Date().toISOString(), savedBy: deviceName() };
    return payload;
  }
  /* 保存できたら、この端末の記録に残す */
  function noteSaved(tool){
    var o = rd(LAST,{}); o[tool] = { at:new Date().toISOString(), by:deviceName() }; wr(LAST,o);
  }
  function lastSaved(tool){ return (rd(LAST,{})||{})[tool] || null; }

  function fmt(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d)) return String(iso);
    var p=function(n){ return (n<10?'0':'')+n; };
    return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  /* スプシの今の状態を見にいく。中身は読み捨てて、いつ・誰が保存したかだけ返す。 */
  async function peek(url, key, tool){
    var res = await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ key:key, tool:tool, action:'load' }) });
    var d = await res.json();
    if(!d.ok) throw new Error(d.error||'不明なエラー');
    var by='';
    try{ by = (JSON.parse(d.data||'{}')._meta||{}).savedBy || ''; }catch(e){}
    return { updatedAt: d.updatedAt||'', savedBy: by, bytes: (d.data||'').length };
  }

  /* 画面に出す1行。remote は peek() の結果（null なら未確認）。 */
  function statusHtml(tool, remote){
    var mine = lastSaved(tool);
    var out = [];
    out.push('<span class="js-l">この端末が最後に保存</span> '+(mine? fmt(mine.at) : '<span class="js-dim">まだ保存していません</span>'));
    if(remote){
      var newer = remote.updatedAt && (!mine || new Date(remote.updatedAt) > new Date(mine.at));
      var other = remote.savedBy && remote.savedBy!==deviceName();
      out.push('<span class="js-l">スプシの最終保存</span> '+
        (remote.updatedAt? fmt(remote.updatedAt) : '（まだ何も入っていません）')+
        (remote.savedBy? '（'+esc0(remote.savedBy)+'）' : '')+
        (newer? ' <b class="js-ng">'+(other?'この端末より新しいです':'この端末で保存した最新です')+'</b>' : ''));
    }
    return out.join('<br>');
  }
  function esc0(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* 端末名の入力欄＋状態表示をまとめて作る。
     el: 置き場所のid / tool: 'grade' など / getCfg: ()=>({url,key}) */
  function mount(elId, tool, getCfg){
    var box=document.getElementById(elId); if(!box) return;
    function draw(remote){
      box.innerHTML =
        '<div class="js-row"><span class="js-l">この端末の名前</span>'+
          '<input type="text" class="js-dev" value="'+esc0(deviceName())+'" style="width:120px;">'+
          '<button type="button" class="js-peek">スプシの状態を見る</button></div>'+
        '<div class="js-st">'+statusHtml(tool, remote)+'</div>';
      var inp=box.querySelector('.js-dev');
      inp.onchange=function(){ setDeviceName(inp.value); draw(remote); };
      box.querySelector('.js-peek').onclick=async function(){
        var b=this; var cfg=getCfg()||{};
        if(!cfg.url||!cfg.key){ box.querySelector('.js-st').innerHTML='<span class="js-ng">接続先URLと合言葉を先に入れてください</span>'; return; }
        b.disabled=true; b.textContent='見にいっています…';
        try{ draw(await peek(cfg.url, cfg.key, tool)); }
        catch(e){ box.querySelector('.js-st').innerHTML='<span class="js-ng">見にいけませんでした: '+esc0(e&&e.message?e.message:e)+'</span>'; b.disabled=false; b.textContent='スプシの状態を見る'; }
      };
    }
    draw(null);
    box.__redraw = draw;
  }
  function refresh(elId){ var b=document.getElementById(elId); if(b&&b.__redraw) b.__redraw(null); }

  return { deviceName:deviceName, setDeviceName:setDeviceName, stamp:stamp,
           noteSaved:noteSaved, lastSaved:lastSaved, peek:peek, fmt:fmt,
           statusHtml:statusHtml, mount:mount, refresh:refresh };
})();

/* ===== 手で入れたものを守る混ぜ方（塾ツール共通）=====
   今までの読込は「まるごと置き換え」だった。スマホで入れた面談メモが、
   PCで保存した内容を読み込んだ瞬間に消える。

   混ぜ方のきまり：
     ・片方にしか無いものは、両方残す（PCで生徒Aに、スマホで生徒Bに書いた → 両方生きる）
     ・同じところを両方いじっていたら、**あとから触ったほうを採る**
   1項目ずつの時刻は持っていないので、「あとから触ったほう」は
   ツールごとの「最後に手入力した時刻」（touch）で決める。 */
(function(){
  var TOUCH='juku_touched_v1';    /* {tool: ISO} この端末で最後に手入力した時刻 */
  function rd(){ try{ return JSON.parse(localStorage.getItem(TOUCH)||'{}')||{}; }catch(e){ return {}; } }

  /* 手で入れたものを保存したときに呼ぶ */
  JUKU_SYNC.touch = function(tool){
    var o=rd(); o[tool]=new Date().toISOString();
    try{ localStorage.setItem(TOUCH, JSON.stringify(o)); }catch(e){}
  };
  JUKU_SYNC.touchedAt = function(tool){ return rd()[tool] || ''; };

  /* この端末のほうが「あとから触った」か */
  JUKU_SYNC.iAmNewer = function(tool, theirTouchedAt){
    var mine = JUKU_SYNC.touchedAt(tool);
    if(!theirTouchedAt) return true;      /* 相手が一度も手入力していない */
    if(!mine) return false;               /* こちらが一度も手入力していない */
    return new Date(mine) > new Date(theirTouchedAt);
  };

  function isPlain(v){ return v && typeof v==='object' && !Array.isArray(v); }
  function same(a,b){ try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return false; } }

  /* 木をたどって混ぜる。mineNewer が true なら、ぶつかったときこちらを採る。 */
  function mergeTree(mine, theirs, mineNewer){
    if(theirs===undefined || theirs===null) return mine;
    if(mine===undefined || mine===null) return theirs;

    /* 配列で、両方とも id を持つものの並びなら、id ごとに混ぜる */
    if(Array.isArray(mine) && Array.isArray(theirs)){
      var hasId = function(a){ return a.length===0 || a.every(function(x){ return x && x.id!==undefined; }); };
      if(hasId(mine) && hasId(theirs)){
        var by={}, order=[];
        theirs.forEach(function(x){ by[x.id]=x; order.push(x.id); });
        mine.forEach(function(x){
          if(by[x.id]===undefined){ by[x.id]=x; order.push(x.id); }
          else by[x.id]=mergeTree(x, by[x.id], mineNewer);
        });
        return order.map(function(k){ return by[k]; });
      }
      return same(mine,theirs) ? mine : (mineNewer ? mine : theirs);
    }

    if(isPlain(mine) && isPlain(theirs)){
      var out={}, keys={};
      Object.keys(mine).forEach(function(k){ keys[k]=1; });
      Object.keys(theirs).forEach(function(k){ keys[k]=1; });
      Object.keys(keys).forEach(function(k){ out[k]=mergeTree(mine[k], theirs[k], mineNewer); });
      return out;
    }

    if(same(mine,theirs)) return mine;
    return mineNewer ? mine : theirs;
  }
  JUKU_SYNC.merge = mergeTree;
})();

/* ===== 自動で保存・読込（塾ツール共通）=====
   ③で「読込は手入力を上書きしない（混ぜる）」ようにしたので、自動にしても消えない。

   ・開いたとき：スプシのほうが新しければ、自動で読み込む（混ぜるので消えない）
   ・変わったとき：少し待ってからまとめて保存する（打つたびに送らない）
   ・切りたい人のために、入／切のスイッチを付ける（既定は入） */
(function(){
  var AUTO='juku_auto_sync_v1';       /* {tool: true/false} */
  function rd(){ try{ return JSON.parse(localStorage.getItem(AUTO)||'{}')||{}; }catch(e){ return {}; } }

  JUKU_SYNC.autoOn = function(tool){ var v=rd()[tool]; return v===undefined ? true : !!v; };
  var watch = [];
  JUKU_SYNC.setAuto = function(tool, on){
    var o=rd(); o[tool]=!!on;
    try{ localStorage.setItem(AUTO, JSON.stringify(o)); }catch(e){}
    watch.forEach(function(f){ try{ f(); }catch(e){} });
  };

  /* 手動のボタンを普段はしまう。自動を切ったら出す。 */
  JUKU_SYNC.tuckManual = function(tool, sel){
    var box = document.querySelector(sel);
    if(!box || box.dataset.tucked) return;
    box.dataset.tucked = '1';
    var note = document.createElement('div');
    note.style.cssText = 'font-size:12px;color:#64748b;margin:4px 0 8px;line-height:1.6;';
    function paint(){
      var on = JUKU_SYNC.autoOn(tool);
      note.style.display = '';
      box.style.display = on ? 'none' : '';
      note.innerHTML = on
        ? '自動でやりとりしているので、<b>押す必要はありません</b>。'+
          ' <button type="button" class="jkManual" style="font-size:11px;padding:2px 8px;border:1px solid #cbd5e1;'+
          'background:#fff;border-radius:6px;cursor:pointer;color:#64748b;">手動でやる</button>'
        : '自動を切っています。下のボタンで手動でやりとりしてください。';
      var b = note.querySelector('.jkManual');
      if(b) b.onclick = function(){ box.style.display=''; note.style.display='none'; };
    }
    box.parentNode.insertBefore(note, box);
    watch.push(paint);
    paint();
  };

  /* まとめて保存。呼ばれ続けても、静かになってから1回だけ送る。 */
  var timers={}, busy={}, loading={}, reg={};
  JUKU_SYNC.queueSave = function(tool, doSave, wait){
    if(!JUKU_SYNC.autoOn(tool)) return;
    clearTimeout(timers[tool]);
    timers[tool]=setTimeout(async function(){
      /* 送信中／読込中なら後回し（読み込む前の中身で上書きしないため） */
      if(busy[tool] || loading[tool]) { JUKU_SYNC.queueSave(tool, doSave, wait); return; }
      busy[tool]=true;
      /* 送る前に、スプシのほうが新しくないか確かめる。
         新しければ先に読み込んでから送る。スプシは全置換なので、
         これをしないと「あとから保存したほう」が相手の分を消してしまう。 */
      try{ await JUKU_SYNC.recheck(tool); }catch(e){}
      try{ await doSave({auto:true}); }catch(e){}
      busy[tool]=false;
    }, wait||4000);
  };

  /* 取り込んだ結果も自動でスプシへ送る。
     窓口（window.JUKU_IMPORT）をくるんで、終わったら保存を予約するだけ。 */
  JUKU_SYNC.autoAfterImport = function(tool, doSave){
    var o = window.JUKU_IMPORT; if(!o) return;
    Object.keys(o).forEach(function(k){
      var f = o[k];
      o[k] = function(){
        var r = f.apply(null, arguments);
        return Promise.resolve(r).then(function(v){ JUKU_SYNC.queueSave(tool, doSave); return v; });
      };
    });
  };

  /* 「どこまで受け取ったか」を覚えておく。
     これが無いと、読み込んでもこの端末の保存時刻は古いままなので、
     3分おきに同じものを何度も読み直してしまう。 */
  var SEEN='juku_sync_seen_v1';
  function seenAt(tool){ try{ return (JSON.parse(localStorage.getItem(SEEN)||'{}')||{})[tool]||''; }catch(e){ return ''; } }
  function noteSeen(tool, at){
    try{ var o=JSON.parse(localStorage.getItem(SEEN)||'{}')||{}; o[tool]=at;
         localStorage.setItem(SEEN, JSON.stringify(o)); }catch(e){}
  }

  /* スプシのほうが新しいときだけ読み込む。
     cfg は毎回読み直したいので、関数で渡してもよい。 */
  JUKU_SYNC.autoLoad = async function(tool, cfg, doLoad, say){
    if(doLoad) reg[tool] = {cfg:cfg, doLoad:doLoad, say:say};   /* あとで見直せるように覚えておく */
    var c = (typeof cfg === 'function') ? (cfg()||{}) : (cfg||{});
    if(!JUKU_SYNC.autoOn(tool)) return;
    if(!c.url || !c.key) return;
    if(loading[tool]) return;
    loading[tool]=true;
    try{
      var st = await JUKU_SYNC.peek(c.url, c.key, tool);
      if(!st.updatedAt) return;
      /* この端末が最後に保存した時刻と、最後に受け取った時刻の、新しいほうと比べる */
      var mine = JUKU_SYNC.lastSaved(tool);
      var base = mine ? mine.at : '';
      var sa = seenAt(tool);
      if(sa && (!base || new Date(sa) > new Date(base))) base = sa;
      if(base && new Date(st.updatedAt) <= new Date(base)) return;   /* こちらが最新なら何もしない */
      if(say) say('スプシのほうが新しいので読み込みます（'+(st.savedBy||'別の端末')+'が'+JUKU_SYNC.fmt(st.updatedAt)+'に保存）');
      await doLoad({auto:true});
      noteSeen(tool, st.updatedAt);
    }catch(e){ /* つながらないときは黙って何もしない（オフラインでも使えるように） */ }
    finally{ loading[tool]=false; }
  };

  /* もう一度スプシを確かめる。設定を入れ直したあとも、これで拾える。 */
  JUKU_SYNC.recheck = function(tool){
    var r = reg[tool]; if(!r) return Promise.resolve();
    return JUKU_SYNC.autoLoad(tool, r.cfg, r.doLoad, r.say);
  };
  /* iframe の中では document.hidden があてにならないので、隠れているかは見ない。
     確かめるだけ（更新日時を1行もらうだけ）なので、空振りしても軽い。 */
  function recheckAll(){
    Object.keys(reg).forEach(function(t){ JUKU_SYNC.recheck(t); });
  }
  /* 画面に戻ってきたとき。スマホを開いたままパソコンで取り込んでも、
     戻ってくるだけで最新になる。 */
  document.addEventListener('visibilitychange', recheckAll);
  window.addEventListener('focus', recheckAll);
  /* 開きっぱなしのとき用に、3分おきにも確かめる */
  setInterval(recheckAll, 180000);
})();

/* ===== 取り込み口の整理（塾ツール共通）=====
   取り込みは「取込」タブにまとめた。各ツールに残っている取り込み口は、
   **統合版の中で開いているときだけ隠す**。
   ファイルを直接ダブルクリックで開いたときは取込タブが無いので、今までどおり出す。
   （バックアップの復元は取り込みではなく復旧手段なので、いつでも残す） */
function jukuInHub(){
  try{ return window.parent && window.parent !== window && !!window.parent.document.getElementById('panes'); }
  catch(e){ return false; }   /* 別オリジンなら触れない＝統合版ではない */
}
/* 目印の要素を隠して、代わりに案内を出す */
function jukuHideImports(sel, note){
  if(!jukuInHub()) return;
  var list = document.querySelectorAll(sel), hid = 0;
  for(var i=0;i<list.length;i++){ list[i].style.display='none'; hid++; }
  if(!hid) return;
  var host = document.querySelector(sel.split(',')[0]);
  if(!host || !host.parentNode) return;
  var d = document.createElement('div');
  d.className = 'juku-moved';
  d.innerHTML = (note || '取り込みは上の<b>「取込」タブ</b>にまとまりました。') +
    ' <button type="button" class="juku-moved-btn">それでもここで取り込む</button>';
  host.parentNode.insertBefore(d, host);
  d.querySelector('.juku-moved-btn').onclick = function(){
    for(var i=0;i<list.length;i++) list[i].style.display='';
    d.style.display='none';
  };
}

function tName(code){ return state.roster[code]?.name || ""; }
function tLabel(code){ const n=tName(code); return n?`${code} ${n}`:code; }
const scoreColor = function(v){ const s=sc(v); return s>=4?"#16a34a":s>=3?"#ca8a04":"#dc2626"; };
// 先生コードの正規化：小数点除去・数字だけ抽出・下3桁を3桁ゼロ埋め
function normCode(v){
  let s=String(v==null?"":v).trim();
  if(s.includes(".")) s=s.split(".")[0];     // "291.0" → "291"
  s=s.replace(/[^0-9]/g,"");                  // 数字以外を除去
  if(s.length>3) s=s.slice(-3);               // 7桁等なら下3桁
  return s.padStart(3,"0");
}

// 現役 or アーカイブ閲覧中かでデータ源を切替
/* ===== 学期ごとの担当ペア名簿 =====
   state.assignAll に学期ごとに持ち、state.assignments は「今見ている学期のぶん」。
   突合の関数はこれまでどおり state.assignments を見るだけでよい。 */
function curTerm(){ return JUKU_TERM.mark('survey') || JUKU_TERM.want('survey'); }
function termOf(r){ return r.term || ''; }
function loadAssignAll(){
  const raw = LS.get("survey_assignments", null);
  if(Array.isArray(raw)){
    /* 前のかたち（1セットだけ）。今の学期のぶんとして引き継ぐ */
    state.assignAll = {}; state.assignAll[curTerm()] = raw;
    LS.set("survey_assignments", state.assignAll);
  }else{
    state.assignAll = raw || {};
  }
  syncAssignments();
}
function syncAssignments(){ state.assignments = state.assignAll[curTerm()] || []; }
function setAssignments(list, term){
  term = term || curTerm();
  state.assignAll[term] = list;
  LS.set("survey_assignments", state.assignAll);
  syncAssignments();
}
/* 学期のしるしが無い回答に、今の学期を書き込む（一度だけ）。
   これまでの回答は全部「今見ている学期のもの」として扱う。 */
function migrateTerms(){
  if(LS.get("survey_termmigrated_v1", false)) return;
  const t = curTerm();
  let n = 0;
  state.allRecords.forEach(r=>{ if(!r.term){ r.term = t; n++; } });
  if(n) LS.set("survey_allRecords", state.allRecords);
  LS.set("survey_termmigrated_v1", true);
}

function activeRecords(){
  if(state.viewingArchive){ return state.archives[state.viewingArchive]?.records || []; }
  return state.allRecords;
}
function responses(){
  const t = curTerm();
  return activeRecords().filter(r=>{
    if(state.campus && r.campus!==state.campus) return false;
    /* アーカイブはその学期ぶんだけなので、学期での絞り込みはしない */
    if(state.viewingArchive) return true;
    return termOf(r)===t;
  });
}
function campuses(){ return [...new Set(state.allRecords.map(r=>r.campus).filter(Boolean))].sort(); }
function teachers(){ return [...new Set(responses().map(r=>r.teacherCode))].sort(); }
/* 回答の生徒がどの学校か。回答自体に学校が入っていれば それ、
   無ければ担当ペア名簿（時間割）から名前で引く。どちらも無ければ空。 */
var SCHOOL_CACHE={key:"",map:null};
function schoolMap(){
  const key=state.assignments.length+":"+Object.keys(state.nameAliases).length;
  if(SCHOOL_CACHE.key===key && SCHOOL_CACHE.map) return SCHOOL_CACHE.map;
  const m={};
  state.assignments.forEach(a=>{
    if(!a.school) return;
    if(a.fullHira && !m[a.fullHira]) m[a.fullHira]=a.school;
    if(a.fullKanji && !m[a.fullKanji]) m[a.fullKanji]=a.school;
  });
  SCHOOL_CACHE={key, map:m};
  return m;
}
function schoolOf(r){
  if(r.school) return r.school;
  const m=schoolMap();
  const rn=respNameNorm(r);
  return m[rn] || m[state.nameAliases[rn]] || "";
}
/* 学年は 小1→中3→高3 の順に並べたい（あいうえお順だと高校が先に来てしまう） */
function gradeRank(g){
  const s=String(g||"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const n=(s.match(/(\d)/)||[])[1]||"9";
  if(/小/.test(s)) return "1"+n;
  if(/中/.test(s)) return "2"+n;
  if(/高/.test(s)) return "3"+n;
  return "9"+n;
}
/* 絞り込みボタン3つ。件数は「他の条件を除いた」素の回答数を出す */
function fltCount(pick){
  const o={}; responses().forEach(r=>{ const v=pick(r); if(v) o[v]=(o[v]||0)+1; }); return o;
}
FLT.define({key:'school', btn:'fSchool', label:'学校',
  values:function(){ return [...new Set(responses().map(schoolOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')); },
  counts:function(){ return fltCount(schoolOf); }, onChange:function(){ render(); }});
FLT.define({key:'grade', btn:'fGrade', label:'学年',
  values:function(){ return [...new Set(responses().map(r=>r.grade).filter(Boolean))]
    .sort((a,b)=>gradeRank(a).localeCompare(gradeRank(b))); },
  counts:function(){ return fltCount(r=>r.grade); }, onChange:function(){ render(); }});
FLT.define({key:'subject', btn:'fSubject', label:'科目',
  values:function(){ return subjects(); },
  counts:function(){ return fltCount(r=>r.subject); }, onChange:function(){ render(); }});
FLT.define({key:'q5', btn:'fQ5', label:'総合',
  values:function(){ return Q5_ORDER.filter(v=>responses().some(r=>r.q5===v)); },
  counts:function(){ return fltCount(r=>r.q5); }, onChange:function(){ render(); }});
function subjects(){ return [...new Set(responses().map(r=>r.subject))].sort(); }

function filtered(){
  const f=state.filter;
  return responses().filter(r=>{
    if(!FLT.pass('school', schoolOf(r))) return false;
    if(!FLT.pass('grade', r.grade)) return false;
    if(!FLT.pass('subject', r.subject)) return false;
    if(!FLT.pass('q5', r.q5)) return false;
    if(f.flagOnly && !state.flags[r.id]) return false;
    if(f.query){
      const hay=`${r.studentName}${r.teacherCode}${tName(r.teacherCode)}${r.subject}${r.comment}`;
      if(!hay.includes(f.query)) return false;
    }
    return true;
  });
}
function dups(){
  const seen={},res=[];
  responses().forEach(r=>{ const k=`${r.studentName}__${r.teacherCode}`; if(seen[k])res.push({cur:r,prev:seen[k]}); else seen[k]=r; });
  return res;
}
// 重複を一括削除：同じ生徒×先生のうち id 最大（最新取り込み）だけ残す
function dedupeKeepLatest(){
  const groups={};
  responses().forEach(r=>{ const k=`${r.studentName}__${r.teacherCode}`; (groups[k]=groups[k]||[]).push(r); });
  const toDelete=[];
  Object.values(groups).forEach(list=>{
    if(list.length<2) return;
    const keepId=Math.max(...list.map(r=>r.id));
    list.forEach(r=>{ if(r.id!==keepId) toDelete.push(r.id); });
  });
  if(!toDelete.length){ toast("重複はありません"); return; }
  askConfirm(`重複した回答 ${toDelete.length}件 を削除します（各組で最新の回答だけ残します）。続けますか？`, ()=>{
    const delSet=new Set(toDelete);
    state.allRecords=state.allRecords.filter(r=>!delSet.has(r.id));
    LS.set("survey_allRecords",state.allRecords);
    toDelete.forEach(id=>{ delete state.flags[id]; delete state.decisions[id]; delete state.notes[id]; });
    saveWork();
    toast(`✅ 重複 ${toDelete.length}件 を削除しました`); render();
  });
}
function teacherStats(){
  return teachers().map(t=>{
    const tr=responses().filter(r=>r.teacherCode===t);
    return { code:t,count:tr.length,subjects:[...new Set(tr.map(r=>r.subject))].join("・"),
      avgQ1:avgSc(tr,"q1"),avgQ2:avgSc(tr,"q2"),avgQ3:avgSc(tr,"q3"),avgQ4:avgSc(tr,"q4"),avgQ5:avgSc(tr,"q5") };
  });
}
// 1回答の①〜⑤平均（5項目を1〜5で平均）
function rowAvg(r){
  return (scKey(r.q1,"q1")+scKey(r.q2,"q2")+scKey(r.q3,"q3")+scKey(r.q4,"q4")+scKey(r.q5,"q5"))/5;
}
// この回答に不満系が含まれるか（①〜④の「不満/やや不満」＋⑤の「かえてほしい/やや不満」）
const CHANGE_Q14=new Set(["不満","やや不満"]);
function hasDirectComplaint(r){
  if(CHANGE_Q5.has(r.q5)) return true;
  return [r.q1,r.q2,r.q3,r.q4].some(v=>CHANGE_Q14.has(v));
}
function reviewCandidates(){
  const rs=responses(), names=[...new Set(rs.map(r=>r.studentName))], result={};
  teachers().forEach(t=>{ result[t]={code:t,reasons:[]}; });
  // 直接不満：①〜④の不満系 または ⑤のかえてほしい
  rs.forEach(r=>{ if(hasDirectComplaint(r)) result[r.teacherCode].reasons.push({type:"direct",r}); });
  // 相対低評価：同じ生徒の中で、この先生への①〜⑤平均 vs 他先生への①〜⑤平均
  names.forEach(name=>{
    const sr=rs.filter(r=>r.studentName===name); if(sr.length<2) return;
    sr.forEach(r=>{
      const others=sr.filter(o=>o.teacherCode!==r.teacherCode); if(!others.length) return;
      const oAvg=others.reduce((s,o)=>s+rowAvg(o),0)/others.length, my=rowAvg(r);
      if(oAvg-my>=state.threshold && !hasDirectComplaint(r)){
        if(!result[r.teacherCode].reasons.some(x=>x.r.id===r.id))
          result[r.teacherCode].reasons.push({type:"relative",r,myScore:+my.toFixed(1),othersAvg:+oAvg.toFixed(1)});
      }
    });
  });
  return Object.values(result).filter(t=>t.reasons.length>0);
}

// ── 担当ペア照合 ──────────────────────────────────────────────
// アンケート回答の生徒姓(ひらがな)を取得（姓名つながりなので前方一致用）
function respSei(r){ return toHira(r.studentName); }
// 回答の生徒名を比較用に正規化（漢字/カタカナ/ひらがな/空白ゆらぎ吸収）
function respNameNorm(r){ return normName(r.studentName); }
// 回答(r)が担当ペア(a)と同一生徒かを判定（ひらがな・漢字・異体字・手動名寄せで照合）
function sameStudent(r, a){
  const rn=respNameNorm(r);           // 回答名を正規化
  if(a.fullHira && rn===a.fullHira) return true;          // ひらがなフルネーム一致
  if(a.fullKanji && rn===a.fullKanji) return true;        // 漢字フルネーム一致
  // 手動名寄せ：回答名→名簿フルネームの対応が登録されていれば一致
  const alias=state.nameAliases[rn];
  if(alias && (alias===a.fullHira || alias===a.fullKanji)) return true;
  // フルネームが取れない場合は姓の前方一致でフォールバック
  if(!a.fullHira && a.seiHira && rn.startsWith(a.seiHira)) return true;
  return false;
}
// 担当ペア名簿のどの生徒とも一致しない回答の生徒名一覧（手動名寄せ候補）
function unmatchedStudents(){
  if(!state.assignments.length) return [];
  const rs=responses();
  const seen={};
  rs.forEach(r=>{
    if(r.elem) return; // 小学生は担当ペア名簿対象外なので照合しない
    const rn=respNameNorm(r);
    if(seen[rn]!==undefined) return;
    const matched=state.assignments.some(a=>sameStudent(r,a));
    seen[rn]={ norm:rn, name:r.studentName, grade:r.grade, matched };
  });
  return Object.values(seen).filter(s=>!s.matched);
}
// 名簿の生徒フルネーム一覧（名寄せ先の選択肢）
function rosterStudents(){
  const m={};
  state.assignments.forEach(a=>{
    const key=a.fullKanji||a.fullHira;
    if(key && !m[key]) m[key]={ label:a.fullHira||a.fullKanji, fullHira:a.fullHira, fullKanji:a.fullKanji, grade:a.grade };
  });
  return Object.values(m);
}
function openAliasModal(respNorm, respName){

}
function applyAlias(){

// 担当ペアを生徒姓ごとにまとめる
function assignBySei(){
  const m={};
  state.assignments.forEach(a=>{ (m[a.seiHira]=m[a.seiHira]||[]).push(a); });
  return m;
}
// 回答が担当ペアと一致するか照合し、誤入力を理由別に分類
function matchResults(){
  const aMap=assignBySei();
  const rs=responses();
  const errors={ teacher:[], subject:[], pair:[] }; // 先生番号ミス / 科目ちがい / 担当ペアなし
  rs.forEach(r=>{
    if(r.elem) return; // 小学生は照合対象外
    // この回答の生徒の担当ペアを探す（ひらがな・漢字どちらの入力でも照合）
    let myAssigns=null;
    for(const list of Object.values(aMap)){
      if(list.some(a=>sameStudent(r,a))){ myAssigns=list; break; }
    }
    if(!myAssigns){ return; } // 名簿にいない生徒はスルー（小学生や未取り込み）
    const respTeacherName=tName(r.teacherCode);
    const respSeiName=(respTeacherName||"").split(/[ 　]/)[0];
    const respCore=toCoreSubject(r.subject);
    // この生徒の担当ペアの中で、先生姓が一致するものを探す
    const teacherMatch=myAssigns.filter(a=>{
      const aCode=teacherNameToCode(a.teacher,state.roster);
      return aCode && aCode===r.teacherCode;
    });
    if(!teacherMatch.length){
      errors.teacher.push({r, assigns:myAssigns}); return;
    }
    // 先生は合っている → 科目照合（5教科変換後）
    const subjOk=teacherMatch.some(a=>{
      const ac=a.core;
      if(ac==="__ignore__"||respCore==="__ignore__") return true; // 総合型等はスルー
      return ac===respCore;
    });
    if(!subjOk){
      errors.subject.push({r, expect:teacherMatch.map(a=>a.core==="__unknown__"?a.subject:a.core)}); 
    }
  });
  return errors;
}
// 曜日別の未回答生徒
// ── 回答率の計算 ──────────────────────────────────────────────
// 担当ペア1件ごとに「回答済みか」を判定して返す（曜日別・未回答リスト用。週複数回もそのまま）
function assignmentAnswerStatus(){
  const rs=responses();
  return state.assignments.map(a=>{
    const code=teacherNameToCode(a.teacher,state.roster);
    const answered=rs.some(r=>r.teacherCode===code && sameStudent(r,a));
    return { ...a, code, answered };
  });
}
// 「生徒×先生×科目」でユニーク化した担当ペア（回答率の分母用。週2回は1件に集約）
function uniqueAssignments(){
  const seen={}, out=[];
  assignmentAnswerStatus().forEach(s=>{
    const key=`${s.fullHira||s.seiHira}__${s.code}__${toCoreSubject(s.subject)}`;
    if(seen[key]){ if(s.answered) seen[key].answered=true; return; } // 同キーは1件に、回答済みを優先
    seen[key]={...s}; out.push(seen[key]);
  });
  return out;
}
// 全体＆曜日別の回答率（分母は 生徒×先生×科目 のユニーク）
function responseRates(){
  const uniq=uniqueAssignments();
  const week={ "月":{a:0,t:0},"火":{a:0,t:0},"水":{a:0,t:0},"木":{a:0,t:0},"金":{a:0,t:0},"土":{a:0,t:0} };
  let totA=0, totT=0;
  // 曜日別は「その曜日に授業がある担当ペア」を数える（曜日情報が要るので元データで集計）
  assignmentAnswerStatus().forEach(s=>{
    if(s.yobi&&week[s.yobi]){ week[s.yobi].t++; if(s.answered)week[s.yobi].a++; }
  });
  // 全体はユニークで数える
  uniq.forEach(s=>{ totT++; if(s.answered)totA++; });
  return { week, total:{a:totA,t:totT} };
}
// 先生別の回答率（分母=生徒×先生×科目のユニーク担当ペア、分子=実際の回答レコード数）
function teacherResponseRates(){
  const m={};
  // 分母：担当ペアのユニーク数
  uniqueAssignments().forEach(s=>{ if(!s.code)return; (m[s.code]=m[s.code]||{a:0,t:0}); m[s.code].t++; });
  // 分子：実際の回答レコード数（小学生は担当ペア対象外なので除外）
  responses().forEach(r=>{ if(r.elem)return; if(!m[r.teacherCode]) m[r.teacherCode]={a:0,t:0}; m[r.teacherCode].a++; });
  return m;
}

function weekdayAbsentees(){
  const aMap=assignBySei();
  const rs=responses();
  const isAnswered=(a, code)=>rs.some(r=>r.teacherCode===code && sameStudent(r,a));
  const week={ "月":[],"火":[],"水":[],"木":[],"金":[],"土":[] };
  Object.entries(aMap).forEach(([sei,list])=>{
    list.forEach(a=>{
      if(!a.yobi||!week[a.yobi]) return;
      const code=teacherNameToCode(a.teacher,state.roster);
      if(!isAnswered(a, code)){
        week[a.yobi].push({ sei:(a.fullHira||sei), grade:a.grade, subject:a.subject, teacher:a.teacher, code });
      }
    });
  });
  return week;
}

//  文字コード判別
// ════════════════════════════════════════════════════════════
function decodeBytes(buf){
  const bytes=new Uint8Array(buf);
  const utf8=new TextDecoder("utf-8",{fatal:false}).decode(bytes);
  const bad=(utf8.match(/\uFFFD/g)||[]).length;
  if(bad>0){
    try{
      const sjis=new TextDecoder("shift_jis",{fatal:false}).decode(bytes);
      if(((sjis.match(/\uFFFD/g)||[]).length)<=bad) return sjis;
    }catch{}
  }
  return utf8;
}
function stripHTML(text){
  if(!/<[a-z!][\s\S]*>/i.test(text)) return text;
  const tmp=document.createElement("div"); tmp.innerHTML=text;
  return tmp.textContent||tmp.innerText||text;
}

// ── 自前XLSXパーサー（外部ライブラリ不要・オフライン対応） ──
// XLSXはZIP。ブラウザ標準のDecompressionStreamでdeflate展開して読む。
async function inflateRaw(bytes){
  const ds=new DecompressionStream("deflate-raw");
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
// ZIP内の各ファイルを {name: Uint8Array} で返す
async function unzip(buf){
  const dv=new DataView(buf), bytes=new Uint8Array(buf), files={};
  // End of Central Directory を末尾から探す
  let eocd=-1;
  for(let i=bytes.length-22; i>=0; i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error("ZIP構造が不正です");
  let cdOff=dv.getUint32(eocd+16,true), cnt=dv.getUint16(eocd+10,true), p=cdOff;
  for(let i=0;i<cnt;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true);
    const compSize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true);
    const extraLen=dv.getUint16(p+30,true);
    const commLen=dv.getUint16(p+32,true);
    const lhOff=dv.getUint32(p+42,true);
    const name=new TextDecoder("utf-8").decode(bytes.subarray(p+46,p+46+nameLen));
    // ローカルヘッダから実データ位置を計算
    const lhNameLen=dv.getUint16(lhOff+26,true);
    const lhExtraLen=dv.getUint16(lhOff+28,true);
    const dataStart=lhOff+30+lhNameLen+lhExtraLen;
    const comp=bytes.subarray(dataStart,dataStart+compSize);
    files[name]= method===0 ? comp.slice() : await inflateRaw(comp);
    p+=46+nameLen+extraLen+commLen;
  }
  return files;
}
function xmlText(u8){ return new TextDecoder("utf-8").decode(u8); }
// セル参照 "C5" → 列インデックス(0始まり)
function colIndex(ref){
  const m=ref.match(/^([A-Z]+)/); if(!m) return 0;
  let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64);
  return n-1;
}
async function parseXLSX(buf, sheetNameWanted){
  const files=await unzip(buf);
  // sharedStrings
  const shared=[];
  if(files["xl/sharedStrings.xml"]){
    const xml=xmlText(files["xl/sharedStrings.xml"]);
    const siRe=/<si\b[^>]*>([\s\S]*?)<\/si>/g; let m;
    while((m=siRe.exec(xml))){
      const tRe=/<t\b[^>]*>([\s\S]*?)<\/t>/g; let t,s="";
      while((t=tRe.exec(m[1]))) s+=decodeXMLEntities(t[1]);
      shared.push(s);
    }
  }
  // シート特定：名前指定があれば workbook.xml + rels から該当シートXMLを探す
  let sheetFile=null;
  if(sheetNameWanted && files["xl/workbook.xml"] && files["xl/_rels/workbook.xml.rels"]){
    const wb=xmlText(files["xl/workbook.xml"]);
    const rels=xmlText(files["xl/_rels/workbook.xml.rels"]);
    // シート名→r:id
    let sm, rid=null;
    const sRe=/<sheet\b[^>]*name="([^"]*)"[^>]*r:id="([^"]*)"[^>]*\/?>/g;
    while((sm=sRe.exec(wb))){ if(decodeXMLEntities(sm[1])===sheetNameWanted){ rid=sm[2]; break; } }
    if(rid){
      // r:id→ファイルパス
      const rRe=new RegExp('<Relationship\\b[^>]*Id="'+rid+'"[^>]*Target="([^"]*)"','i');
      const rmn=rels.match(rRe);
      if(rmn){ let tgt=rmn[1].replace(/^\/?xl\//,"").replace(/^\//,""); sheetFile="xl/"+tgt.replace(/^xl\//,""); }
    }
  }
  // 見つからなければ従来通り sheet1
  let sheetName=sheetFile && files[sheetFile] ? sheetFile
    : (Object.keys(files).find(n=>/^xl\/worksheets\/sheet1\.xml$/.test(n))
       || Object.keys(files).find(n=>/^xl\/worksheets\/.*\.xml$/.test(n)));
  const sx=xmlText(files[sheetName]);
  const rows=[];
  const rowRe=/<row\b[^>]*>([\s\S]*?)<\/row>/g; let rm;
  while((rm=rowRe.exec(sx))){
    const cells=[];
    const cRe=/<c\b([^>]*)>([\s\S]*?)<\/c>|<c\b([^>]*)\/>/g; let cm;
    while((cm=cRe.exec(rm[1]))){
      const attr=(cm[1]||cm[3]||""); const inner=cm[2]||"";
      const refM=attr.match(/r="([A-Z]+\d+)"/); const idx=refM?colIndex(refM[1]):cells.length;
      const isStr=/t="s"/.test(attr);
      const vM=inner.match(/<v\b[^>]*>([\s\S]*?)<\/v>/);
      const isInline=/t="inlineStr"/.test(attr);
      let val="";
      if(isInline){ const tM=inner.match(/<t\b[^>]*>([\s\S]*?)<\/t>/); val=tM?decodeXMLEntities(tM[1]):""; }
      else if(vM){ val = isStr ? (shared[parseInt(vM[1],10)]||"") : decodeXMLEntities(vM[1]); }
      cells[idx]=val;
    }
    for(let i=0;i<cells.length;i++) if(cells[i]==null) cells[i]="";
    rows.push(cells);
  }
  return rows;
}
// xlsxに含まれる全シート名を取得
async function xlsxSheetNames(buf){
  const files=await unzip(buf);
  if(!files["xl/workbook.xml"]) return [];
  const wb=xmlText(files["xl/workbook.xml"]);
  const names=[]; let sm;
  const sRe=/<sheet\b[^>]*name="([^"]*)"/g;
  while((sm=sRe.exec(wb))) names.push(decodeXMLEntities(sm[1]));
  return names;
}
function decodeXMLEntities(s){
  return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/&amp;/g,"&");
}

async function onSurveyFile(input){
  const file=input.files[0]; if(!file) return;
  state.err="読み込み中…"; render();
  try{
    const buf=await file.arrayBuffer();
    let raw;
    if(/\.csv$/i.test(file.name)){
      const text=stripHTML(decodeBytes(buf));
      raw=text.replace(/\r/g,"").trim().split("\n").map(line=>{
        const cells=[]; let cur="",inQ=false;
        for(const ch of line){ if(ch==='"')inQ=!inQ; else if(ch===','&&!inQ){cells.push(cur);cur="";} else cur+=ch; }
        cells.push(cur); return cells;
      });
    } else {
      raw=await parseXLSX(buf); // 自前パーサーのみ（外部ライブラリ不使用）
    }
    const headers=raw[0]||[];
    const tcCols=headers.reduce((a,h,i)=>{ if(String(h).includes("先生コード"))a.push(i); return a; },[]);
    if(!tcCols.length) throw new Error("「先生コード」列が見つかりません");
    // 生徒の一言（BG列）：最後の先生ブロックの後ろにある列。
    // 「理由も書いて」は各先生ブロックに出るので最後の出現を使い、その次の列を生徒メッセージとする
    let lastReasonCol=-1;
    headers.forEach((h,i)=>{ if(String(h).includes("理由も書いて")) lastReasonCol=i; });
    let msgCol = lastReasonCol>=0 ? lastReasonCol+1 : headers.length-1;
    /* 「学校」だけの列があれば拾う（設問文に「学校」が含まれる列を拾わないよう完全一致で探す） */
    const schoolCol=headers.findIndex(x=>/^(在籍)?学校(名)?$/.test(String(x).replace(/[\s　]/g,"")));
    const recs=[]; let uid=0;
    raw.slice(1).forEach(row=>{
      const camp=row[1];
      const school=schoolCol>=0 ? String(row[schoolCol]||"").trim() : "";
      const studentMsg=String(row[msgCol]||"").trim();
      tcCols.forEach(base=>{
        const tc=row[base]; if(!tc) return;
        uid++;
        recs.push({ id:uid,campus:camp||"",studentName:row[2]||"",grade:row[3]||"",school,
          teacherCode:normCode(tc),subject:row[base+1]||"",
          q1:row[base+2]||"",q2:row[base+3]||"",q3:row[base+4]||"",q4:row[base+5]||"",q5:row[base+6]||"",
          comment:String(row[base+7]||"").trim(),
          studentMsg });
      });
    });
    const campusList=[...new Set(recs.map(r=>r.campus).filter(Boolean))];
    if(campusList.length>1){
      // 2校舎以上入っているファイル。どれを取り込むか選んでもらう。
      // 選ばなかった校舎は保存もしないし、メモリにも残さない（容量あふれの原因だった）
      const cnt={}; recs.forEach(r=>{ if(r.campus) cnt[r.campus]=(cnt[r.campus]||0)+1; });
      state.err="";
      state.modal={ type:"pickCampus", list:campusList, cnt, pending:recs };
      render(); input.value=""; return;
    }
    applyImportedRecords(recs, campusList[0]||"");
  }catch(err){ state.err="読み込みエラー: "+err.message; render(); }
  input.value="";
}
/* 取り込んだ回答を「1校舎ぶんだけ」に絞って保存する。
   ここでメモリ（state.allRecords）も絞るのが大事。絞らないと、あとの保存で
   他校舎ぶんまで localStorage に書き戻されて容量があふれる。 */
function applyImportedRecords(recs, campus){
  const keep = campus ? recs.filter(r=>r.campus===campus) : recs;
  const dropped = recs.length - keep.length;
  const t = curTerm();
  keep.forEach(r=>{ if(!r.term) r.term = t; });   /* いつの学期に集めた回答かを焼き付ける */
  state.allRecords = keep;
  state.campus = campus; LS.set("survey_campus", campus);
  const sizeKB=Math.round(LS.sizeOf(keep)/1024);
  const ok=LS.set("survey_allRecords", keep);
  state.err = ok ? "" : `⚠ データの保存に失敗しました（推定${sizeKB}KB）。容量不足の可能性があります。`;
  loadWork();
  toast(`✅ ${keep.length} 件を取り込みました（${sizeKB}KB）${campus?" · "+campus:""}`+
        (dropped? ` ／ 他校舎 ${dropped} 件は保存していません` : ""));
  render();
}
/* 校舎の絞り込み。画面を作り直すと入力欄から手が離れてしまうので、
   出す・隠すだけにしてある。 */
function filterCampusList(q){
  const box=document.getElementById("campusList"); if(!box) return;
  const key=(q||"").trim().toLowerCase();
  let shown=0;
  box.querySelectorAll("[data-campus]").forEach(b=>{
    const hit = !key || (b.getAttribute("data-campus")||"").toLowerCase().indexOf(key)>=0;
    b.style.display = hit ? "flex" : "none";
    if(hit) shown++;
  });
  const none=document.getElementById("campusNone");
  if(none) none.style.display = shown ? "none" : "";
}
function pickCampus(c){
  const m=state.modal; if(!m||m.type!=="pickCampus") return;
  const recs=m.pending; state.modal=null;
  applyImportedRecords(recs, c);
}
function onTeacherFile(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      let text=stripHTML(decodeBytes(e.target.result));
      const lines=text.replace(/\r/g,"").trim().split("\n");
      const roster={...state.roster}; const dupWarn=[]; let added=0;
      lines.forEach(line=>{
        const cells=[]; let cur="",inQ=false;
        for(const ch of line){ if(ch==='"')inQ=!inQ; else if(ch===','&&!inQ){cells.push(cur);cur="";} else cur+=ch; }
        cells.push(cur);
        const full=String(cells[0]||"").trim();
        const name=String(cells[1]||"").trim().replace(/^"|"$/g,"");
        const nick=String(cells[6]||"").trim().replace(/^"|"$/g,"");
        if(!/^\d{6,7}$/.test(full)) return;
        const code=full.slice(-3);
        if(roster[code]&&roster[code].full!==full) dupWarn.push(code);
        roster[code]={full,name,nick}; added++;
      });
      state.roster=roster; LS.set("survey_roster",roster);
      state.err = added===0 ? "⚠ 先生番号が見つかりませんでした"
                : dupWarn.length ? `⚠ 下3桁が重複: ${[...new Set(dupWarn)].join(",")}`
                : `✅ 先生 ${added} 名を取り込みました`;
      render(); if(added>0) setTimeout(()=>{ state.err=""; render(); },2500);
    }catch(err){ state.err="名簿読み込みエラー: "+err.message; render(); }
  };
  reader.readAsArrayBuffer(file); input.value="";
}

async function onElemSurveyFile(input){

  try{
    const buf=await file.arrayBuffer();
    // 今の校舎のシートを探す
    const sheets=await xlsxSheetNames(buf);
    if(!sheets.length) throw new Error("シートが見つかりません");
    let target=sheets.find(n=>n===state.campus);
    if(!target) target=sheets.find(n=>state.campus && (n.includes(state.campus)||state.campus.includes(n)));
    if(!target) throw new Error(`「${state.campus||"校舎未選択"}」のシートが見つかりません。校舎を選んでから取り込んでください。`);
    const raw=await parseXLSX(buf, target);
    // ヘッダー行を探す（「先生番号」を含む行）
    let hRow=raw.findIndex(row=>row.some(c=>String(c).includes("先生番号")));
    if(hRow<0) hRow=8; // フォールバック
    const H=raw[hRow].map(x=>String(x||""));
    const col=(kw)=>H.findIndex(h=>h.includes(kw));
    const cName=col("お名前")>=0?col("お名前"):col("名前");
    const cGrade=col("学年");
    const cTcode=col("先生番号");
    const cSubj=col("科目");
    const cMsg=H.findIndex(h=>h.includes("伝えたい"));
    // ①〜⑤は「No.1」〜「No.5」を含む列
    const cQ=[1,2,3,4,5].map(n=>H.findIndex(h=>h.includes(`No.${n}`)));
    const cReason=H.findIndex(h=>h.includes("No.6")||h.includes("理由"));
    // 既存レコードの最大idから続ける
    let uid=Math.max(0,...state.allRecords.map(r=>r.id||0));
    const recs=[];
    raw.slice(hRow+1).forEach(row=>{
      const name=row[cName]; const tc=row[cTcode];
      if(!name||!tc) return; // 生徒名か先生番号が空はスキップ
      uid++;
      recs.push({ id:uid, campus:state.campus, studentName:String(name).trim(), grade:String(row[cGrade]||"").trim(),
        teacherCode:normCode(tc), subject:String(row[cSubj]||"").trim(),
        q1:row[cQ[0]]||"",q2:row[cQ[1]]||"",q3:row[cQ[2]]||"",q4:row[cQ[3]]||"",q5:row[cQ[4]]||"",
        comment:cReason>=0?String(row[cReason]||"").trim():"",
        studentMsg:cMsg>=0?String(row[cMsg]||"").trim():"",
        elem:true });
    });
    if(!recs.length) throw new Error("回答データが見つかりませんでした");
    // 既存データに合流（追加）
    const et = curTerm();
    recs.forEach(r=>{ if(!r.term) r.term = et; });   /* 小学生ぶんも学期を焼き付ける */
    state.allRecords=state.allRecords.concat(recs);
    /* メモリも今の校舎ぶんだけにする。残しておくと、あとの保存で他校舎まで書き戻される */
    if(state.campus) state.allRecords=state.allRecords.filter(r=>!r.campus || r.campus===state.campus);
    const toSave=state.allRecords;
    const sizeKB=Math.round(LS.sizeOf(toSave)/1024);
    const ok=LS.set("survey_allRecords", toSave);
    if(!ok) state.err=`⚠ 保存に失敗しました（推定${sizeKB}KB）。容量不足の可能性があります。`;
    toast(`✅ 小学生 ${recs.length}件を合流しました（${target}）`);
    render();
  }catch(err){ state.err="小学生アンケート読み込みエラー: "+err.message; render(); }
  input.value="";
}

async function onAssignFile(input){
  const file=input.files[0]; if(!file) return;
  state.err="読み込み中…"; render();
  try{
    const buf=await file.arrayBuffer();
    let rows;
    const isCSV=/\.csv$/i.test(file.name);
    if(isCSV){
      const text=stripHTML(decodeBytes(buf));
      rows=text.replace(/\r/g,"").trim().split("\n").map(line=>{
        const cells=[]; let cur="",inQ=false;
        for(const ch of line){ if(ch==='"')inQ=!inQ; else if(ch===','&&!inQ){cells.push(cur);cur="";} else cur+=ch; }
        cells.push(cur); return cells;
      });
    } else {
      rows=await parseXLSX(buf); // 自前パーサーのみ
    }
    const H=rows[0].map(x=>String(x||""));
    const idx=(kw)=>H.findIndex(h=>h.includes(kw));
    const seiCol=idx("ｾｲ")>=0?idx("ｾｲ"):idx("セイ");
    const meiCol=idx("ﾒｲ")>=0?idx("ﾒｲ"):idx("メイ");
    // 漢字の姓名列（「姓」「名」。ｾｲ/ﾒｲと混同しないよう完全一致で探す）
    const seiKanjiCol=H.findIndex(h=>h==="姓");
    const meiKanjiCol=H.findIndex(h=>h==="名");
    const gradeCol=idx("学年");
    /* 「学校」列があれば拾う。無ければ空のまま（一覧タブの学校ボタンが出ないだけ） */
    const schoolCol=H.findIndex(h=>/^(在籍)?学校(名)?$/.test(h.replace(/[\s　]/g,"")));
    // 通常授業の「科目(通常授業)①」位置から、6枠×3列を取得
    let normStart=H.findIndex(h=>h.includes("科目(通常授業)")||h.includes("科目（通常授業）"));
    if(normStart<0) normStart=H.findIndex(h=>h.includes("科目")); // フォールバック
    const assigns=[]; let students=0, skipped=0;
    rows.slice(1).forEach(r=>{
      const grade=r[gradeCol]; const sei=r[seiCol]; const mei=meiCol>=0?r[meiCol]:"";
      if(!sei) return;
      if(isElementary(grade)){ skipped++; return; } // 小学生除外
      students++;
      const seiHira=toHira(sei);
      const fullHira=toHira(sei)+toHira(mei); // 姓+名のフルネーム（同姓区別用）
      // 漢字フルネーム（生徒が漢字で入力した場合の照合用）
      const kanjiSei=seiKanjiCol>=0?String(r[seiKanjiCol]||""):"";
      const kanjiMei=meiKanjiCol>=0?String(r[meiKanjiCol]||""):"";
      const fullKanji=normName(kanjiSei+kanjiMei);
      for(let k=0;k<6;k++){
        const base=normStart+k*3;
        const subj=r[base], yobiRaw=r[base+1], tch=r[base+2];
        if(!subj||!tch) continue;
        const subjStr=String(subj).trim();
        const tchStr=String(tch).trim();
        // 先生が時刻・数値の場合は除外（Excelの列ズレ）
        if(/^\d+[\.:]\d+/.test(tchStr)||tchStr==="[object Object]") continue;
        // 集計対象外科目・小学生科目を除外
        if(toCoreSubject(subjStr)==="__ignore__") continue;
        if(SUBJECT_IGNORE.some(x=>subjStr.includes(x))) continue;
        const ym=String(yobiRaw||"").match(/[月火水木金土日]/);
        assigns.push({ seiHira, fullHira, fullKanji, grade:String(grade||""), subject:String(subj),
          school: schoolCol>=0 ? String(r[schoolCol]||"").trim() : "",
          core:toCoreSubject(subj), yobi:ym?ym[0]:"", teacher:String(tch).trim() });
      }
    });
    if(!JUKU_TERM.mark('survey')) JUKU_TERM.setMark('survey', JUKU_TERM.want('survey'));
    setAssignments(assigns);
    toast(`✅ 担当ペア ${assigns.length}件（生徒${students}名）を取り込みました${skipped?`／小学生${skipped}名を除外`:""}`);
    render();
  }catch(err){ state.err="担当ペア読み込みエラー: "+err.message; render(); }
  input.value="";
}

function doArchiveAndReset(){
  const name=(state.modal&&state.modal.value||"").trim();
  if(!name){ toast("⚠ 学期名を入力してください（例: 2025冬）"); return; }
  // 選択中の校舎の回答だけをアーカイブに保存
  const campusRecords=state.allRecords.filter(r=>!state.campus||r.campus===state.campus);
  const archiveName = state.campus ? `${name}／${state.campus}` : name;
  state.archives[archiveName]={
    term: curTerm(),
    campus: state.campus,
    records: campusRecords,
    work: {flags:state.flags,decisions:state.decisions,notes:state.notes},
    savedAt: new Date().toISOString(),
  };
  LS.set("survey_archives",state.archives);
  // リセット：選択校舎の回答だけ消す（他校舎は残す）
  state.allRecords=state.allRecords.filter(r=>state.campus && r.campus!==state.campus);
  LS.set("survey_allRecords",state.allRecords);
  state.flags={}; state.decisions={}; state.notes={}; saveWork();
  state.modal=null;
  state.err=`✅ 「${archiveName}」を保存してリセットしました`;
  render(); setTimeout(()=>{ state.err=""; render(); },3000);
}

}

/* 書き出すのは今の校舎ぶんだけ。他校舎まで入れると、読み込んだ端末で
   容量あふれ（「端末に保存できませんでした」）を起こす。 */
function onlyCampusArchives(arc, c){
  if(!c) return arc||{};
  const o={};
  Object.keys(arc||{}).forEach(k=>{ const a=arc[k]; if(!a.campus || a.campus===c) o[k]=a; });
  return o;
}
function backupPayload(){
  const c=state.campus;
  return {
    campus:c,
    allRecords: c ? state.allRecords.filter(r=>!r.campus || r.campus===c) : state.allRecords,
    archives:   onlyCampusArchives(state.archives, c),
    roster:state.roster, assignments:state.assignAll, nameAliases:state.nameAliases,
    work:{flags:state.flags,decisions:state.decisions,notes:state.notes}
  };
}
function exportBackup(){
  const data={ ...backupPayload(),
    exportedAt:new Date().toISOString() };
  const json=JSON.stringify(data,null,2);
  let downloaded=false;
  try{
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=`アンケートバックアップ_${guessTermName()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    downloaded=true;
  }catch(e){ downloaded=false; }
  // ダウンロードを試みた結果を必ず通知。失敗時／不安な時はコピー用テキストも出す
  state.modal={ type:"backup", json, downloaded };
  render();
}
function importBackup(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      const r=applyBackupData(d);
      state.err=r.failed.length
        ? "⚠ 復元しましたが端末に保存できませんでした（"+r.failed.join("・")+"／約"+r.kb+"KB）。閉じると元に戻ります。"
        : "✅ バックアップを復元しました（約"+r.kb+"KB）"+(r.skipped?"／他校舎 "+r.skipped+" 件は取り込みませんでした":"");
      render(); setTimeout(()=>{ state.err=""; render(); },4000);
    }catch(err){ state.err="復元エラー: "+err.message; render(); }
  };
  reader.readAsText(file,"UTF-8"); input.value="";
}
// 復元した中身を localStorage に書き、書けなかったものを返す。
// 戻り値 {failed:[キー名...], kb:推定サイズ}
function applyBackupData(d){
  const failed=[]; let bytes=0;
  const put=(key,val,label)=>{
    bytes+=LS.sizeOf(val);
    if(LS.set(key,val)===false) failed.push(label);
  };
  if(d.campus){ state.campus=d.campus; put("survey_campus",d.campus,"校舎"); }
  /* 古いバックアップには全校舎ぶんが入っていることがある。
     今の校舎のぶんだけ取り込む。そうしないとスマホで容量があふれる。 */
  const camp=d.campus||state.campus||"";
  let skipped=0;
  if(d.allRecords){
    let recs=d.allRecords;
    if(camp){
      const keep=recs.filter(r=>!r.campus || r.campus===camp);
      skipped=recs.length-keep.length; recs=keep;
    }
    state.allRecords=recs; put("survey_allRecords",recs,"回答");
  }
  if(d.roster){ state.roster=d.roster; put("survey_roster",d.roster,"先生名簿"); }
  if(d.archives){
    const arc=onlyCampusArchives(d.archives, camp);
    state.archives=arc; put("survey_archives",arc,"アーカイブ");
  }
  if(d.assignments){
    /* 古いバックアップは1セットだけの配列。今の学期のぶんとして受け取る */
    state.assignAll = Array.isArray(d.assignments) ? (function(){ const o={}; o[curTerm()]=d.assignments; return o; })() : d.assignments;
    put("survey_assignments", state.assignAll, "担当");
    syncAssignments();
  }
  if(d.nameAliases){
    /* 名寄せも手作業。混ぜる。 */
    state.nameAliases=JUKU_SYNC.merge(state.nameAliases, d.nameAliases, JUKU_SYNC.iAmNewer('survey', d._touchedAt));
    put("survey_nameAliases",state.nameAliases,"名寄せ");
  }
  if(d.work){
    /* 判断・メモ・フラグは手で入れたもの。上書きせずに混ぜる。 */
    const mineNewer = JUKU_SYNC.iAmNewer('survey', d._touchedAt);
    state.flags     = JUKU_SYNC.merge(state.flags,     d.work.flags||{},     mineNewer);
    state.decisions = JUKU_SYNC.merge(state.decisions, d.work.decisions||{}, mineNewer);
    state.notes     = JUKU_SYNC.merge(state.notes,     d.work.notes||{},     mineNewer);
    bytes+=LS.sizeOf(d.work);
    if(LS.set(workKey(),{flags:state.flags,decisions:state.decisions,notes:state.notes})===false) failed.push("判断・メモ");
  }
  // 本当に読み戻せるかを確かめる。書けたつもりで消えているケースを拾う。
  if(d.allRecords && !failed.length){
    const back=LS.get("survey_allRecords",null);
    if(!back || back.length!==d.allRecords.length) failed.push("回答（書き戻し確認に失敗）");
  }
  return { failed, kb: Math.round(bytes/1024), skipped };
}
function checkStorage(){
  const el=document.getElementById("storageMsg"); if(!el) return;
  const lines=[]; let total=0;
  const mine=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i), v=localStorage.getItem(k)||"";
    const kb=(k.length+v.length)/1024; total+=kb;
    if(k.indexOf("survey_")===0) mine.push([k,kb]);
  }
  mine.sort((a,b)=>b[1]-a[1]);
  lines.push("このツールのデータ:");
  if(!mine.length) lines.push("　（まだ何も入っていません）");
  mine.forEach(([k,kb])=>lines.push("　"+k.replace("survey_","")+"　"+Math.round(kb)+"KB"));
  lines.push("この端末の合計: "+Math.round(total)+"KB（他の塾ツールと共用）");
  // あとどれだけ書けるか実際に試す
  const KEY="__survey_probe__"; let free=0;
  try{
    const block="x".repeat(64*1024); let buf="";
    while(buf.length < 8*1024*1024){
      try{ localStorage.setItem(KEY, buf+block); buf+=block; }catch(e){ break; }
    }
    free=buf.length/1024;
  }catch(e){}
  try{ localStorage.removeItem(KEY); }catch(e){}
  lines.push("あと書ける目安: "+Math.round(free)+"KB");
  if(free < 300) lines.push("⚠ 空きが少ないです。アーカイブを減らすか、パソコンで作業してください。");
  el.textContent=lines.join(String.fromCharCode(10));
}
function syncMsgSet(text,color){

async function syncSave(opts){
  opts = opts || {};
  const url=(LS.get('survey_syncUrl','')||'').trim(), key=(LS.get('survey_syncKey','')||'').trim();
  if(!url||!key){ if(!opts.auto) syncMsgSet("接続先URLと合言葉を入力してください","#f87171"); return; }
  syncMsgSet("スプシに保存中…","#94a3b8");
  const data=backupPayload();
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key,tool:'survey',data:JSON.stringify(Object.assign(
        JUKU_SYNC.stamp(data), {_touchedAt:JUKU_SYNC.touchedAt('survey')}))})});
    const d=await res.json();
    if(d.ok){ JUKU_SYNC.noteSaved('survey'); JUKU_SYNC.refresh('syncInfo');
      syncMsgSet("✅ 保存しました（"+new Date().toLocaleTimeString()+"／"+JUKU_SYNC.deviceName()+"）","#16a34a"); }
    else syncMsgSet("エラー: "+(d.error||"不明"),"#f87171");
  }catch(e){ syncMsgSet("通信エラー: ネット接続を確認してください","#f87171"); }
}
async function syncLoad(opts){
  opts = opts || {};
  const url=(LS.get('survey_syncUrl','')||'').trim(), key=(LS.get('survey_syncKey','')||'').trim();
  if(!url||!key){ if(!opts.auto) syncMsgSet("接続先URLと合言葉を入力してください","#f87171"); return; }
  /* 自動のときは確認を出さない。手で入れたもの（判断・メモ）は混ぜるので消えない。 */
  if(!opts.auto && !confirm('スプシの内容をこの端末に取り込みます。\n手で入れたもの（判断・メモ）は残ります。よろしいですか？'))return;
  syncMsgSet("スプシから読込中…","#94a3b8");
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key,tool:'survey',action:'load'})});
    const d=await res.json();
    if(d.ok){
      if(!d.data){ syncMsgSet("スプシにまだデータがありません（先に保存してください）","#f87171"); return; }
      const r=applyBackupData(JSON.parse(d.data));
      if(r.failed.length){
        syncMsgSet("⚠ 読み込みましたが端末に保存できませんでした（"+r.failed.join("・")+
          "／約"+r.kb+"KB）。閉じると元に戻ります。不要なアーカイブを削除するか、パソコンでお試しください。","#f87171");
        return;
      }
      JUKU_SYNC.refresh('syncInfo');
      if(opts.auto){
        /* 自動のときは画面を作り直さない（開くたびに再読込されると煩わしい） */
        syncMsgSet("✅ スプシのほうが新しかったので読み込みました（約"+r.kb+"KB）","#16a34a");
        loadAssignAll(); render();
      }else{
        syncMsgSet("✅ 読み込んで端末に保存しました（約"+r.kb+"KB）"+
          (r.skipped?"／他校舎 "+r.skipped+" 件は取り込みませんでした":"")+"。画面を作り直します…","#16a34a");
        setTimeout(()=>location.reload(),700);
      }
      return;
    } else { syncMsgSet("エラー: "+(d.error||"不明"),"#f87171"); }
  }catch(e){ syncMsgSet("通信エラー: ネット接続を確認してください","#f87171"); }
}
function openPasteRestore(){ state.modal={type:"pasteRestore"}; render(); }
function applyPasteRestore(){
  const ta=document.getElementById("pasteRestoreText");
  if(!ta||!ta.value.trim()){ toast("テキストを貼り付けてください"); return; }
  try{
    const d=JSON.parse(ta.value);
    const r=applyBackupData(d);
    state.modal=null;
    state.err=r.failed.length
      ? "⚠ 復元しましたが端末に保存できませんでした（"+r.failed.join("・")+"／約"+r.kb+"KB）。閉じると元に戻ります。"
      : "✅ テキストから復元しました（約"+r.kb+"KB）"+(r.skipped?"／他校舎 "+r.skipped+" 件は取り込みませんでした":"");
    render(); setTimeout(()=>{ state.err=""; render(); },4000);
  }catch(err){ toast("⚠ 復元できません。テキストが正しいJSONか確認してください"); }
}

function exportDecisions(){
  const lines=["生徒名,学年,先生コード,先生名,科目,総合満足度,判断,メモ"];
  reviewCandidates().forEach(t=>{
    t.reasons.forEach(reason=>{
      const r=reason.r, dec=state.decisions[r.id];
      const decLabel={continue:"継続",watch:"要観察",change:"交代"}[dec]||"";
      const note=(state.notes[r.id]||"").replace(/"/g,'""');
      lines.push(`"${r.studentName}","${r.grade}",${r.teacherCode},"${tName(r.teacherCode)}","${r.subject}","${r.q5}","${decLabel}","${note}"`);
    });
  });
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`担当判断_${state.campus}.csv`; a.click(); URL.revokeObjectURL(url);
}

let pendingConfirm=null;
function askConfirm(message, onYes){
  pendingConfirm=onYes;
  state.modal={type:"confirm",message};
  render();
}
function confirmYes(){ const fn=pendingConfirm; pendingConfirm=null; state.modal=null; render(); if(fn) fn(); }
function confirmNo(){ pendingConfirm=null; state.modal=null; render(); }
let __toastT=null;
function showToast(msg,kind){
  const el=document.getElementById("toastbox"); if(!el) return;
  el.textContent=msg;
  el.className="on"+(kind?" "+kind:"");
  clearTimeout(__toastT);
  if(kind!=="ng") __toastT=setTimeout(()=>{ el.className=""; },3200);   // エラーは残す
}
function toastKind(msg){
  const m=String(msg||"");
  if(m.indexOf("✅")>=0) return "ok";
  if(m.indexOf("⚠")>=0||m.indexOf("エラー")>=0||m.indexOf("失敗")>=0) return "ng";
  return "";
}
function toast(msg){ state.err=msg; render(); showToast(msg,toastKind(msg));
  setTimeout(()=>{ if(state.err===msg){ state.err=""; render(); } },2800); }

// 分布グラフ生成
function distBars(rs, key, order, colorMap){
  const dist=order.map(v=>({label:v,count:rs.filter(r=>r[key]===v).length,fill:colorMap[v]||"#94a3b8"}));
  const maxC=Math.max(1,...dist.map(d=>d.count));
  return `<div class="barwrap">${dist.map(d=>`<div class="bar-col"><div style="font-size:11px;color:#64748b">${d.count}</div><div class="bar" style="height:${d.count/maxC*120}px;background:${d.fill}"></div><div style="font-size:9px;color:#94a3b8;text-align:center">${d.label}</div></div>`).join("")}</div>`;
}

// 過去アーカイブ（同じ校舎）を保存日時の新しい順に取得
function pastArchivesForCampus(){
  return Object.entries(state.archives)
    .filter(([_,a])=>!a.campus || a.campus===state.campus)
    .sort((x,y)=>new Date(y[1].savedAt)-new Date(x[1].savedAt));
}
// 指定先生コードの①〜⑤平均を、与えられたレコード配列から算出
function radarFromRecords(records, code){
  const tr=records.filter(r=>normCode(r.teacherCode)===code);
  if(!tr.length) return null;
  return [avgSc(tr,"q5"),avgSc(tr,"q1"),avgSc(tr,"q2"),avgSc(tr,"q3"),avgSc(tr,"q4")];
}
function renderTeacher(){
  const past=pastArchivesForCampus().slice(0,2); // 直近2学期分
  const PAST_STYLE=[{color:"#f59e0b",dash:"5,3"},{color:"#64748b",dash:"1.5,2.5"}]; // 破線・点線で区別
  const trates=teacherResponseRates();
  return teacherStats().map(t=>{
    const tr=responses().filter(r=>r.teacherCode===t.code);
    const radar=[["⑤総合",t.avgQ5],["①わかりやすさ",t.avgQ1],["②楽しさ",t.avgQ2],["③ほめる",t.avgQ3],["④納得まで",t.avgQ4]];
    // 回答率
    const rr=trates[t.code]; const rp=rr&&rr.t?Math.round(rr.a/rr.t*100):null;
    const rpColor=rp===null?"#94a3b8":rp>=80?"#16a34a":rp>=50?"#ca8a04":"#dc2626";
    // 過去学期の重ね描画データ
    const series=[];
    past.forEach((arc,i)=>{
      const [name,a]=arc;
      const vals=radarFromRecords(a.records||[], t.code);

    return `<div class="card" style="padding:16px;margin-bottom:12px">

        <b style="font-size:13px">${esc(tName(t.code)||"（名簿未登録）")}</b>

        <span style="color:#64748b;font-size:11px">${esc(t.subjects)} · ${t.count}件</span>
        ${rp!==null?`<span style="margin-left:auto;font-size:11px;background:${rpColor}1a;color:${rpColor};border-radius:6px;padding:3px 9px;font-weight:700">回答率 ${rp}%<span style="font-weight:400"> (${rr.a}/${rr.t})</span></span>`:""}
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
