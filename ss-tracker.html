   ========================================================================== */

function setMsg(id, txt, cls) {
  var n = el(id); if (!n) return;
  n.className = 'msg' + (cls ? ' ' + cls : '');
  n.textContent = txt;
}

/* ---------- ファイル取り込み -------------------------------------------- */
async function importFiles(files, msgId) {
  var list = Array.prototype.slice.call(files).filter(function (f) { return /\.xlsx$/i.test(f.name); });
  if (!list.length) { setMsg(msgId, 'xlsx ファイルがありません。', 'er'); return { ok: 0, ng: 0 }; }
  var prog = el('prog'), progi = el('progi');
  if (prog) { prog.style.display = 'block'; progi.style.width = '0%'; }

  var ok = 0, ng = [], added = [];
  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    try {
      var buf = new Uint8Array(await f.arrayBuffer());
      var snap = await parseSSFile(buf, { tests: DB.cfg.tests !== false });
      DB.snaps[snap.date] = trimSnap(snap);
      added.push(snap.date); ok++;
    } catch (e) {
      ng.push(f.name + ' … ' + e.message);
    }
    if (prog) progi.style.width = Math.round((i + 1) / list.length * 100) + '%';
    if (msgId) setMsg(msgId, '読み込み中… ' + (i + 1) + ' / ' + list.length);
  }

  // 期（上期/下期）は単一ファイルでは決まらない日があるので、履歴で前後から確定させる
  bust();
  var arr = allDates().map(function (d) { return DB.snaps[d]; });
  resolveTerms(arr);
  arr.forEach(function (s) { DB.snaps[s.date] = s; });

  var saved = saveSnaps();
  if (prog) setTimeout(function () { prog.style.display = 'none'; }, 700);

  var txt = ok + '件を取り込みました' + (saved ? '' : '（※保存に失敗）') + '。';
  if (added.length) {
    added.sort();
    txt += '\n' + fmtDate(added[0]) + ' 〜 ' + fmtDate(added[added.length - 1]);
  }
  if (ng.length) txt += '\n\n読めなかったファイル ' + ng.length + '件:\n' + ng.join('\n');
  if (msgId) setMsg(msgId, txt, ng.length ? 'er' : 'ok');
  return { ok: ok, ng: ng.length, added: added };
}

/* ---------- 貢献シート(PDF)の取り込み ---------------------------------- */
async function importKouken(file) {
  if (!file) return;
  if (!/.pdf$/i.test(file.name)) { setMsg('kmsg', 'PDFファイルを選んでください。', 'er'); return; }
  setMsg('kmsg', '読み込んでいます…（少し時間がかかります）');
  try {
    var bytes = new Uint8Array(await file.arrayBuffer());
    var items = await pdfExtract(bytes);
    var sheets = parseKouken(items);
    if (!sheets.length) throw new Error('先生ごとの表を見つけられませんでした。貢献シートのPDFか確認してください');
    // 年度・学期を拾う
    var head = items.filter(function (i) { return i.page === 1; }).map(function (i) { return i.t; }).join(' ');
    var y = head.match(/(20dd)s*年度/), t = head.match(/([1-3１-３])s*学期/);
    var term = (y ? y[1] + '年度' : '') + (t ? t[1] + '学期' : '');
    // ポイントの検算（ランクの上下と合うか）。列がずれていればここで大きく崩れる。
    var chk = 0, ok = 0;
    sheets.forEach(function (s) {
      s.rows.forEach(function (r) {
        if (typeof r.pAvg !== 'number' || typeof r.cAvg !== 'number' || typeof r.incT !== 'number') return;
        chk++;
        var c = kPoint(r.pAvg, r.cAvg);
        if (c === r.incT || Math.abs(c - r.incT) < 0.5) ok++;   // マイナスポイント分のズレは許す
      });
    });
    var rate = chk ? ok / chk : 0;
    var rows = sheets.reduce(function (a, s) { return a + s.rows.length; }, 0);
    if (chk >= 20 && rate < 0.7) {
      setMsg('kmsg', '読み取れましたが、点数とポイントが合いません（' + Math.round(rate * 100) + '%）。' + nlq() +
        '列の位置が違うPDFの可能性があります。取り込みは中止しました。', 'er');
      return;
    }
    lsSet(LS_KOUKEN, { term: term, sheets: sheets, importedAt: new Date().toISOString() });
    bust();
    setMsg('kmsg', '取り込みました。' + (term ? term + '／' : '') + '先生' + sheets.length + '名・' + rows + '行' + nlq() +
      'ポイントの検算 ' + ok + '/' + chk + '件が一致（マイナスポイントの分はズレます）', 'ok');
    refreshAll(); renderCfg();
  } catch (e) {
    setMsg('kmsg', '読み込めませんでした: ' + e.message, 'er');
  }
}
function nlq() { return String.fromCharCode(10); }

/* ---------- フォルダ監視（File System Access API） ----------------------- */
/* 社内システムのリンクからは自動でファイルを取れないので、
   「いつも通りダウンロードする」ところまでは人がやり、そこから先を自動にする。 */
var IDB_NAME = 'ss_tracker', IDB_STORE = 'kv';
function idb() {
  return new Promise(function (res, rej) {
    var r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = function () { r.result.createObjectStore(IDB_STORE); };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { rej(r.error); };
  });
}
async function idbSet(k, v) {
  var db = await idb();
  return new Promise(function (res, rej) {
    var tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(v, k);
    tx.oncomplete = function () { res(); }; tx.onerror = function () { rej(tx.error); };
  });
}
async function idbGet(k) {
  var db = await idb();
  return new Promise(function (res, rej) {
    var tx = db.transaction(IDB_STORE, 'readonly');
    var q = tx.objectStore(IDB_STORE).get(k);
    q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); };
  });
}

function fsSupported() { return typeof window.showDirectoryPicker === 'function'; }

async function fsPickDir() {
  if (!fsSupported()) {
    setMsg('fsmsg', 'このブラウザ／開き方ではフォルダ監視が使えません。\n' +
      'START-TOOL.bat（localhost）か公開版のURLから、Chrome か Edge で開いてください。', 'er');
    return;
  }
  try {
    var h = await window.showDirectoryPicker({ id: 'ssdl', mode: 'read' });
    await idbSet('dir', h);
    setMsg('fsmsg', 'フォルダを登録しました。未取込のファイルを確認します…', 'ok');
    await fsScan(true);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    setMsg('fsmsg', '登録できませんでした: ' + e.message, 'er');
  }
}

async function fsScan(verbose) {
  if (!fsSupported()) { if (verbose) setMsg('fsmsg', 'このブラウザ／開き方では使えません。', 'er'); return; }
  var h;
  try { h = await idbGet('dir'); } catch (e) { h = null; }
  if (!h) { if (verbose) setMsg('fsmsg', 'まだフォルダが登録されていません。', 'er'); return; }

  var perm = await h.queryPermission({ mode: 'read' });
  if (perm !== 'granted') {
    if (!verbose) { setMsg('fsmsg', 'フォルダの読み取り許可が切れています。「今すぐ確認」を押して許可してください。', 'er'); return; }
    perm = await h.requestPermission({ mode: 'read' });
    if (perm !== 'granted') { setMsg('fsmsg', '許可されませんでした。', 'er'); return; }
  }

  var seen = DB.ui.seen || (DB.ui.seen = {});
  var picks = [];
  for await (var ent of h.values()) {
    if (ent.kind !== 'file') continue;
    if (!/\.xlsx$/i.test(ent.name)) continue;
    if (!/成績進捗/.test(ent.name)) continue;
    if (seen[ent.name]) continue;
    picks.push(ent);
  }
  if (!picks.length) { if (verbose) setMsg('fsmsg', '新しいSSファイルはありませんでした。', 'ok'); return; }

  var files = [];
  for (var i = 0; i < picks.length; i++) files.push(await picks[i].getFile());
  var res = await importFiles(files, 'fsmsg');
  picks.forEach(function (p) { seen[p.name] = 1; });
  saveUi();
  setMsg('fsmsg', '新しく ' + res.ok + '件 取り込みました。' + (res.ng ? '（' + res.ng + '件は読めませんでした）' : ''),
    res.ng ? 'er' : 'ok');
  refreshAll();
}

/* ---------- スプレッドシート同期 ---------------------------------------- */
async function syncPost(action, data) {
  var url = (DB.cfg.syncUrl || '').trim(), key = (DB.cfg.syncKey || '').trim();
  if (!url || !key) throw new Error('URLと合言葉を入れてください');
  var res = await fetch(url, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // preflightを避けるため text/plain
    body: JSON.stringify({ key: key, tool: 'ss', action: action, data: data || '' })
  });
  var j = await res.json();
  if (!j.ok) throw new Error(j.error || '不明なエラー');
  return j;
}
function syncPayload() {
  return JSON.stringify({ v: 1, snaps: DB.snaps, cfg: DB.cfg, memo: DB.memo, out: DB.out });
}
async function syncSave() {
  try {
    setMsg('syncmsg', '保存しています…');
    var j = await syncPost('save', syncPayload());
    setMsg('syncmsg', '保存しました（' + Math.round(j.bytes / 1024) + ' KB／' + j.cells + 'セル）。', 'ok');
  } catch (e) { setMsg('syncmsg', '保存できませんでした: ' + e.message, 'er'); }
}
async function syncLoad() {
  try {
    setMsg('syncmsg', '読み込んでいます…');
    var j = await syncPost('load');
    if (!j.data) { setMsg('syncmsg', 'まだ何も保存されていません。', 'er'); return; }
    var o = JSON.parse(j.data);
    if (!o || !o.snaps) throw new Error('中身が読めませんでした');
    DB.snaps = o.snaps;
    if (o.cfg) { var u = DB.cfg.syncUrl, k = DB.cfg.syncKey; DB.cfg = Object.assign({}, DEF_CFG, o.cfg); DB.cfg.syncUrl = u; DB.cfg.syncKey = k; }
    if (o.memo) DB.memo = o.memo;
    if (o.out) DB.out = o.out;
    saveSnaps(); saveCfg(); saveMemo(); saveOut();
    setMsg('syncmsg', '読み込みました（' + allDates().length + '日分／更新 ' + (j.updatedAt || '—') + '）。', 'ok');
    boot(true);
  } catch (e) { setMsg('syncmsg', '読み込めませんでした: ' + e.message, 'er'); }
}

/* ---------- 設定画面の配線 ---------------------------------------------- */
function wireCfg() {
  var drop = el('drop');
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', async function (e) {
    await importFiles(e.dataTransfer.files, 'impmsg'); refreshAll();
  });
  el('pick').onclick = function () { el('fin').click(); };
  el('fin').onchange = async function () { await importFiles(this.files, 'impmsg'); this.value = ''; refreshAll(); };
  el('cbTests').onchange = function () { DB.cfg.tests = this.checked; saveCfg(); renderCfg(); };

  var kdrop = el('kdrop');
  if (kdrop && kdrop.addEventListener) {
    ['dragenter', 'dragover'].forEach(function (ev) {
      kdrop.addEventListener(ev, function (e) { e.preventDefault(); kdrop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      kdrop.addEventListener(ev, function (e) { e.preventDefault(); kdrop.classList.remove('over'); });
    });
    kdrop.addEventListener('drop', function (e) { importKouken(e.dataTransfer.files[0]); });
  }
  el('kpick').onclick = function () { el('kfin').click(); };
  el('kfin').onchange = function () { importKouken(this.files[0]); this.value = ''; };
  el('cbShowOut').onchange = function () { DB.cfg.showOut = this.checked; saveCfg(); refreshAll(); renderCfg(); };
  el('pruneOut').onclick = function () {
    if (!confirm('在籍外の先生のデータを保存から消します。画面の表示は変わりません（もともと出していないため）。よろしいですか？')) return;
    var n = pruneOut();
    refreshAll(); renderCfg();
    setMsg('impmsg', n + '名分を消しました。保存サイズは ' + sizeKB() + ' KB になりました。', 'ok');
  };

  el('fsPick').onclick = fsPickDir;
  el('fsScan').onclick = function () { fsScan(true); };
  el('fsClear').onclick = async function () {
    await idbSet('dir', null); DB.ui.seen = {}; saveUi();
    setMsg('fsmsg', 'フォルダの登録を解除しました。', 'ok');
  };
  if (!fsSupported()) {
    setMsg('fsmsg', 'この開き方ではフォルダ監視が使えません（file:// で開いているか、対応していないブラウザです）。', 'er');
  }

  el('syncSave').onclick = function () {
    DB.cfg.syncUrl = el('syncUrl').value.trim(); DB.cfg.syncKey = el('syncKey').value.trim(); saveCfg(); syncSave();
  };
  el('syncLoad').onclick = function () {
    DB.cfg.syncUrl = el('syncUrl').value.trim(); DB.cfg.syncKey = el('syncKey').value.trim(); saveCfg(); syncLoad();
  };

  Array.prototype.forEach.call(document.querySelectorAll('.wIn'), function (s) {
    s.oninput = function () { el('w-' + s.getAttribute('data-k')).textContent = s.value; };
  });
  el('sizeW').oninput = function () { el('w-size').textContent = this.value; };
  el('cfgSave').onclick = function () {
    var g = {};
    Array.prototype.forEach.call(document.querySelectorAll('.goalIn'), function (i) {
      var v = parseFloat(i.value);
      if (isFinite(v)) g[i.getAttribute('data-k')] = v / 100;
    });
    DB.cfg.goals = g;
    var mn = parseInt(el('minN').value, 10); if (isFinite(mn) && mn > 0) DB.cfg.minN = mn;
    var lg = parseFloat(el('lowGap').value); if (isFinite(lg) && lg > 0) DB.cfg.lowGap = lg / 100;
    var w = {};
    Array.prototype.forEach.call(document.querySelectorAll('.wIn'), function (i) { w[i.getAttribute('data-k')] = (+i.value) / 100; });
    DB.cfg.weights = w;
    var sw = parseInt(el('sizeW').value, 10); if (isFinite(sw)) DB.cfg.sizeW = sw / 100;
    DB.cfg.autoOut = el('cbAuto').checked;
    saveCfg(); refreshAll(); renderCfg();
  };
  el('cfgReset').onclick = function () {
    var u = DB.cfg.syncUrl, k = DB.cfg.syncKey, t = DB.cfg.tests;
    DB.cfg = Object.assign({}, DEF_CFG); DB.cfg.syncUrl = u; DB.cfg.syncKey = k; DB.cfg.tests = t;
    saveCfg(); refreshAll(); renderCfg();
  };
  el('cbAuto').onchange = function () { DB.cfg.autoOut = this.checked; saveCfg(); refreshAll(); renderCfg(); };
  Array.prototype.forEach.call(document.querySelectorAll('.outCb'), function (c) {
    c.onchange = function () {
      var k = c.getAttribute('data-k');
      if (c.checked) DB.out[k] = 1; else delete DB.out[k];
      saveOut(); refreshAll();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-rm]'), function (a) {
    a.onclick = function (e) {
      e.preventDefault();
      var d = a.getAttribute('data-rm');
      if (!confirm(fmtDate(d) + ' のデータを消します。よろしいですか？')) return;
      delete DB.snaps[d]; saveSnaps(); boot(true); show('cfg');
    };
  });
  el('thinOld').onclick = function () {
    if (!confirm((DB.cfg.keepDays || 70) + '日より古い日を間引きます。日曜（前週の確定値）だけが残り、テスト回別は落ちます。よろしいですか？')) return;
    var r = thinOld();
    refreshAll(); renderCfg();
    setMsg('impmsg', '平日 ' + r.removed + '日分を削除し、' + r.thinned + '日分を累計だけにしました。保存サイズは ' + sizeKB() + ' KB になりました。', 'ok');
  };
  el('wipe').onclick = function () {
    if (!confirm('取り込んだSSデータ・タッチ履歴・設定をすべて消します。よろしいですか？')) return;
    [LS_SNAP, LS_CFG, LS_MEMO, LS_OUT, LS_UI].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
    location.reload();
  };
}

/* ---------- タブ切替と起動 ---------------------------------------------- */
var PANES = { touch: renderTouch, list: renderList, card: renderCard, yurei: renderYurei,
              school: renderSchool, corr: renderCorr, cfg: renderCfg };
function show(p) {
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.classList.toggle('on', b.getAttribute('data-p') === p);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.pane'), function (n) {
    n.classList.toggle('on', n.id === 'p-' + p);
  });
  DB.ui.tab = p; saveUi();
  try { PANES[p](); }
  catch (e) {
    el('p-' + p).innerHTML = '<div class="card"><div class="empty">表示中にエラーが起きました。<br>' +
      esc(e.message) + '</div></div>';
  }
}
function refreshAll() {
  fillSelectors();
  var t = DB.ui.tab && PANES[DB.ui.tab] ? DB.ui.tab : 'touch';
  show(t);
}

function fillSelectors() {
  var ds = allDates();
  var sd = el('selDate'), sb = el('selBlock');
  if (!ds.length) {
    sd.innerHTML = ''; sb.innerHTML = '';
    el('asof').innerHTML = 'データ未取込';
    VIEW.date = null; VIEW.block = null;
    return;
  }
  if (!VIEW.date || ds.indexOf(VIEW.date) < 0) VIEW.date = DB.ui.date && ds.indexOf(DB.ui.date) >= 0 ? DB.ui.date : ds[ds.length - 1];
  sd.innerHTML = ds.slice().reverse().map(function (d) {
    var s = snapAt(d);
    return '<option value="' + d + '"' + (d === VIEW.date ? ' selected' : '') + '>' +
      fmtDate(d) + (s.finalized ? ' 確定' : '') + '</option>';
  }).join('');

  var s = snapAt(VIEW.date), ks = blockKeys(s);
  if (!VIEW.block || ks.indexOf(VIEW.block) < 0) VIEW.block = defaultBlock(s);
  sb.innerHTML = ks.map(function (k) {
    return '<option value="' + k + '"' + (k === VIEW.block ? ' selected' : '') + '>' + esc(blockLabel(k)) + '</option>';
  }).join('');

  el('asof').innerHTML = '<b>' + fmtDate(VIEW.date) + '</b> のSS ／ 中身は <b>' + dataThrough(VIEW.date) + 'まで</b>' +
    ' ／ 週 <b>' + (s.week ? mdOf(s.week.start) + '〜' + mdOf(s.week.end) : '—') + '</b> ' +
    weekChip(s) + ' <span class="sm">' + esc(s.term || '') + '期</span>';
}

function boot(reload) {
  if (!reload) dbLoad();
  fillSelectors();
  el('selDate').onchange = function () { VIEW.date = this.value; DB.ui.date = this.value; saveUi(); fillSelectors(); show(DB.ui.tab || 'touch'); };
  el('selBlock').onchange = function () { VIEW.block = this.value; show(DB.ui.tab || 'touch'); };
  el('btnPrint').onclick = function () { window.print(); };
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.onclick = function () { show(b.getAttribute('data-p')); };
  });
  show(DB.ui.tab && PANES[DB.ui.tab] ? DB.ui.tab : 'touch');
  // フォルダを登録済みなら、開いた時点で未取込のファイルを静かに取り込む
  if (!reload && fsSupported()) { setTimeout(function () { fsScan(false); }, 400); }
}

if (typeof document !== 'undefined' && document.getElementById('selDate')) boot();
