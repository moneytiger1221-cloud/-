<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塾ツール（統合）</title>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:#eef2f7;}
#shell{display:flex;flex-direction:column;height:100%;}
/* ---- 上部タブバー ---- */
#navbar{flex:0 0 auto;display:flex;align-items:stretch;background:#22303f;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:10;}
#brand{display:flex;align-items:center;gap:8px;padding:0 16px;color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px;
  background:#1a2531;white-space:nowrap;}
#brand .bmark{font-size:17px;}
/* タブの並びだけを横スクロールさせる。ブランドと右側のボタンは固定のまま。 */
#navtabs{display:flex;align-items:stretch;flex:1 1 auto;min-width:0;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#navtabs::-webkit-scrollbar{display:none;}
.navtab{flex:0 0 auto;border:none;background:transparent;color:#a8b8c8;font-family:inherit;font-size:13.5px;font-weight:700;
  padding:13px 20px;cursor:pointer;position:relative;white-space:nowrap;transition:background .12s,color .12s;}
.navtab:hover{background:#2c3e50;color:#e2ecf5;}
.navtab.on{background:#f4f6f9;color:#22303f;}
.navtab .ic{margin-right:6px;font-size:14px;}
.navtab .ld{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:8.5px;color:#7f96ab;font-weight:600;}
.navtab.on .ld{color:#8aa0b5;}
#navright{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 14px;color:#8aa0b5;font-size:11px;}
#navright button{border:1px solid #44586c;background:#2c3e50;color:#cfe0ee;border-radius:6px;
  padding:5px 10px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;}
#navright button:hover{background:#3a4f63;}
/* ---- 本体 ---- */
#panes{flex:1 1 auto;position:relative;min-height:0;background:#f4f6f9;}
.pane{position:absolute;inset:0;display:none;}
.pane.on{display:block;}
.pane iframe{width:100%;height:100%;border:none;display:block;background:#fff;}
/* 未読込み時のプレースホルダ */
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;color:#5a6b7d;}
.ph .sp{width:34px;height:34px;border:3px solid #cfd8e3;border-top-color:#2b6fe0;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ph .msg{font-size:13px;}
.errbox{max-width:520px;margin:auto;padding:22px;background:#fff;border:1px solid #f2b7b2;border-radius:10px;color:#33465a;
  font-size:13px;line-height:1.9;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.errbox b{color:#b83b34;}
.errbox code{background:#f4f6f9;border:1px solid #dde3ea;border-radius:4px;padding:1px 6px;font-size:12px;}
/* ===== スマホ表示（幅820px以下）=====
   PCの見た目は変えない。上部のタブが画面を占領しないよう縮める。
   タブの並び(#navtabs)は横スクロールするので、入りきらなくても指で送れる。 */
@media (max-width: 820px){
  #brand{padding:0 8px;font-size:12px;}    /* タブに幅を回す */
  #brand span:last-child{display:none;}
  .navtab{padding:8px 9px;font-size:12.5px;}
  .navtab .ld{display:none;}
  #navright{padding:0 8px;gap:6px;}
  #hint{display:none;}                     /* 長い説明文がタブの幅を奪うため隠す */
  #navright button{padding:4px 8px;font-size:10.5px;}
  #btnOpen{display:none;}                  /* 別窓はスマホでは使わないので、タブに幅を回す */
}
/* ===== 取込センター ===== */
.imp{padding:14px;overflow:auto;height:100%;box-sizing:border-box;background:#f6f8fa;
  font-size:13px;color:#334155;-webkit-overflow-scrolling:touch;}
.imp-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);}
.imp-card h3{margin:0 0 10px;font-size:14px;color:#1e293b;}
.imp-warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;
  padding:12px 14px;margin-bottom:12px;line-height:1.7;}
.imp-drop{border:2px dashed #cbd5e1;border-radius:10px;padding:26px 14px;text-align:center;
  color:#64748b;cursor:pointer;background:#fbfdff;line-height:1.9;}
.imp-drop.on{border-color:#2b6fe0;background:#eff6ff;}
.imp-dim{color:#94a3b8;font-size:11.5px;font-weight:400;}
.imp-empty{color:#94a3b8;font-size:12.5px;padding:10px 2px;}
.imp-ng{color:#b45309;font-weight:700;}
.imp-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.imp-tbl th{text-align:left;font-weight:700;color:#64748b;font-size:11.5px;
  border-bottom:1px solid #e2e8f0;padding:5px 6px;white-space:nowrap;}
.imp-tbl td{border-bottom:1px solid #f1f5f9;padding:6px;vertical-align:middle;}
.imp-tbl tr.imp-unknown{background:#fffbeb;}
.imp-name{word-break:break-all;max-width:230px;}
.imp-tbl select{font-size:12px;padding:3px 5px;border:1px solid #cbd5e1;border-radius:5px;
  background:#fff;font-family:inherit;max-width:160px;}
.imp-x{border:1px solid #e2e8f0;background:#fff;color:#94a3b8;border-radius:5px;
  width:24px;height:24px;line-height:1;cursor:pointer;font-size:14px;font-family:inherit;}
.imp-x:hover{border-color:#f87171;color:#dc2626;}
.imp-btn{background:#2b6fe0;color:#fff;border:none;border-radius:8px;padding:9px 18px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.imp-btn:disabled{background:#cbd5e1;cursor:default;}
.imp-ys{border:1px solid #cbd5e1;background:#fff;color:#475569;border-radius:5px;padding:3px 9px;
  font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.imp-ys:hover{border-color:#2b6fe0;color:#2b6fe0;}
.imp-ys:disabled{color:#94a3b8;cursor:default;}
.imp-btn.danger{background:#fff;color:#dc2626;border:1px solid #fecaca;font-weight:400;padding:7px 14px;}
.imp-log{margin-top:10px;font-size:12px;line-height:1.9;color:#475569;}
@media (max-width:820px){
  .imp{padding:10px;}
  .imp-name{max-width:120px;font-size:11.5px;}
  .imp-tbl select{max-width:110px;font-size:11.5px;}
}
/* ===== 同期の状態表示（塾ツール共通）===== */
.js-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.js-l{color:#94a3b8;font-size:11.5px;font-weight:700;}
.js-dim{color:#94a3b8;}
.js-ng{color:#b45309;}
.js-st{font-size:12px;line-height:2;color:#475569;background:#f8fafc;border:1px solid #e6ecf3;
  border-radius:8px;padding:8px 10px;}
.js-row input.js-dev{font-size:12px;padding:4px 8px;border:1px solid #cbd5e1;border-radius:6px;
  font-family:inherit;color:#334155;background:#fff;}
.js-row button.js-peek{font-size:12px;padding:5px 11px;border:1px solid #c8d3de;background:#fff;
  border-radius:6px;cursor:pointer;color:#3c4d5e;font-family:inherit;}
.js-row button.js-peek:hover{border-color:#2b6fe0;color:#2b6fe0;}
.js-row button.js-peek:disabled{color:#94a3b8;cursor:default;}
</style>
</head>
<body>
<div id="shell">
  <div id="navbar">
    <div id="brand"><span class="bmark">🏫</span><span>塾ツール</span></div>
    <div id="navtabs">
      <button class="navtab" data-k="koma">コマ組<span class="ld">コマ割り</span></button>
      <button class="navtab" data-k="grade">成績<span class="ld">成績推移</span></button>
      <button class="navtab" data-k="survey">アンケート<span class="ld">満足度</span></button>
      <button class="navtab" data-k="ys">YSボード<span class="ld">友人紹介</span></button>
      <button class="navtab" data-k="ss">SS<span class="ld">成績進捗</span></button>
      <button class="navtab" data-k="shinro">進路<span class="ld">私立・公立</span></button>
      <button class="navtab" data-k="import">取込<span class="ld">ファイル</span></button>
    </div>
    <div id="navright">
      <span id="hint">タブを切り替えても各ツールの状態は保持されます</span>
      <button id="btnReload" title="今開いているタブを読み込み直す">再読込</button>
      <button id="btnOpen" title="このタブを別ウィンドウで開く">別窓</button>
    </div>
  </div>
  <div id="panes"></div>
</div>

<script>
"use strict";
/* 各ツールは実ファイルをiframeで読み込む。
   HTML/CSS/JSに一切手を加えないので使い心地はそのまま。
   file:// の同一オリジンなので localStorage も従来どおり共有される
   （コマ組ツールが成績・アンケート・YSのデータを参照する仕組みもそのまま動く）。 */
const TOOLS=[
  {k:'koma',   label:'コマ組',     src:'komawari.html'},
  {k:'grade',  label:'成績',       src:'grade-tracker.html'},
  {k:'survey', label:'アンケート', src:'survey-app.html'},
  {k:'ys',     label:'YSボード',   src:'ys-board-sync.html'},
  {k:'ss',     label:'SS',         src:'ss-tracker.html'},
  {k:'shinro', label:'進路',       src:'shinro.html'},
  /* 取込センターだけは中身をここに直接書く（iframeではない） */
  {k:'import', label:'取込',       local:true}
];
const LSTAB='jukutool_tab_v1';
const panes=document.getElementById('panes');
const loaded={};
let cur=null;

// ペインの器を先に作る（iframeは初回表示時にだけ生成＝起動を軽くする）
TOOLS.forEach(t=>{
  const d=document.createElement('div');
  d.className='pane';d.id='pane-'+t.k;
  if(!t.local) d.innerHTML='<div class="ph"><div class="sp"></div><div class="msg">'+t.label+'を読み込んでいます…</div></div>';
  panes.appendChild(d);
});

function show(k){
  const t=TOOLS.find(x=>x.k===k); if(!t)return;
  cur=k;
  try{localStorage.setItem(LSTAB,k);}catch(e){}
  document.querySelectorAll('.navtab').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  // 選んだタブが画面外なら横スクロールして見えるようにする（スマホで端のタブが隠れるため）
  const at=document.querySelector(".navtab[data-k='"+k+"']");
  if(at&&at.scrollIntoView)try{at.scrollIntoView({inline:"nearest",block:"nearest"});}catch(e){}
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+k));
  if(!loaded[k]){
    if(t.local){ loaded[k]=true; mountImport(document.getElementById('pane-'+k)); }
    else mount(t);
  }
}
function mount(t){
  loaded[t.k]=true;
  const pane=document.getElementById('pane-'+t.k);
  const fr=document.createElement('iframe');
  fr.src=t.src;
  fr.setAttribute('title',t.label);
  let ok=false;
  fr.addEventListener('load',()=>{ok=true;
    // 読み込めたらプレースホルダを消す
    [...pane.querySelectorAll('.ph,.errbox')].forEach(e=>e.remove());
  });
  // 一定時間たっても load しなければファイルが無い可能性を案内
  setTimeout(()=>{ if(ok)return;
    pane.innerHTML=`<div class="errbox"><b>${t.label}のファイルを開けませんでした。</b><br>
      このファイルと同じ場所に <code>${t.src}</code> が必要です。<br>
      「塾ツール.html」は各ツールを読み込むための入口なので、<b>フォルダごと</b>移動・コピーしてください。<br>
      <br>個別に開きたい場合は、そのファイルを直接ダブルクリックしても今まで通り使えます。</div>`;
  },8000);
  pane.appendChild(fr);
}
document.querySelectorAll('.navtab').forEach(b=>b.onclick=()=>show(b.dataset.k));
document.getElementById('btnReload').onclick=()=>{
  const pane=document.getElementById('pane-'+cur);
  const fr=pane.querySelector('iframe');
  if(fr) fr.contentWindow.location.reload();
  else if(cur==='import') mountImport(pane);      /* 取込タブは作り直す */
};
document.getElementById('btnOpen').onclick=()=>{
  const t=TOOLS.find(x=>x.k===cur); if(t&&t.src)window.open(t.src,'_blank');
};
/* ===== 学期の共通部品（塾ツール共通・6ツールに同じものを入れる）=====
   「今このツールはいつの名簿で動いているか」を持って、画面に出す。

   1年の流れ（聞き取り）:
     コマ組は先を組む。7月に2学期、12月に3学期、3月には次年度1学期のコマを組む。
     アンケートは6〜10月に1学期の結果を見て、11〜1月は2学期、2〜3月は3学期。
     成績はテスト①②＝1学期、③④＝2学期、⑤＝3学期の担当とセット。
   なので「今の学期」は1つに決まらない。ツールごとに別々に持つ。         */
var JUKU_TERM = (function(){
  var MARK='juku_roster_mark_v1';        /* {koma:'2026年度2学期', grade:…, survey:…} */

  function get(){ try{ return JSON.parse(localStorage.getItem(MARK)||'{}')||{}; }catch(e){ return {}; } }
  function put(o){ try{ localStorage.setItem(MARK, JSON.stringify(o)); }catch(e){} }

  /* 年度は4月始まり */
  function nendo(d){ return (d.getMonth()+1) >= 4 ? d.getFullYear() : d.getFullYear()-1; }

  /* そのツールが「その月に使うべき学期」。上の表のとおり。 */
  function want(tool, d){
    d = d || new Date();
    var m = d.getMonth()+1, y = nendo(d);
    if(tool==='koma'){                                    /* コマ組は先を組む */
      if(m>=4 && m<=6)  return y+'年度1学期';
      if(m>=7 && m<=11) return y+'年度2学期';
      if(m===12||m===1||m===2) return y+'年度3学期';
      return (y+1)+'年度1学期';                            /* 3月は次年度1学期 */
    }
    if(tool==='survey'){                                  /* 集計は6月・11月・2月 */
      if(m>=4 && m<=10) return y+'年度1学期';
      if(m>=11 || m===1) return y+'年度2学期';
      return y+'年度3学期';                                /* 2〜3月 */
    }
    /* 成績ほか。テスト回が分かるときは termOfKai() が優先 */
    if(m>=4 && m<=7)  return y+'年度1学期';
    if(m>=8 && m<=12) return y+'年度2学期';
    return y+'年度3学期';
  }

  /* テスト回 → 学期。①②＝1学期、③④＝2学期、⑤＝3学期 */
  function termOfKai(year, kai){
    var n = +kai || 0;
    var g = n<=2 ? 1 : (n<=4 ? 2 : 3);
    return year+'年度'+g+'学期';
  }

  /* 講習は通常とは別軸。社内ツール上で開いている期間で決まる。
     4月2週〜8月＝夏期 / 9月〜1月1週＝冬期 / 1月2週〜4月1週＝春期 */
  function kousyu(d){
    d = d || new Date();
    var m = d.getMonth()+1, day = d.getDate();
    if((m===1 && day>=8) || m===2 || m===3 || (m===4 && day<=7)){
      /* 春期は1〜4月にまたがるが、どれも同じ年度の終わりぶん */
      return (d.getFullYear()-1)+'年度春期';
    }
    if((m===4 && day>=8) || (m>=5 && m<=8)) return nendo(d)+'年度夏期';
    return nendo(d)+'年度冬期';                            /* 9月〜1月1週 */
  }

  /* 選べる学期の一覧（前年度3学期 〜 次年度1学期） */
  function list(d){
    var y = nendo(d||new Date());
    return [(y-1)+'年度3学期', y+'年度1学期', y+'年度2学期', y+'年度3学期', (y+1)+'年度1学期'];
  }

  function mark(tool){ return get()[tool] || ''; }
  function setMark(tool, term){ var o=get(); if(term) o[tool]=term; else delete o[tool]; put(o); }

  /* ヘッダに出す小さな表示。id の要素の中身を作る。
     何も記録が無ければ「未設定」、今の月とずれていれば ⚠ を付ける。 */
  function paint(elId, tool){
    var el = document.getElementById(elId); if(!el) return;
    var cur = mark(tool), w = want(tool);
    var opts = list();
    if(cur && opts.indexOf(cur)<0) opts = [cur].concat(opts);
    var h = '<span class="jt-l">名簿</span>' +
      '<select class="jt-s" title="このツールが今どの学期の名簿で動いているか">' +
      '<option value="">未設定</option>' +
      opts.map(function(t){
        return '<option value="'+t+'"'+(t===cur?' selected':'')+'>'+t+'</option>';
      }).join('') + '</select>';
    if(!cur) h += '<span class="jt-w" title="今の月ならこの学期です">今は '+w+'</span>';
    else if(cur!==w) h += '<span class="jt-w jt-ng" title="今の月に合っていません">⚠ 今は '+w+'</span>';
    el.innerHTML = h;
    var sel = el.querySelector('.jt-s');
    sel.onchange = function(){ setMark(tool, sel.value); paint(elId, tool); };
  }

  return { want:want, kousyu:kousyu, termOfKai:termOfKai, list:list,
           mark:mark, setMark:setMark, paint:paint, nendo:nendo };
})();

/* ===== 名簿の棚（塾ツール共通・6ツールに同じものを入れる）=====
   生徒CSVと先生CSVを「学期ごと」にしまっておく場所。取込センターが書き、各ツールが読む。
   同じオリジンの localStorage なので、iframe をまたいでも共有される。

   しまうのは**デコード済みのテキストそのもの**。各ツールのパーサはそれぞれ癖があるので、
   ここでは解釈せず、生のまま渡す。（PDFやxlsxは大きすぎるので棚には置かない） */
var JUKU_ROSTER = (function(){
  var SHELF='juku_roster_v1';        /* {学期:{student:{file,at,text}, teacher:{…}, kousyu:'2026年度夏期'}} */
  var SEEN ='juku_roster_seen_v1';   /* {tool:{term, at}} どこまで取り込み済みか */

  function rd(k){ try{ return JSON.parse(localStorage.getItem(k)||'{}')||{}; }catch(e){ return {}; } }
  function wr(k,o){ try{ localStorage.setItem(k, JSON.stringify(o)); return true; }catch(e){ return false; } }

  function all(){ return rd(SHELF); }
  function terms(){ return Object.keys(all()).sort(); }
  function entry(term, kind){ var t=all()[term]; return (t && t[kind]) ? t[kind] : null; }

  function put(term, kind, file, text, kousyu){
    var o=rd(SHELF);
    if(!o[term]) o[term]={};
    o[term][kind]={ file:file||'', at:Date.now(), text:String(text||'') };
    if(kousyu) o[term].kousyu=kousyu;
    return wr(SHELF,o);
  }
  function drop(term){ var o=rd(SHELF); delete o[term]; wr(SHELF,o); }
  function clearAll(){
    try{ localStorage.removeItem(SHELF); localStorage.removeItem(SEEN); }catch(e){}
  }
  function sizeKB(){
    try{ return Math.round((localStorage.getItem(SHELF)||'').length/1024); }catch(e){ return 0; }
  }

  /* どこまで取り込んだかの印。生徒と先生で別々に持つ（片方だけ更新されることがある） */
  function sk(tool, kind){ return tool+':'+kind; }
  function seen(tool, kind){ return rd(SEEN)[sk(tool,kind)] || null; }
  function markSeen(tool, kind, term, at){
    var o=rd(SEEN); o[sk(tool,kind)]={term:term, at:at}; wr(SEEN,o);
  }

  /* 棚に「まだ取り込んでいない新しいもの」があるか */
  function pending(tool, kind, term){
    term = term || (typeof JUKU_TERM!=='undefined' ? JUKU_TERM.mark(tool) : '');
    if(!term) return null;
    var e = entry(term, kind);
    if(!e || !e.text) return null;
    var s = seen(tool, kind);
    if(s && s.term===term && s.at===e.at) return null;    /* もう取り込んである */
    return e;
  }

  /* 棚から読んで、まだ取り込んでいなければ apply(text, info) を呼ぶ。
     term を省くと、そのツールが今見ている学期（JUKU_TERM.mark）を使う。
     戻り値: 取り込んだら info、何もしなければ null */
  function pull(tool, kind, apply, term){
    term = term || (typeof JUKU_TERM!=='undefined' ? JUKU_TERM.mark(tool) : '');
    var e = pending(tool, kind, term);
    if(!e) return null;
    try{ apply(e.text, e); }catch(err){ return null; }
    markSeen(tool, kind, term, e.at);
    return e;
  }
  /* 学期を変えたときなど、取り込み済みの印を消してもう一度読ませる */
  function forget(tool){
    var o=rd(SEEN);
    Object.keys(o).forEach(function(k){ if(k.indexOf(tool+':')===0) delete o[k]; });
    wr(SEEN,o);
  }

  return { all:all, terms:terms, entry:entry, put:put, drop:drop, clearAll:clearAll,
           sizeKB:sizeKB, pull:pull, pending:pending, forget:forget, seen:seen, markSeen:markSeen };
})();

/* ===== 取込センター =====
   ファイルを置くと、種類と行き先を見分けて一覧にする。確認してから取り込む。

   ・生徒名簿・先生名簿は「棚」（juku_roster_v1）に学期ごとにしまう。
     各ツールは自分の学期に合わせて棚から読む。
   ・それ以外（PDF・xlsx・成績CSV・アンケート回答）は大きいので棚には置かず、
     担当ツールのiframeに直接ファイルを渡して、いつもどおり解析させる。 */

const KINDS = {
  student: { label:'生徒名簿CSV',   to:'棚（コマ組・成績・アンケート）', shelf:true  },
  teacher: { label:'先生名簿CSV',   to:'棚（コマ組・アンケート）',       shelf:true  },
  grade:   { label:'成績CSV',       to:'成績',   tool:'grade',  fn:'grade'   },
  survey:  { label:'アンケート回答', to:'アンケート', tool:'survey', fn:'survey' },
  elem:    { label:'小学生アンケート', to:'アンケート', tool:'survey', fn:'elem' },
  ss:      { label:'SSの成績進捗',   to:'SS',     tool:'ss',     fn:'ss'      },
  kouken:  { label:'貢献シート',     to:'SS',     tool:'ss',     fn:'kouken'  },
  dashin:  { label:'私立の打診値',   to:'進路',   tool:'shinro', fn:'dashin'  },
  koritsu: { label:'公立の合格判定', to:'進路',   tool:'shinro', fn:'koritsu' },
  ys:      { label:'YS名前聞きリスト', to:'YSボード', tool:'ys', fn:'ys' }
};

/* ファイル名と中身の先頭から種類を当てる。当たらなければ手で選んでもらう。 */
function detectKind(name, head){
  const n = String(name||'');
  if(/^student.*\.csv$/i.test(n)) return 'student';
  if(/^teacher.*\.csv$/i.test(n)) return 'teacher';
  if(/成績進捗.*\.xlsx?$/i.test(n)) return 'ss';
  if(/貢献/.test(n) && /\.pdf$/i.test(n)) return 'kouken';
  if(/打診値/.test(n) && /\.pdf$/i.test(n)) return 'dashin';
  if(/公立.*(合格判定|判定)/.test(n) && /\.xlsx?$/i.test(n)) return 'koritsu';
  /* 中身の見出しで判断（社内システムの出力は見出しが決まっている） */
  const h = String(head||'').slice(0,400);
  if(/Ｎｏ|^No,/.test(h) && /姓/.test(h) && /学年/.test(h) && /科目/.test(h)) return 'student';
  if(/先生番号/.test(h) && /姓名/.test(h)) return 'teacher';
  if(/先生コード/.test(h)) return 'survey';
  if(/YS名前聞いた日|紹介者/.test(h)) return 'ys';
  return '';
}
/* 学期を推測する。ファイル名の日付が使えればそれ、無ければ今日。 */
function guessTerm(name, kind){
  const m = String(name||'').match(/(20\d\d)[-_./]?(\d{2})[-_./]?(\d{2})/);
  const d = m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date();
  return JUKU_TERM.want(kind==='survey' ? 'survey' : 'koma', d);
}
function guessKousyu(name){
  const m = String(name||'').match(/(20\d\d)[-_./]?(\d{2})[-_./]?(\d{2})/);
  return JUKU_TERM.kousyu(m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date());
}

let QUEUE = [];   /* [{file, name, kind, term, head}] */

async function headOf(file){
  if(!/\.(csv|txt)$/i.test(file.name)) return '';
  try{
    const buf = await file.slice(0, 3000).arrayBuffer();
    const u8 = new Uint8Array(buf);
    const utf8 = new TextDecoder('utf-8').decode(u8);
    if((utf8.match(/�/g)||[]).length === 0) return utf8;
    try{ return new TextDecoder('shift_jis').decode(u8); }catch(e){ return utf8; }
  }catch(e){ return ''; }
}
/* 棚に入れるときは、文字コードを1回だけ判定してテキストにしてしまう */
async function readText(file){
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf);
  const utf8 = new TextDecoder('utf-8').decode(u8);
  const bad = (utf8.match(/�/g)||[]).length;
  if(bad === 0) return utf8;
  try{
    const sjis = new TextDecoder('shift_jis').decode(u8);
    if(((sjis.match(/�/g)||[]).length) <= bad) return sjis;
  }catch(e){}
  return utf8;
}

async function addFiles(files){
  for(const f of files){
    const head = await headOf(f);
    const kind = detectKind(f.name, head);
    QUEUE.push({ file:f, name:f.name, kind, term:guessTerm(f.name, kind) });
  }
  drawQueue();
}

function drawQueue(){
  const box = document.getElementById('impQueue');
  if(!QUEUE.length){ box.innerHTML='<div class="imp-empty">ここにファイルを置くと、種類と行き先を見分けて一覧にします。</div>'; return; }
  let h = '<table class="imp-tbl"><thead><tr><th>ファイル</th><th>種類</th><th>行き先</th><th>学期</th><th></th></tr></thead><tbody>';
  QUEUE.forEach((q,i)=>{
    const k = KINDS[q.kind];
    const opts = Object.keys(KINDS).map(kk=>
      '<option value="'+kk+'"'+(kk===q.kind?' selected':'')+'>'+KINDS[kk].label+'</option>').join('');
    const terms = JUKU_TERM.list().map(t=>
      '<option value="'+t+'"'+(t===q.term?' selected':'')+'>'+t+'</option>').join('');
    h += '<tr'+(k?'':' class="imp-unknown"')+'>'+
      '<td class="imp-name">'+esc(q.name)+'</td>'+
      '<td><select data-i="'+i+'" class="imp-kind"><option value="">— 選んでください —</option>'+opts+'</select></td>'+
      '<td class="imp-to">'+(k? esc(k.to) : '<span class="imp-ng">種類が分かりません</span>')+'</td>'+
      '<td>'+(k&&k.shelf? '<select data-i="'+i+'" class="imp-term">'+terms+'</select>' : '<span class="imp-dim">—</span>')+'</td>'+
      '<td><button class="imp-x" data-i="'+i+'" title="この行をやめる">×</button></td></tr>';
  });
  h += '</tbody></table>';
  box.innerHTML = h;
  box.querySelectorAll('.imp-kind').forEach(s=>s.onchange=()=>{
    QUEUE[+s.dataset.i].kind = s.value; drawQueue(); });
  box.querySelectorAll('.imp-term').forEach(s=>s.onchange=()=>{
    QUEUE[+s.dataset.i].term = s.value; });
  box.querySelectorAll('.imp-x').forEach(b=>b.onclick=()=>{
    QUEUE.splice(+b.dataset.i,1); drawQueue(); });
  document.getElementById('impRun').disabled = !QUEUE.some(q=>KINDS[q.kind]);
}

/* 行き先ツールのiframeを用意して、窓口が使えるようになるまで待つ */
function toolWindow(k){
  return new Promise((resolve,reject)=>{
    const t = TOOLS.find(x=>x.k===k);
    if(!t) return reject(new Error(k+' というツールがありません'));
    if(!loaded[k]) mount(t);
    const pane = document.getElementById('pane-'+k);
    const started = Date.now();
    (function wait(){
      const fr = pane.querySelector('iframe');
      let w = null;
      try{ w = fr && fr.contentWindow; }catch(e){ w = null; }
      if(w && w.JUKU_IMPORT) return resolve(w);
      if(Date.now()-started > 20000) return reject(new Error(t.label+'の準備ができませんでした'));
      setTimeout(wait, 200);
    })();
  });
}

async function runImport(){
  const log = document.getElementById('impLog');
  const btn = document.getElementById('impRun');
  btn.disabled = true;
  const lines = [];
  let shelved = false;
  const say = (s)=>{ lines.push(s); log.innerHTML = lines.join('<br>'); };

  for(const q of QUEUE){
    const k = KINDS[q.kind];
    if(!k){ say('⏭ '+esc(q.name)+'：種類が分からないので飛ばしました'); continue; }
    try{
      if(k.shelf){
        shelved = true;
        const text = await readText(q.file);
        const ok = JUKU_ROSTER.put(q.term, q.kind, q.name, text,
                                   q.kind==='student' ? guessKousyu(q.name) : '');
        if(!ok) throw new Error('端末に保存できませんでした（容量不足の可能性）');
        say('✅ '+esc(q.name)+' → 棚（'+esc(q.term)+'）に入れました');
      }else{
        const w = await toolWindow(k.tool);
        await w.JUKU_IMPORT[k.fn](q.file);
        say('✅ '+esc(q.name)+' → '+esc(k.to)+' に取り込みました');
      }
      markSeenFile(q.name, Date.now());
    }catch(e){
      say('⚠ '+esc(q.name)+'：'+esc(e && e.message ? e.message : String(e)));
    }
  }
  QUEUE = [];
  drawQueue();
  drawShelf();
  drawTools();
  JUKU_SYNC.refresh('impSyncInfo');
  /* 棚に入ったものがあれば、少し待って自動でスプシへ */
  if(shelved) JUKU_SYNC.queueSave('roster', hubSyncSave);
  say('— おわり —　各ツールのタブを開くと反映されます');
}

function drawShelf(){
  const box = document.getElementById('impShelf');
  const all = JUKU_ROSTER.all();
  const terms = Object.keys(all).sort();
  if(!terms.length){ box.innerHTML='<div class="imp-empty">棚はまだ空です。</div>'; return; }
  let h = '<table class="imp-tbl"><thead><tr><th>学期</th><th>生徒名簿</th><th>先生名簿</th><th>講習</th><th></th><th></th></tr></thead><tbody>';
  terms.forEach(t=>{
    const e = all[t];
    const f = (x)=> x ? (esc(x.file||'（名前なし）')+'<span class="imp-dim"> '+new Date(x.at).toLocaleDateString('ja-JP')+'</span>') : '<span class="imp-dim">—</span>';
    h += '<tr><td><b>'+esc(t)+'</b></td><td>'+f(e.student)+'</td><td>'+f(e.teacher)+'</td>'+
         '<td class="imp-dim">'+esc(e.kousyu||'—')+'</td>'+
         '<td>'+(e.teacher? '<button class="imp-ys" data-t="'+esc(t)+'" title="この学期の先生名簿をYSボードに送る（新しい先生だけ足されます）">YSへ送る</button>' : '')+'</td>'+
         '<td><button class="imp-x" data-t="'+esc(t)+'" title="この学期を棚から消す">×</button></td></tr>';
  });
  h += '</tbody></table><div class="imp-dim" style="margin-top:6px;">棚の大きさ '+JUKU_ROSTER.sizeKB()+'KB</div>';
  box.innerHTML = h;
  box.querySelectorAll('.imp-x').forEach(b=>b.onclick=()=>{
    if(!confirm(b.dataset.t+' を棚から消します。よろしいですか？')) return;
    JUKU_ROSTER.drop(b.dataset.t); drawShelf();
  });
  box.querySelectorAll('.imp-ys').forEach(b=>b.onclick=async ()=>{
    const t=b.dataset.t, e=JUKU_ROSTER.entry(t,'teacher');
    if(!e) return;
    b.disabled=true; b.textContent='送信中…';
    try{
      const w=await toolWindow('ys');
      await w.JUKU_IMPORT.ysTeacher(new File([e.text], e.file||'teacher.csv', {type:'text/csv'}));
      b.textContent='送りました';
      setTimeout(()=>drawShelf(), 2500);
    }catch(err){
      b.disabled=false; b.textContent='YSへ送る';
      alert('YSボードに送れませんでした: '+(err&&err.message?err.message:err));
    }
  });
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===== フォルダ監視 =====
   社内システムのリンクからは自動でファイルを取れないので、
   「いつも通りダウンロードする」ところまでは人がやり、そこから先を自動にする。
   SSツールで動いている仕組みをそのまま持ってきて、行き先を増やしたもの。

   ・一度フォルダを許可すれば、取込タブを開くだけで未取込のファイルを拾う
   ・**名簿以外は、そのまま取り込む**（毎日のSSやYSを1手も掛けずに入れるため）
   ・**名簿は取り込まず、確認の一覧に残す**（どの学期のぶんかを人が決める必要があるため） */
var IDB_NAME='juku_import', IDB_STORE='kv';
function idb(){
  return new Promise(function(res,rej){
    var r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=function(){ r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=function(){ res(r.result); };
    r.onerror=function(){ rej(r.error); };
  });
}
async function idbSet(k,v){
  var db=await idb();
  return new Promise(function(res,rej){
    var tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(v,k);
    tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);};
  });
}
async function idbGet(k){
  var db=await idb();
  return new Promise(function(res,rej){
    var tx=db.transaction(IDB_STORE,'readonly');
    var q=tx.objectStore(IDB_STORE).get(k);
    q.onsuccess=function(){res(q.result);}; q.onerror=function(){rej(q.error);};
  });
}
function fsSupported(){ return typeof window.showDirectoryPicker==='function'; }

const SEEN_KEY='juku_seen_files_v1';
function seenFiles(){ try{ return JSON.parse(localStorage.getItem(SEEN_KEY)||'{}')||{}; }catch(e){ return {}; } }
function markSeenFile(name, at){
  var o=seenFiles(); o[name]=at||1;
  try{ localStorage.setItem(SEEN_KEY, JSON.stringify(o)); }catch(e){}
}

function watchMsg(t, ng){
  var el=document.getElementById('impWatchMsg'); if(!el) return;
  el.textContent=t||''; el.className='imp-log'+(ng?' imp-ng':'');
}

async function pickWatchDir(){
  if(!fsSupported()){
    watchMsg('この開き方ではフォルダ監視が使えません。START-TOOL.bat（localhost）か公開版のURLから、ChromeかEdgeで開いてください。', true);
    return;
  }
  try{
    var h=await window.showDirectoryPicker({ id:'jukudl', mode:'read' });
    await idbSet('dir', h);
    watchMsg('フォルダを登録しました。未取込のファイルを見にいきます…');
    await scanWatchDir(true);
    drawWatch();
  }catch(e){
    if(e && e.name==='AbortError') return;
    watchMsg('登録できませんでした: '+(e&&e.message?e.message:e), true);
  }
}
async function forgetWatchDir(){
  await idbSet('dir', null);
  watchMsg('フォルダの登録を解除しました。');
  drawWatch();
}

async function scanWatchDir(verbose){
  if(!fsSupported()){ if(verbose) watchMsg('この開き方では使えません。', true); return; }
  var h=null;
  try{ h=await idbGet('dir'); }catch(e){ h=null; }
  if(!h){ if(verbose) watchMsg('まだフォルダが登録されていません。', true); return; }

  var perm=await h.queryPermission({ mode:'read' });
  if(perm!=='granted'){
    if(!verbose){ watchMsg('フォルダの読み取り許可が切れています。「今すぐ見にいく」を押して許可してください。', true); return; }
    perm=await h.requestPermission({ mode:'read' });
    if(perm!=='granted'){ watchMsg('許可されませんでした。', true); return; }
  }

  var seen=seenFiles(), picks=[];
  for await (var ent of h.values()){
    if(ent.kind!=='file') continue;
    if(!/\.(csv|xlsx?|pdf)$/i.test(ent.name)) continue;
    if(seen[ent.name]) continue;
    picks.push(ent);
  }
  if(!picks.length){ if(verbose) watchMsg('新しいファイルはありませんでした。'); return; }

  /* 種類を見分けて、名簿以外はそのまま取り込む */
  var auto=[], wait=[];
  for(var i=0;i<picks.length;i++){
    var f=await picks[i].getFile();
    var head=await headOf(f);
    var kind=detectKind(f.name, head);
    var k=KINDS[kind];
    if(k && !k.shelf) auto.push({file:f, name:f.name, kind:kind});
    else if(k) wait.push({file:f, name:f.name, kind:kind, term:guessTerm(f.name, kind)});
    /* 種類が分からないものは触らない（毎日フォルダに増える無関係なファイルを拾わないため） */
  }

  var done=0, ngs=[];
  for(const q of auto){
    const k=KINDS[q.kind];
    try{
      const w=await toolWindow(k.tool);
      await w.JUKU_IMPORT[k.fn](q.file);
      markSeenFile(q.name, Date.now());
      done++;
    }catch(e){ ngs.push(q.name+'（'+(e&&e.message?e.message:e)+'）'); }
  }
  wait.forEach(q=>QUEUE.push(q));
  drawQueue();

  var msg=[];
  if(done) msg.push('新しく '+done+'件 取り込みました');
  if(wait.length) msg.push('名簿 '+wait.length+'件は、学期を確かめてから取り込みます（上の一覧）');
  if(ngs.length) msg.push('読めなかったもの: '+ngs.join('、'));
  if(!msg.length) msg.push('新しく取り込めるファイルはありませんでした');
  watchMsg(msg.join('／'), ngs.length>0);
}

async function drawWatch(){
  var box=document.getElementById('impWatch'); if(!box) return;
  var has=false;
  try{ has=!!(await idbGet('dir')); }catch(e){}
  var n=Object.keys(seenFiles()).length;
  box.innerHTML =
    '<div class="imp-dim" style="margin-bottom:8px;line-height:1.8;">'+
      'ダウンロード先のフォルダを一度だけ許可しておくと、<b>この取込タブを開くだけ</b>で新しいファイルを拾います。<br>'+
      'SSの成績進捗やYSの名前聞きリストなど<b>毎日のぶんはそのまま取り込み</b>、'+
      '<b>名簿は学期を確かめてから</b>にします。'+
    '</div>'+
    '<button class="imp-btn" id="impPick">'+(has?'フォルダを選び直す':'フォルダを登録する')+'</button> '+
    '<button class="imp-btn" id="impScan" style="background:#64748b;">今すぐ見にいく</button> '+
    (has?'<button class="imp-btn danger" id="impForget">登録を解除</button>':'')+
    '<span class="imp-dim"> 取り込み済み '+n+'件</span>'+
    '<div id="impWatchMsg" class="imp-log"></div>';
  var p=document.getElementById('impPick'); if(p) p.onclick=pickWatchDir;
  var s=document.getElementById('impScan'); if(s) s.onclick=()=>scanWatchDir(true);
  var g=document.getElementById('impForget'); if(g) g.onclick=forgetWatchDir;
}

/* ===== 同期の「いつ・どの端末で保存したか」（塾ツール共通）=====
   今の同期は「まるごと置き換え」なので、どっちが新しいかを人が知っている必要がある。
   ・端末に名前を付ける（このPC／スマホ など）
   ・保存するデータに「いつ・どの端末で」を1行だけ入れる
   ・スプシ側の最終保存時刻（Code.gs が返す updatedAt）と見比べて出す
   Code.gs には手を入れないので、Apps Script を入れ直す必要はない。 */
var JUKU_SYNC = (function(){
  var DEV='juku_device_v1';          /* 端末の名前（全ツール共通） */
  var LAST='juku_sync_last_v1';      /* {tool: {at, by}} この端末が最後に保存した時刻 */

  function rd(k,d){ try{ return JSON.parse(localStorage.getItem(k)||'null') || d; }catch(e){ return d; } }
  function wr(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  function deviceName(){
    var n = rd(DEV,'');
    if(n) return n;
    /* 初回はそれらしい名前を当てておく（設定で直せる） */
    var ua = navigator.userAgent||'';
    var guess = /iPhone|Android|iPad/i.test(ua) ? 'スマホ' : 'パソコン';
    wr(DEV, guess);
    return guess;
  }
  function setDeviceName(n){ wr(DEV, String(n||'').trim() || 'この端末'); }

  /* 保存するデータに1行だけ足す。中身は触らない。 */
  function stamp(payload){
    payload = payload || {};
    payload._meta = { savedAt: new Date().toISOString(), savedBy: deviceName() };
    return payload;
  }
  /* 保存できたら、この端末の記録に残す */
  function noteSaved(tool){
    var o = rd(LAST,{}); o[tool] = { at:new Date().toISOString(), by:deviceName() }; wr(LAST,o);
  }
  function lastSaved(tool){ return (rd(LAST,{})||{})[tool] || null; }

  function fmt(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d)) return String(iso);
    var p=function(n){ return (n<10?'0':'')+n; };
    return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  /* スプシの今の状態を見にいく。中身は読み捨てて、いつ・誰が保存したかだけ返す。 */
  async function peek(url, key, tool){
    var res = await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ key:key, tool:tool, action:'load' }) });
    var d = await res.json();
    if(!d.ok) throw new Error(d.error||'不明なエラー');
    var by='';
    try{ by = (JSON.parse(d.data||'{}')._meta||{}).savedBy || ''; }catch(e){}
    return { updatedAt: d.updatedAt||'', savedBy: by, bytes: (d.data||'').length };
  }

  /* 画面に出す1行。remote は peek() の結果（null なら未確認）。 */
  function statusHtml(tool, remote){
    var mine = lastSaved(tool);
    var out = [];
    out.push('<span class="js-l">この端末が最後に保存</span> '+(mine? fmt(mine.at) : '<span class="js-dim">まだ保存していません</span>'));
    if(remote){
      var newer = remote.updatedAt && (!mine || new Date(remote.updatedAt) > new Date(mine.at));
      var other = remote.savedBy && remote.savedBy!==deviceName();
      out.push('<span class="js-l">スプシの最終保存</span> '+
        (remote.updatedAt? fmt(remote.updatedAt) : '（まだ何も入っていません）')+
        (remote.savedBy? '（'+esc0(remote.savedBy)+'）' : '')+
        (newer? ' <b class="js-ng">'+(other?'この端末より新しいです':'この端末で保存した最新です')+'</b>' : ''));
    }
    return out.join('<br>');
  }
  function esc0(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* 端末名の入力欄＋状態表示をまとめて作る。
     el: 置き場所のid / tool: 'grade' など / getCfg: ()=>({url,key}) */
  function mount(elId, tool, getCfg){
    var box=document.getElementById(elId); if(!box) return;
    function draw(remote){
      box.innerHTML =
        '<div class="js-row"><span class="js-l">この端末の名前</span>'+
          '<input type="text" class="js-dev" value="'+esc0(deviceName())+'" style="width:120px;">'+
          '<button type="button" class="js-peek">スプシの状態を見る</button></div>'+
        '<div class="js-st">'+statusHtml(tool, remote)+'</div>';
      var inp=box.querySelector('.js-dev');
      inp.onchange=function(){ setDeviceName(inp.value); draw(remote); };
      box.querySelector('.js-peek').onclick=async function(){
        var b=this; var cfg=getCfg()||{};
        if(!cfg.url||!cfg.key){ box.querySelector('.js-st').innerHTML='<span class="js-ng">接続先URLと合言葉を先に入れてください</span>'; return; }
        b.disabled=true; b.textContent='見にいっています…';
        try{ draw(await peek(cfg.url, cfg.key, tool)); }
        catch(e){ box.querySelector('.js-st').innerHTML='<span class="js-ng">見にいけませんでした: '+esc0(e&&e.message?e.message:e)+'</span>'; b.disabled=false; b.textContent='スプシの状態を見る'; }
      };
    }
    draw(null);
    box.__redraw = draw;
  }
  function refresh(elId){ var b=document.getElementById(elId); if(b&&b.__redraw) b.__redraw(null); }

  return { deviceName:deviceName, setDeviceName:setDeviceName, stamp:stamp,
           noteSaved:noteSaved, lastSaved:lastSaved, peek:peek, fmt:fmt,
           statusHtml:statusHtml, mount:mount, refresh:refresh };
})();

/* ===== 棚の同期 =====
   PCで取り込んだ名簿をスマホでも使えるようにする。
   棚は丸ごと「取り込んだもの」なので、手で入れたものと混ざらない。
   そのため各ツールの同期には混ぜず、**専用の入れ物（tool:'roster'）**として送る。
   （各ツールに混ぜると同じ270KBを何度も送ることになる） */
/* ===== 自動で保存・読込（塾ツール共通）=====
   ③で「読込は手入力を上書きしない（混ぜる）」ようにしたので、自動にしても消えない。

   ・開いたとき：スプシのほうが新しければ、自動で読み込む（混ぜるので消えない）
   ・変わったとき：少し待ってからまとめて保存する（打つたびに送らない）
   ・切りたい人のために、入／切のスイッチを付ける（既定は入） */
(function(){
  var AUTO='juku_auto_sync_v1';       /* {tool: true/false} */
  function rd(){ try{ return JSON.parse(localStorage.getItem(AUTO)||'{}')||{}; }catch(e){ return {}; } }

  JUKU_SYNC.autoOn = function(tool){ var v=rd()[tool]; return v===undefined ? true : !!v; };
  JUKU_SYNC.setAuto = function(tool, on){
    var o=rd(); o[tool]=!!on;
    try{ localStorage.setItem(AUTO, JSON.stringify(o)); }catch(e){}
  };

  /* まとめて保存。呼ばれ続けても、静かになってから1回だけ送る。 */
  var timers={}, busy={};
  JUKU_SYNC.queueSave = function(tool, doSave, wait){
    if(!JUKU_SYNC.autoOn(tool)) return;
    clearTimeout(timers[tool]);
    timers[tool]=setTimeout(async function(){
      if(busy[tool]) { JUKU_SYNC.queueSave(tool, doSave, wait); return; }   /* 送信中なら後回し */
      busy[tool]=true;
      try{ await doSave({auto:true}); }catch(e){}
      busy[tool]=false;
    }, wait||4000);
  };

  /* 開いたときに1回だけ。スプシのほうが新しいときだけ読み込む。 */
  JUKU_SYNC.autoLoad = async function(tool, cfg, doLoad, say){
    if(!JUKU_SYNC.autoOn(tool)) return;
    if(!cfg || !cfg.url || !cfg.key) return;
    try{
      var st = await JUKU_SYNC.peek(cfg.url, cfg.key, tool);
      if(!st.updatedAt) return;
      var mine = JUKU_SYNC.lastSaved(tool);
      var newer = !mine || new Date(st.updatedAt) > new Date(mine.at);
      if(!newer) return;                       /* こちらが最新なら何もしない */
      if(say) say('スプシのほうが新しいので読み込みます（'+(st.savedBy||'別の端末')+'が'+JUKU_SYNC.fmt(st.updatedAt)+'に保存）');
      await doLoad({auto:true});
    }catch(e){ /* つながらないときは黙って何もしない（オフラインでも使えるように） */ }
  };
})();

const HUBSYNC='juku_sync_cfg_v1';

/* 接続先は各ツールで既に入れてあるものを流用する（入れ直さなくて済むように） */
function hubSyncCfg(){
  let c = null;
  try{ c = JSON.parse(localStorage.getItem(HUBSYNC)||'null'); }catch(e){}
  if(c && c.url && c.key) return c;
  const tries = [
    ()=>{ const o=JSON.parse(localStorage.getItem('gradeTracker_syncConfig_v1')||'null'); return o&&{url:o.url,key:o.key}; },
    ()=>({ url:JSON.parse(localStorage.getItem('survey_syncUrl')||'""'), key:JSON.parse(localStorage.getItem('survey_syncKey')||'""') }),
    ()=>{ const o=JSON.parse(localStorage.getItem('shinro_sync_v1')||'null'); return o&&{url:o.url,key:o.key}; },
    ()=>{ const o=JSON.parse(localStorage.getItem('komawari_syncCfg_v1')||'null'); return o&&{url:o.url,key:o.key}; }
  ];
  for(const f of tries){
    try{ const o=f(); if(o && o.url && o.key) return o; }catch(e){}
  }
  return { url:'', key:'' };
}
function saveHubSyncCfg(url,key){
  try{ localStorage.setItem(HUBSYNC, JSON.stringify({url:url,key:key})); }catch(e){}
}

/* 棚と「各ツールがどの学期を見ているか」をひとまとめにする。
   どちらも取り込みで決まるものなので、手入力とぶつからない。 */
function rosterPayload(){
  let shelf={}, marks={};
  try{ shelf = JSON.parse(localStorage.getItem('juku_roster_v1')||'{}'); }catch(e){}
  try{ marks = JSON.parse(localStorage.getItem('juku_roster_mark_v1')||'{}'); }catch(e){}
  return JUKU_SYNC.stamp({ shelf:shelf, marks:marks });
}
function applyRosterPayload(d){
  if(!d) return 0;
  let n=0;
  if(d.shelf){ try{ localStorage.setItem('juku_roster_v1', JSON.stringify(d.shelf)); n=Object.keys(d.shelf).length; }catch(e){} }
  if(d.marks){ try{ localStorage.setItem('juku_roster_mark_v1', JSON.stringify(d.marks)); }catch(e){} }
  /* 端末をまたいで来たので、各ツールに読み直させる */
  try{ localStorage.removeItem('juku_roster_seen_v1'); }catch(e){}
  return n;
}

function hubSyncMsg(t, ng){
  const el=document.getElementById('impSyncMsg'); if(!el) return;
  el.innerHTML=t||''; el.className='imp-log'+(ng?' imp-ng':'');
}

async function hubSyncSave(opts){
  opts = opts || {};
  const cfg0 = hubSyncCfg();
  const url=((document.getElementById('impSyncUrl')||{}).value || cfg0.url || '').trim();
  const key=((document.getElementById('impSyncKey')||{}).value || cfg0.key || '').trim();
  if(!url||!key){ if(!opts.auto) hubSyncMsg('接続先URLと合言葉を入れてください', true); return; }
  saveHubSyncCfg(url,key);
  const body=JSON.stringify(rosterPayload());
  hubSyncMsg('スプシに保存中…（'+Math.round(body.length/1024)+'KB）');
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key:key, tool:'roster', data:body})});
    const d=await res.json();
    if(d.ok){
      JUKU_SYNC.noteSaved('roster'); JUKU_SYNC.refresh('impSyncInfo');
      hubSyncMsg('✅ 棚を保存しました（'+new Date().toLocaleTimeString()+'／'+JUKU_SYNC.deviceName()+'／'+Math.round((d.bytes||0)/1024)+'KB）');
    } else hubSyncMsg('エラー: '+esc(d.error||'不明'), true);
  }catch(e){ hubSyncMsg('通信エラー: ネット接続とURLを確認してください', true); }
}

async function hubSyncLoad(opts){
  opts = opts || {};
  const cfg0 = hubSyncCfg();
  const url=((document.getElementById('impSyncUrl')||{}).value || cfg0.url || '').trim();
  const key=((document.getElementById('impSyncKey')||{}).value || cfg0.key || '').trim();
  if(!url||!key){ hubSyncMsg('接続先URLと合言葉を入れてください', true); return; }
  saveHubSyncCfg(url,key);
  hubSyncMsg('スプシから読込中…');
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key:key, tool:'roster', action:'load'})});
    const d=await res.json();
    if(!d.ok){ hubSyncMsg('エラー: '+esc(d.error||'不明'), true); return; }
    if(!d.data){ hubSyncMsg('スプシにまだ棚が入っていません（先にPCで保存してください）', true); return; }
    const got=JSON.parse(d.data);
    const by=(got._meta||{}).savedBy||'';
    if(!opts.auto && !confirm('スプシの棚でこの端末の棚を置き換えます。\n'+
                (by?('最後に保存したのは「'+by+'」です。\n'):'')+
                'よろしいですか？（各ツールが持っているデータは消えません）')) { hubSyncMsg(''); return; }
    const n=applyRosterPayload(got);
    JUKU_SYNC.refresh('impSyncInfo');
    drawShelf(); drawTools();
    hubSyncMsg('✅ 棚を読み込みました（学期'+n+'つぶん'+(by?'／'+esc(by)+'が保存したもの':'')+'）。各ツールのタブを開くと反映されます。');
  }catch(e){ hubSyncMsg('通信エラー: ネット接続とURLを確認してください', true); }
}

function drawHubSync(){
  const box=document.getElementById('impSync'); if(!box) return;
  const c=hubSyncCfg();
  box.innerHTML =
    '<div class="imp-dim" style="margin-bottom:8px;line-height:1.8;">'+
      'PCで取り込んだ名簿を、スマホでも使えるようにします。<br>'+
      '<b>棚は取り込んだものだけ</b>なので、面談メモや配置とはぶつかりません。'+
      '接続先は他のツールで入れてあるものをそのまま使えます。'+
    '</div>'+
    '<div style="margin-bottom:6px;"><div class="imp-dim">接続先URL（Apps Scriptのウェブアプリ URL）</div>'+
      '<input type="text" id="impSyncUrl" value="'+esc(c.url||'')+'" placeholder="https://script.google.com/macros/s/.../exec" '+
      'style="width:100%;box-sizing:border-box;padding:6px 9px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;"></div>'+
    '<div style="margin-bottom:8px;"><div class="imp-dim">合言葉</div>'+
      '<input type="text" id="impSyncKey" value="'+esc(c.key||'')+'" placeholder="合言葉" '+
      'style="width:100%;box-sizing:border-box;padding:6px 9px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;"></div>'+
    '<button class="imp-btn" id="impSyncSave">⬆️ 棚をスプシに保存</button> '+
    '<button class="imp-btn" id="impSyncLoad" style="background:#64748b;">⬇️ スプシから棚を読込</button>'+
    '<label style="margin-left:10px;font-size:12px;color:#475569;">'+
      '<input type="checkbox" id="impAuto"'+(JUKU_SYNC.autoOn('roster')?' checked':'')+'> 自動でやりとりする</label>'+
    '<div id="impSyncMsg" class="imp-log"></div>'+
    '<div id="impSyncInfo" style="margin-top:10px;"></div>';
  document.getElementById('impSyncSave').onclick=()=>hubSyncSave();
  document.getElementById('impSyncLoad').onclick=()=>hubSyncLoad();
  document.getElementById('impAuto').onchange=function(){ JUKU_SYNC.setAuto('roster', this.checked); };
  JUKU_SYNC.mount('impSyncInfo','roster', ()=>({
    url:(document.getElementById('impSyncUrl').value||'').trim(),
    key:(document.getElementById('impSyncKey').value||'').trim()
  }));
}

function mountImport(pane){
  const local = location.protocol === 'file:';
  pane.innerHTML =
    '<div class="imp">'+
      (local ? '<div class="imp-warn"><b>この開き方では取り込みが動きません。</b><br>'+
        'ファイルを直接ダブルクリックで開くと、各ツールが別々の場所として扱われて連携できません。<br>'+
        '<b>START-TOOL.bat</b> から開くか、公開版（https）を使ってください。</div>' : '')+
      '<div class="imp-card">'+
        '<h3>取り込む</h3>'+
        '<div id="impDrop" class="imp-drop">ここにファイルをドラッグ＆ドロップ<br>'+
          '<span class="imp-dim">またはクリックしてファイルを選ぶ（まとめて選べます）</span>'+
          '<input type="file" id="impFile" multiple style="display:none"></div>'+
        '<div id="impQueue" style="margin-top:10px;"></div>'+
        '<div style="margin-top:10px;"><button id="impRun" class="imp-btn" disabled>この内容で取り込む</button></div>'+
        '<div id="impLog" class="imp-log"></div>'+
      '</div>'+
      '<div class="imp-card">'+
        '<h3>フォルダを見張る <span class="imp-dim">毎日のぶんを自動で</span></h3>'+
        '<div id="impWatch"></div>'+
      '</div>'+
      '<div class="imp-card">'+
        '<h3>スマホと共有する <span class="imp-dim">棚をスプレッドシート経由で</span></h3>'+
        '<div id="impSync"></div>'+
      '</div>'+
      '<div class="imp-card">'+
        '<h3>各ツールが今見ている学期 <span class="imp-dim">7月・8月・1月はツールごとに違うのが正しい</span></h3>'+
        '<div id="impTools"></div>'+
      '</div>'+
      '<div class="imp-card">'+
        '<h3>棚にある名簿 <span class="imp-dim">学期ごとにしまってあります</span></h3>'+
        '<div id="impShelf"></div>'+
        '<div style="margin-top:10px;"><button id="impWipe" class="imp-btn danger">棚を全部消す</button>'+
          '<span class="imp-dim"> 生徒の氏名・電話番号が入っているので、使わなくなったら消してください</span></div>'+
      '</div>'+
    '</div>';

  const drop = document.getElementById('impDrop');
  const file = document.getElementById('impFile');
  drop.onclick = ()=> file.click();
  file.onchange = ()=>{ addFiles([...file.files]); file.value=''; };
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{
    e.preventDefault(); drop.classList.add('on'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{
    e.preventDefault(); drop.classList.remove('on'); }));
  drop.addEventListener('drop', e=>{ addFiles([...e.dataTransfer.files]); });
  document.getElementById('impRun').onclick = runImport;
  document.getElementById('impWipe').onclick = ()=>{
    if(!confirm('棚にしまってある名簿を全部消します。よろしいですか？\n（各ツールが今持っているデータは消えません）')) return;
    JUKU_ROSTER.clearAll(); drawShelf();
  };
  drawQueue(); drawShelf(); drawTools();
  drawWatch(); drawHubSync();
  /* スプシのほうが新しければ、開いたときに自動で棚を読む */
  JUKU_SYNC.autoLoad('roster', hubSyncCfg(), hubSyncLoad, hubSyncMsg);
  /* 開いたときに一度だけ見にいく（許可が生きていれば黙って取り込む） */
  scanWatchDir(false);
}

/* 各ツールが今どの学期の名簿を見ているか。ここで直すこともできる。 */
const TOOLTERMS = [
  {k:'koma',   label:'コマ組',     note:'通常コマ。7月に2学期、12月に3学期、3月に次年度1学期'},
  {k:'grade',  label:'成績',       note:'テスト①②＝1学期、③④＝2学期、⑤＝3学期'},
  {k:'survey', label:'アンケート', note:'6〜10月は1学期、11〜1月は2学期、2〜3月は3学期'}
];
function drawTools(){
  const box=document.getElementById('impTools'); if(!box) return;
  let h='<table class="imp-tbl"><thead><tr><th>ツール</th><th>今見ている学期</th><th>棚</th><th>目安</th></tr></thead><tbody>';
  TOOLTERMS.forEach(t=>{
    const cur=JUKU_TERM.mark(t.k), want=JUKU_TERM.want(t.k);
    const look=cur||want;                                   /* 未設定なら目安の学期を見る */
    const has=!!JUKU_ROSTER.entry(look,'student');
    const opts=JUKU_TERM.list().map(x=>'<option value="'+x+'"'+(x===cur?' selected':'')+'>'+x+'</option>').join('');
    const shelfCell = has
      ? '<span class="imp-dim">'+esc(look)+'の名簿あり</span>'
      : '<span class="imp-ng">'+esc(look)+'の名簿が棚にありません</span>';
    h+='<tr><td><b>'+esc(t.label)+'</b></td>'+
       '<td><select data-k="'+t.k+'" class="imp-tt"><option value="">未設定（目安を使う）</option>'+opts+'</select></td>'+
       '<td>'+shelfCell+'</td>'+
       '<td class="imp-dim">'+esc(want)+(cur&&cur!==want?'<br><span class="imp-ng">目安とちがいます</span>':'')+'</td></tr>'+
       '<tr><td colspan="4" class="imp-dim" style="padding-top:0;border:none;">'+esc(t.note)+'</td></tr>';
  });
  h+='</tbody></table>';
  box.innerHTML=h;
  box.querySelectorAll('.imp-tt').forEach(s=>s.onchange=()=>{
    const k=s.dataset.k;
    JUKU_TERM.setMark(k, s.value);
    JUKU_ROSTER.forget(k);                /* 学期を変えたら、そのツールに読み直させる */
    /* そのツールを既に開いていれば、その場で読み直させる（開き直さなくて済むように） */
    try{
      const fr=document.querySelector('#pane-'+k+' iframe');
      const w=fr && fr.contentWindow;
      if(w && typeof w.pullRoster==='function') w.pullRoster(true);
      else if(w && typeof w.shelfNotice==='function') w.shelfNotice();
    }catch(e){}
    drawTools();
  });
}

try{const v=localStorage.getItem(LSTAB); if(v&&TOOLS.some(t=>t.k===v))init=v;}catch(e){}
show(init);
